  <script src="arcade.js"></script>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const rewardPreviewEl = document.getElementById('rewardPreview');
    const speedPreviewEl = document.getElementById('speedPreview');
    const playsEl = document.getElementById('plays');
    const balanceEl = document.getElementById('balance');
    const statusEl = document.getElementById('gameStatus');
    const startButton = document.getElementById('startButton');

    Arcade.gameGuide({
      game:'jungleHopper',
      surface:canvas,
      steps:[
        { icon:'👆', title:'Start', text:'Tap the jungle' },
        { icon:'🐸', title:'Control', text:'Keep tapping to hop' },
        { icon:'🌿', title:'Goal', text:'Pass through vine gaps' }
      ],
      overlayIcon:'👆',
      overlayTitle:'Tap to Start',
      overlayText:'Tap to hop · gold near the vines is optional',
      replayTitle:'Tap to Play Again',
      tips:[
        'Each tap gives the frog an upward hop. Gravity pulls it back down.',
        'Gold coins near gap edges add bonus Coins. Chasing them leaves less room to recover.',
        'Touching a vine, the top, or the ground ends the run.'
      ],
      reward:'Vines + collected gold earn up to 25 Arcade Coins per run.'
    });

    const frog = { x: 82, y: 270, r: 15, vy: 0 };
    const gravity = 0.42;
    const hopPower = -6.9;
    const obstacleWidth = 58;
    const BASE_GAP_SIZE = 150;
    const MIN_GAP_SIZE = 108;
    const BASE_SPEED = 2.35;
    const MAX_SPEED = 5.1;

    function difficultyFor(value) {
      // Long runs gradually get faster and tighter instead of staying flat forever.
      const speed = Math.min(MAX_SPEED, BASE_SPEED + value * 0.026);
      const gapSize = Math.max(MIN_GAP_SIZE, BASE_GAP_SIZE - value * 0.42);
      return { speed, gapSize };
    }
    const MAX_COINS = 25;

    let obstacles = [];
    let score = 0;
    let running = false;
    let starting = false;
    let animation = null;
    let frame = 0;
    let lastHopAt = 0;
    let bonusCoins = 0, coinsCollected = 0, spawned = 0;
    let particles = [], popups = [];
    let lastFrameAt = null, accumulator = 0;
    const STEP_MS = 1000 / 60;
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    function rewardFor(value) {
      let coins = Math.floor(value / 2);
      if (value >= 10) coins += 2;
      if (value >= 20) coins += 3;
      if (value >= 30) coins += 5;
      return Math.min(coins + bonusCoins, MAX_COINS);
    }

    function refreshChrome() {
      playsEl.textContent = Arcade.remaining('jungleHopper');
      balanceEl.textContent = Arcade.number('points').toLocaleString();
      rewardPreviewEl.textContent = rewardFor(score);
    }

    function setStatus(text, mode) {
      document.body.classList.toggle('game-active', mode === 'running');
      statusEl.textContent = text;
      statusEl.className = 'game-status' + (mode ? ' ' + mode : '');
    }

    function spawnObstacle(x = canvas.width + 25) {
      const margin = 76;
      const { gapSize } = difficultyFor(score);
      let gapY = margin + gapSize / 2 + Math.random() * (canvas.height - margin * 2 - gapSize);
      const previous = obstacles[obstacles.length - 1];
      // Limit abrupt vertical jumps at higher speed; risk comes from optional gold.
      if (previous) gapY = Math.max(previous.gapY - 100, Math.min(previous.gapY + 100, gapY));
      const index = ++spawned;
      const side = index % 4 === 2 ? -1 : 1;
      const gold = index % 2 === 0 ? {
        y:gapY + side * (gapSize / 2 - frog.r - 14),
        value:index % 6 === 0 ? 2 : 1, taken:false
      } : null;
      obstacles.push({ x, gapY, gapSize, scored:false, gold });
    }

    function resetGame() {
      // A replay must own exactly one animation loop and begin from a fully
      // neutral frog state, even if the previous run ended mid-frame.
      if (animation !== null) {
        cancelAnimationFrame(animation);
        animation = null;
      }
      frog.y = 270;
      frog.vy = 0;
      obstacles = [];
      score = 0;
      frame = 0;
      lastHopAt = 0;
      bonusCoins = 0; coinsCollected = 0; spawned = 0;
      particles = []; popups = [];
      lastFrameAt = null; accumulator = 0;
      document.getElementById('goldPreview').textContent = 'Gold +0';
      document.getElementById('jungleZone').textContent = 'EMERALD CANOPY';
      scoreEl.textContent = '0';
      rewardPreviewEl.textContent = '0';
      speedPreviewEl.textContent = '1.0';
      spawnObstacle(canvas.width + 85);
      spawnObstacle(canvas.width + 85 + 210);
      spawnObstacle(canvas.width + 85 + 420);
    }

    function ellipse(x,y,rx,ry,color,rotation=0) {
      ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,rotation,0,Math.PI*2);ctx.fill();
    }
    function drawJungle() {
      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, '#164267');sky.addColorStop(.48, '#228d85');sky.addColorStop(1, '#16554d');
      ctx.fillStyle=sky;ctx.fillRect(0,0,360,560);
      const sun=ctx.createRadialGradient(265,112,4,265,112,160);
      sun.addColorStop(0,'#fff2b599');sun.addColorStop(1,'#72edbc00');
      ctx.fillStyle=sun;ctx.fillRect(80,0,280,320);
      ellipse(265,112,28,28,'#fff1b766');
      // Two distant canopy layers, temple stones, and drifting fireflies.
      for(let layer=0;layer<2;layer++) {
        for(let i=0;i<7;i++) {
          const x=((i*83-frame*(layer+1)*.12)%580+580)%580-90;
          const y=165+(i%3)*51+layer*110;
          ctx.fillStyle=layer?'#125653':'#26746b';ctx.fillRect(x,y,13,560-y);
          ellipse(x+4,y,55,45,layer?'#176659':'#348c76');
          ellipse(x-18,y+24,38,24,layer?'#176659':'#348c76');
        }
      }
      ctx.fillStyle='#377d70';
      for(let i=0;i<3;i++) {
        const x=((i*164-frame*.19)%520+520)%520-80;
        ctx.fillRect(x,424,52,108);ctx.fillRect(x-7,419,66,9);
        ctx.fillStyle='#62b6a1';ctx.fillRect(x+7,432,5,70);ctx.fillStyle='#377d70';
      }
      if(!reducedMotion) for(let i=0;i<16;i++) {
        const x=((i*47-frame*.3)%380+380)%380;
        const y=70+(i*71)%435+Math.sin(frame*.017+i)*8;
        ellipse(x,y,1.5,1.5,'#dcffad'+(Math.sin(frame*.04+i)>0?'ab':'44'));
      }
      const ground=ctx.createLinearGradient(0,531,0,560);
      ground.addColorStop(0,'#79b85b');ground.addColorStop(.13,'#284f32');ground.addColorStop(1,'#14251f');
      ctx.fillStyle=ground;ctx.fillRect(0,532,360,28);
      for(let i=0;i<24;i++) ellipse(((i*21-frame*1.3)%400+400)%400-20,535,10,3,'#8ac76e');
      // Hanging foreground leaves stay above the flight corridor.
      for(let i=0;i<10;i++) ellipse(i*41,8+(i%3)*6,30,13,'#216d4f',i%2?.6:-.6);
    }

    function drawVinePart(x, y, h, fromTop) {
      if(h<=0)return;
      ctx.save();
      const wood=ctx.createLinearGradient(x,0,x+obstacleWidth,0);
      wood.addColorStop(0,'#18583c');wood.addColorStop(.2,'#65ac42');
      wood.addColorStop(.5,'#347f3a');wood.addColorStop(.85,'#99cf53');wood.addColorStop(1,'#225837');
      ctx.fillStyle=wood;ctx.fillRect(x,y,obstacleWidth,h);
      ctx.strokeStyle='#d3ff9399';ctx.lineWidth=2;
      for(let strand=0;strand<3;strand++) {
        ctx.beginPath();ctx.moveTo(x+8+strand*19,y);
        for(let py=0;py<h;py+=8)ctx.lineTo(x+8+strand*19+Math.sin(py*.045+strand)*4,y+py);
        ctx.stroke();
      }
      // The whole collidable width has a visible edge and moss cap.
      const edgeY=fromTop?y+h-6:y;
      ctx.fillStyle='#b7e963';ctx.fillRect(x,edgeY,obstacleWidth,6);
      ctx.fillStyle='#f6ffc5';ctx.fillRect(x,fromTop?y+h-2:y,obstacleWidth,2);
      for(let i=0;i<5;i++)ellipse(x+6+i*11,edgeY+3,8,4,i%2?'#598f46':'#a6cb6c',i%2?.35:-.35);
      for(let py=24;py<h-16;py+=38) {
        ellipse(x+7,y+py,11,5,'#85d96c',-.7);
        ellipse(x+obstacleWidth-7,y+py+15,11,5,'#4abc7b',.7);
      }
      ctx.restore();
    }

    function drawGold(o) {
      if(!o.gold||o.gold.taken)return;
      const x=o.x+obstacleWidth/2,y=o.gold.y;
      const pulse=reducedMotion?1:1+Math.sin(frame*.075)*.12;
      ctx.save();
      ctx.shadowColor='#ffce46';ctx.shadowBlur=23;
      ctx.strokeStyle='#fff1a8';ctx.lineWidth=1;
      for(let i=0;i<4;i++){const angle=i*Math.PI/2+(reducedMotion?0:frame*.025);const sx=x+Math.cos(angle)*18,sy=y+Math.sin(angle)*18;ctx.beginPath();ctx.moveTo(sx-2,sy);ctx.lineTo(sx+2,sy);ctx.moveTo(sx,sy-2);ctx.lineTo(sx,sy+2);ctx.stroke();}
      ellipse(x,y,13*pulse,13*pulse,'#ffdb6c22');
      ellipse(x,y,10,11,'#f6af30');ctx.shadowBlur=0;
      ellipse(x-1,y-1,7.5,8.5,'#ffe69a');
      ctx.strokeStyle='#ba742b';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(x,y,6.5,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle='#8b4b21';ctx.font='bold 11px Arial';ctx.textAlign='center';
      ctx.fillText(o.gold.value===2?'2':'1',x,y+4);
      ctx.fillStyle='#fff4bf';ctx.fillRect(x-5,y-6,3,2);
      ctx.restore();
    }

    function collectGold(o) {
      if(!o.gold||o.gold.taken||rewardFor(score)>=MAX_COINS)return;
      const x=o.x+obstacleWidth/2,y=o.gold.y;
      // A deliberate line is required; the safe middle misses the gold.
      if(Math.hypot(frog.x-x,frog.y-y)>frog.r+5)return;
      o.gold.taken=true;coinsCollected++;
      const gained=Math.min(o.gold.value,MAX_COINS-rewardFor(score));
      bonusCoins+=gained;
      rewardPreviewEl.textContent=rewardFor(score);
      document.getElementById('goldPreview').textContent='Gold +'+bonusCoins;
      Arcade.feedback('score');
      popups.push({x,y,text:'+'+gained+' GOLD',life:45});
      if(!reducedMotion)for(let i=0;i<16;i++)particles.push({x,y,vx:Math.cos(i*Math.PI/8)*3,vy:Math.sin(i*Math.PI/8)*3,life:24});
    }
    function drawObstacle(o) {
      const topH = Math.max(0, o.gapY - o.gapSize / 2);
      const bottomY = o.gapY + o.gapSize / 2;
      drawVinePart(o.x, 0, topH, true);
      drawVinePart(o.x, bottomY, canvas.height - bottomY, false);
    }

    function drawFrog() {
      ctx.save();
      ctx.translate(frog.x, frog.y);
      ctx.rotate(Math.max(-.35, Math.min(.55, frog.vy * .045)));

      ctx.shadowColor = '#39ff88';
      ctx.shadowBlur = 9;
      const skin=ctx.createLinearGradient(0,-17,0,18);
      skin.addColorStop(0,'#c0ef72');skin.addColorStop(.45,'#62c56e');skin.addColorStop(1,'#228764');
      ctx.fillStyle = skin;
      ctx.beginPath();
      ctx.ellipse(0, 1, 18, 15, 0, 0, Math.PI * 2);
      ctx.fill();

      ellipse(3,7,11,7,'#d4efa0');
      ellipse(-13,1,3,2,'#218b64');
      ctx.fillStyle = '#a5df70';
      ctx.beginPath();
      ctx.arc(-9, -11, 8, 0, Math.PI * 2);
      ctx.arc(9, -11, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-9, -12, 4, 0, Math.PI * 2);
      ctx.arc(9, -12, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#111827';
      ctx.beginPath();
      ctx.arc(-8, -12, 2, 0, Math.PI * 2);
      ctx.arc(8, -12, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#14532d';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-9, 10);
      ctx.lineTo(-20, 17);
      ctx.moveTo(9, 10);
      ctx.lineTo(20, 17);
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.strokeStyle='#235442';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(3,2,6,.1,2.4);ctx.stroke();
      ellipse(13,1,3,2,'#f7b678');
      ctx.restore();
    }

    function draw() {
      drawJungle();
      obstacles.forEach(drawObstacle);
      if(rewardFor(score)<MAX_COINS)obstacles.forEach(drawGold);
      drawFrog();
      for(const p of particles){ctx.globalAlpha=p.life/24;ellipse(p.x,p.y,2,2,'#ffe89a');}
      for(const p of popups){ctx.globalAlpha=p.life/45;ctx.fillStyle='#fff2b0';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.strokeStyle='#493014';ctx.lineWidth=3;ctx.strokeText(p.text,p.x,p.y);ctx.fillText(p.text,p.x,p.y);}
      ctx.globalAlpha=1;

      if (!running) {
        ctx.fillStyle = 'rgba(15,23,42,.55)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = '700 21px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('One more hop.', canvas.width / 2, canvas.height / 2);
        ctx.font='13px Arial';ctx.fillStyle='#ffdfa0';ctx.fillText('Chase the gold. Watch the vines.',180,canvas.height/2+26);
      }
    }

    function circleRectCollision(cx, cy, r, rx, ry, rw, rh) {
      const nearestX = Math.max(rx, Math.min(cx, rx + rw));
      const nearestY = Math.max(ry, Math.min(cy, ry + rh));
      const dx = cx - nearestX;
      const dy = cy - nearestY;
      return dx * dx + dy * dy < r * r;
    }

    function hop(force = false) {
      if (!running || document.body.classList.contains('earnly-game-paused')) return;
      const now = performance.now();
      // Ignore duplicate synthetic/near-simultaneous taps, but keep normal rapid hopping responsive.
      if (!force && now - lastHopAt < 55) return;
      lastHopAt = now;
      Arcade.feedback('hop');
      frog.vy = hopPower;
    }

    function stepGame() {
      if (!running || pauseStartedAt) return;
      frame += 1;
      for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.07;p.life--;}
      for(const p of popups){p.y-=.65;p.life--;}
      particles=particles.filter(p=>p.life>0);popups=popups.filter(p=>p.life>0);
      frog.vy += gravity;
      frog.y += frog.vy;

      for (const o of obstacles) {
        const { speed } = difficultyFor(score);
        o.x -= speed;

        if (!o.scored && o.x + obstacleWidth < frog.x) {
          o.scored = true;
          score += 1;
          scoreEl.textContent = score;
          rewardPreviewEl.textContent = rewardFor(score);
          const difficulty=difficultyFor(score);
          speedPreviewEl.textContent=(difficulty.speed/BASE_SPEED).toFixed(1);
          document.getElementById('jungleZone').textContent=score>=30?'LOST TEMPLE':score>=20?'WILD RAPIDS':score>=10?'DEEP JUNGLE':'EMERALD CANOPY';
          if(score===10 || score===20 || score===30){
            Arcade.feedback('score',{message:'🐸 Faster vines · '+speedPreviewEl.textContent+'x speed'});
          }

          if (score === 10) Arcade.milestone('🐸 10 vines · Jungle Pro!');
          if (score === 20) Arcade.milestone('🌿 20 vines · Deep jungle!', 'perfect');
          if (score === 30) Arcade.milestone('🏆 30 vines · Legendary hop!', 'perfect');
        }

        const topH = o.gapY - o.gapSize / 2;
        const bottomY = o.gapY + o.gapSize / 2;

        if (
          circleRectCollision(frog.x, frog.y, frog.r, o.x, 0, obstacleWidth, topH) ||
          circleRectCollision(frog.x, frog.y, frog.r, o.x, bottomY, obstacleWidth, canvas.height - bottomY)
        ) {
          finishGame();
          return;
        }
        collectGold(o);
      }

      obstacles = obstacles.filter(o => o.x + obstacleWidth > -20);
      if (obstacles.length && obstacles[obstacles.length - 1].x < canvas.width - 190) {
        spawnObstacle(canvas.width + 30);
      }

      if (frog.y - frog.r <= 0 || frog.y + frog.r >= canvas.height - 28) {
        finishGame();
        return;
      }

    }

    function loop(timestamp) {
      if(!running || pauseStartedAt)return;
      if(lastFrameAt===null)lastFrameAt=timestamp;
      accumulator+=Math.min(50,Math.max(0,timestamp-lastFrameAt));
      lastFrameAt=timestamp;
      while(accumulator+1e-6>=STEP_MS && running){accumulator-=STEP_MS;stepGame();}
      if(!running)return;
      draw();
      animation=requestAnimationFrame(loop);
    }

    function finishGame() {
      if (!running) return;
      running = false;
      pauseStartedAt = 0;
      cancelAnimationFrame(animation);
      animation = null;

      const earned = rewardFor(score);
      Arcade.earn(earned, 'Jungle Hopper', { kind:'game', game:'jungleHopper', metric:score, aux:bonusCoins });
      Arcade.feedback('fail');
      const result = Arcade.recordResult('jungleHopper', score);

      const best = Math.max(score, Arcade.number('jungleHopperBest'));
      localStorage.setItem('jungleHopperBest', String(best));

      starting = false;
      refreshChrome();
      setStatus('Game Over', 'over');
      startButton.disabled = false;
      startButton.textContent = '👆 Tap Jungle to Play Again';
      draw();

      Arcade.gameResult({
        icon:'🐸',
        title:'Jungle Run Over',
        scoreLabel:'Vines Passed',
        score,
        best:best + ' vines',
        coins:earned,
        result,
        playsLeft:Arcade.remaining('jungleHopper'),
        game:'jungleHopper',
        extra:['🪙 Gold collected: '+coinsCollected+' · Bonus: +'+bonusCoins+' Coins (25 total max)', '⏱️ Time played: '+Math.max(1,Math.round((performance.now()-earnlyRunStartedAt-totalPausedMs)/1000))+'s',score>=20?'🌿 Deep-jungle run!':score>=10?'🐸 Jungle Pro territory.':'Time the hops and find the rhythm.'],
        onReplay:startGame,
        onMorePlays:()=>Arcade.out('jungleHopper',refreshChrome)
      });
    }

    let earnlyRunStartedAt=0,totalPausedMs=0,pauseStartedAt=0;
    function startGame() {
      if (running || starting) return;
      starting = true;

      if (!Arcade.consume('jungleHopper')) {
        starting = false;
        Arcade.out('jungleHopper', refreshChrome);
        return;
      }
      earnlyRunStartedAt=0; totalPausedMs=0; pauseStartedAt=0; 

      resetGame();
      running = false;
      startButton.disabled = true;
      startButton.textContent = 'Get Ready…';
      setStatus('Get Ready');
      refreshChrome();
      draw();

      Arcade.countdown(() => {
        starting = false;
        running = true;
        earnlyRunStartedAt = performance.now();
        startButton.textContent = 'Game Running';
        setStatus('Running', 'running');
        hop(true);
        animation = requestAnimationFrame(loop);
      });
    }

    function handleJungleInput() {
      if (!running) {
        if (!starting) startGame();
        return;
      }
      hop();
    }

    canvas.addEventListener('touchstart', event => {
      event.preventDefault();
      event.stopPropagation();
      if (event.touches.length !== 1) return;
      handleJungleInput();
    }, { passive:false });

    canvas.addEventListener('touchmove', event => {
      event.preventDefault();
    }, { passive:false });

    canvas.addEventListener('touchend', event => {
      event.preventDefault();
    }, { passive:false });

    canvas.addEventListener('pointerdown', event => {
      if (event.pointerType === 'touch' || event.isPrimary === false || (event.pointerType === 'mouse' && event.button !== 0)) return;
      event.preventDefault();
      handleJungleInput();
    });

    document.addEventListener('pointerdown', event => {
      if (event.target === canvas || !Arcade.inExpandedGameZone(event, canvas, 135)) return;
      if (event.isPrimary === false || (event.pointerType === 'mouse' && event.button !== 0)) return;
      event.preventDefault();
      handleJungleInput();
    }, { passive:false });

    canvas.addEventListener('dblclick', event => {
      event.preventDefault();
      event.stopPropagation();
    }, { passive:false });

    canvas.addEventListener('contextmenu', event => event.preventDefault());

    document.addEventListener('keydown', event => {
      if (event.code === 'Space' || event.key === 'ArrowUp') {
        event.preventDefault();
        // Do not let keyboard input during idle/countdown preload a hop.
        if (running) hop();
      }
    });

    Arcade.installPauseControl({
      isRunning:()=>running,
      pause:()=>{
        if(!running||pauseStartedAt)return;
        pauseStartedAt=performance.now();
        cancelAnimationFrame(animation);
        animation=null;
      },
      resume:()=>{
        if(!running||!pauseStartedAt)return;
        totalPausedMs+=performance.now()-pauseStartedAt;
        pauseStartedAt=0;
        lastFrameAt=null; accumulator=0;
        cancelAnimationFrame(animation);
        animation=null;
        animation=requestAnimationFrame(loop);
      }
    });
    startButton.addEventListener('click', startGame);
    resetGame();
    refreshChrome();
    draw();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cloud.js"></script>
</body>
</html>
