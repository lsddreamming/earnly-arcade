<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earnly Snake</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 25px 15px;
    }

    canvas {
      background: #1f2937;
      border: 3px solid white;
      max-width: 100%;
    }

    button {
      padding: 14px 18px;
      margin: 5px;
      margin-top: 15px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .control-button {
      background: #3b82f6;
      color: white;
    }

    .start-button {
      background: #22c55e;
      color: white;
    }

    .back-button {
      background: #374151;
      color: white;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🐍 Earnly Snake</h1>

    <p>
      Score:
      <span id="score">0</span>
    </p>

    <button
      class="start-button"
      id="startButton"
      onclick="startGame()"
    >
      ▶️ Start Game
    </button>

    <br>

    <canvas
      id="game"
      width="400"
      height="400"
    ></canvas>

    <br>

    <div class="controls">

      <button
        class="control-button"
        onclick="setDirection('UP')"
      >
        ⬆️
      </button>

      <div>

        <button
          class="control-button"
          onclick="setDirection('LEFT')"
        >
          ⬅️
        </button>

        <button
          class="control-button"
          onclick="setDirection('DOWN')"
        >
          ⬇️
        </button>

        <button
          class="control-button"
          onclick="setDirection('RIGHT')"
        >
          ➡️
        </button>

      </div>

    </div>

    <button
      class="back-button"
      onclick="window.location.href='games.html'"
    >
      ⬅ Back to Games
    </button>

  </div>

  <script>
    const canvas =
      document.getElementById("game");

    const ctx =
      canvas.getContext("2d");

    const box = 20;

    const freeGameLimit = 3;

    let snakeGamesPlayed =
      Number(
        localStorage.getItem("snakeGamesPlayed")
      ) || 0;

    if (snakeGamesPlayed >= freeGameLimit) {
      alert(
        "You've used your 3 Snake plays. Unlock more from the Arcade."
      );

      window.location.href = "games.html";
    }

    let snake = [
      { x: 200, y: 200 }
    ];

    let direction = "RIGHT";

    let food = {
      x:
        Math.floor(Math.random() * 20) * box,

      y:
        Math.floor(Math.random() * 20) * box
    };

    let score = 0;

    let game = null;

    document.addEventListener(
      "keydown",
      changeDirection
    );

    function setDirection(newDirection) {

      if (
        newDirection === "LEFT" &&
        direction !== "RIGHT"
      ) {
        direction = "LEFT";
      }

      if (
        newDirection === "UP" &&
        direction !== "DOWN"
      ) {
        direction = "UP";
      }

      if (
        newDirection === "RIGHT" &&
        direction !== "LEFT"
      ) {
        direction = "RIGHT";
      }

      if (
        newDirection === "DOWN" &&
        direction !== "UP"
      ) {
        direction = "DOWN";
      }
    }

    function changeDirection(event) {

      if (
        event.key === "ArrowLeft" &&
        direction !== "RIGHT"
      ) {
        direction = "LEFT";
      }

      if (
        event.key === "ArrowUp" &&
        direction !== "DOWN"
      ) {
        direction = "UP";
      }

      if (
        event.key === "ArrowRight" &&
        direction !== "LEFT"
      ) {
        direction = "RIGHT";
      }

      if (
        event.key === "ArrowDown" &&
        direction !== "UP"
      ) {
        direction = "DOWN";
      }
    }

    function draw() {

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      for (
        let i = 0;
        i < snake.length;
        i++
      ) {

        ctx.fillStyle =
          i === 0
            ? "#22c55e"
            : "#4ade80";

        ctx.fillRect(
          snake[i].x,
          snake[i].y,
          box,
          box
        );
      }

      ctx.fillStyle = "#ef4444";

      ctx.fillRect(
        food.x,
        food.y,
        box,
        box
      );

      let snakeX = snake[0].x;
      let snakeY = snake[0].y;

      if (direction === "LEFT") {
        snakeX -= box;
      }

      if (direction === "UP") {
        snakeY -= box;
      }

      if (direction === "RIGHT") {
        snakeX += box;
      }

      if (direction === "DOWN") {
        snakeY += box;
      }

      if (
        snakeX === food.x &&
        snakeY === food.y
      ) {

        score++;

        document.getElementById(
          "score"
        ).textContent = score;

        food = {
          x:
            Math.floor(
              Math.random() * 20
            ) * box,

          y:
            Math.floor(
              Math.random() * 20
            ) * box
        };

      } else {

        snake.pop();
      }

      const newHead = {
        x: snakeX,
        y: snakeY
      };

      if (
        snakeX < 0 ||
        snakeY < 0 ||
        snakeX >= canvas.width ||
        snakeY >= canvas.height ||
        collision(newHead, snake)
      ) {

        gameOver();
        return;
      }

      snake.unshift(newHead);
    }

    function collision(head, body) {

      for (
        let i = 0;
        i < body.length;
        i++
      ) {

        if (
          head.x === body[i].x &&
          head.y === body[i].y
        ) {
          return true;
        }
      }

      return false;
    }

    function gameOver() {

      clearInterval(game);
      game = null;

      snakeGamesPlayed =
        snakeGamesPlayed + 1;

      localStorage.setItem(
        "snakeGamesPlayed",
        snakeGamesPlayed
      );

      /*
        Snake reward system:

        1 apple = 1 Arcade Coin
        Maximum 5 Arcade Coins per game
      */

      let earnedCoins =
        Math.min(score, 5);

      let points =
        Number(
          localStorage.getItem("points")
        ) || 0;

      points =
        points + earnedCoins;

      localStorage.setItem(
        "points",
        points
      );

      let playsLeft =
        Math.max(
          0,
          freeGameLimit -
          snakeGamesPlayed
        );

      if (playsLeft === 0) {

        alert(
          "Game Over!\n\n" +
          "Score: " + score +
          "\nYou earned " +
          earnedCoins +
          " Arcade Coins!" +
          "\n\nYou've used all 3 Snake plays."
        );

        window.location.href =
          "games.html";

        return;
      }

      let playAgain =
        confirm(
          "Game Over!\n\n" +
          "Score: " + score +
          "\nYou earned " +
          earnedCoins +
          " Arcade Coins!" +
          "\n\nSnake plays remaining: " +
          playsLeft +
          "\n\nPlay again?"
        );

      if (playAgain) {

        location.reload();

      } else {

        window.location.href =
          "games.html";
      }
    }

    function startGame() {

      if (game !== null) {
        return;
      }

      game =
        setInterval(
          draw,
          120
        );

      const startButton =
        document.getElementById(
          "startButton"
        );

      startButton.disabled = true;

      startButton.textContent =
        "🎮 Game Running";
    }

  </script>

</body>
</html>
