<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earnly Snake</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 25px 15px;
    }

    canvas {
      background: #1f2937;
      border: 3px solid white;
      max-width: 100%;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    button {
      padding: 14px 18px;
      margin: 5px;
      margin-top: 15px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .control-button {
      background: #3b82f6;
      color: white;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    .swipe-hint {
      margin: 10px 0 0;
      color: #9ca3af;
      font-size: 14px;
    }

    @media (pointer: coarse) {
      .controls {
        display: none;
      }
    }

    .start-button {
      background: #22c55e;
      color: white;
    }

    .back-button {
      background: #374151;
      color: white;
    }
  </style>
<link rel="stylesheet" href="arcade.css">
</head>

<body>

  <div class="container">

    <h1>🐍 Earnly Snake</h1>

    <p>
      Score:
      <span id="score">0</span>
    </p>

    <button
      class="start-button"
      id="startButton"
      onclick="startGame()"
    >
      ▶️ Start Game
    </button>

    <br>

    <canvas
      id="game"
      width="400"
      height="400"
    ></canvas>

    <p class="swipe-hint">Swipe on the game board to move</p>

    <br>

    <div class="controls">

      <button
        class="control-button"
        onclick="setDirection('UP')"
      >
        ⬆️
      </button>

      <div>

        <button
          class="control-button"
          onclick="setDirection('LEFT')"
        >
          ⬅️
        </button>

        <button
          class="control-button"
          onclick="setDirection('DOWN')"
        >
          ⬇️
        </button>

        <button
          class="control-button"
          onclick="setDirection('RIGHT')"
        >
          ➡️
        </button>

      </div>

    </div>

    <button
      class="back-button"
      onclick="window.location.href='games.html'"
    >
      ⬅ Back to Games
    </button>

  </div>

  <script src="arcade.js"></script>
  <script>
    const canvas =
      document.getElementById("game");

    const ctx =
      canvas.getContext("2d");

    const box = 20;

    const freeGameLimit = 3;

    let snakeGamesPlayed =
      Number(
        localStorage.getItem("snakeGamesPlayed")
      ) || 0;

    let snake = [
      { x: 200, y: 200 }
    ];

    let direction = "RIGHT";

    let food = {
      x:
        Math.floor(Math.random() * 20) * box,

      y:
        Math.floor(Math.random() * 20) * box
    };

    let score = 0;

    let game = null;

    document.addEventListener(
      "keydown",
      changeDirection
    );

    let touchStartX = 0;
    let touchStartY = 0;
    const swipeThreshold = 24;

    canvas.addEventListener(
      "touchstart",
      function (event) {
        if (!event.touches.length) return;

        touchStartX = event.touches[0].clientX;
        touchStartY = event.touches[0].clientY;
        event.preventDefault();
      },
      { passive: false }
    );

    canvas.addEventListener(
      "touchmove",
      function (event) {
        event.preventDefault();
      },
      { passive: false }
    );

    canvas.addEventListener(
      "touchend",
      function (event) {
        if (!event.changedTouches.length) return;

        const touchEndX = event.changedTouches[0].clientX;
        const touchEndY = event.changedTouches[0].clientY;

        const deltaX = touchEndX - touchStartX;
        const deltaY = touchEndY - touchStartY;

        if (
          Math.abs(deltaX) < swipeThreshold &&
          Math.abs(deltaY) < swipeThreshold
        ) {
          return;
        }

        if (Math.abs(deltaX) > Math.abs(deltaY)) {
          setDirection(deltaX > 0 ? "RIGHT" : "LEFT");
        } else {
          setDirection(deltaY > 0 ? "DOWN" : "UP");
        }

        event.preventDefault();
      },
      { passive: false }
    );

    function setDirection(newDirection) {

      if (
        newDirection === "LEFT" &&
        direction !== "RIGHT"
      ) {
        direction = "LEFT";
      }

      if (
        newDirection === "UP" &&
        direction !== "DOWN"
      ) {
        direction = "UP";
      }

      if (
        newDirection === "RIGHT" &&
        direction !== "LEFT"
      ) {
        direction = "RIGHT";
      }

      if (
        newDirection === "DOWN" &&
        direction !== "UP"
      ) {
        direction = "DOWN";
      }
    }

    function changeDirection(event) {
      if(event.key.startsWith("Arrow")) event.preventDefault();

      if (
        event.key === "ArrowLeft" &&
        direction !== "RIGHT"
      ) {
        direction = "LEFT";
      }

      if (
        event.key === "ArrowUp" &&
        direction !== "DOWN"
      ) {
        direction = "UP";
      }

      if (
        event.key === "ArrowRight" &&
        direction !== "LEFT"
      ) {
        direction = "RIGHT";
      }

      if (
        event.key === "ArrowDown" &&
        direction !== "UP"
      ) {
        direction = "DOWN";
      }
    }

    function draw() {

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      for (
        let i = 0;
        i < snake.length;
        i++
      ) {

        ctx.fillStyle =
          i === 0
            ? "#22c55e"
            : "#4ade80";

        ctx.fillRect(
          snake[i].x,
          snake[i].y,
          box,
          box
        );
      }

      ctx.fillStyle = "#ef4444";

      ctx.fillRect(
        food.x,
        food.y,
        box,
        box
      );

      let snakeX = snake[0].x;
      let snakeY = snake[0].y;

      if (direction === "LEFT") {
        snakeX -= box;
      }

      if (direction === "UP") {
        snakeY -= box;
      }

      if (direction === "RIGHT") {
        snakeX += box;
      }

      if (direction === "DOWN") {
        snakeY += box;
      }

      if (
        snakeX === food.x &&
        snakeY === food.y
      ) {

        score++;

        document.getElementById(
          "score"
        ).textContent = score;

        food = {
          x:
            Math.floor(
              Math.random() * 20
            ) * box,

          y:
            Math.floor(
              Math.random() * 20
            ) * box
        };

      } else {

        snake.pop();
      }

      const newHead = {
        x: snakeX,
        y: snakeY
      };

      if (
        snakeX < 0 ||
        snakeY < 0 ||
        snakeX >= canvas.width ||
        snakeY >= canvas.height ||
        collision(newHead, snake)
      ) {

        gameOver();
        return;
      }

      snake.unshift(newHead);
    }

    function collision(head, body) {

      for (
        let i = 0;
        i < body.length;
        i++
      ) {

        if (
          head.x === body[i].x &&
          head.y === body[i].y
        ) {
          return true;
        }
      }

      return false;
    }

    function gameOver() {
      if(game===null)return;
      clearInterval(game);game=null;
      const earned=Math.min(score,5);Arcade.earn(earned);
      document.getElementById('startButton').disabled=false;
      document.getElementById('startButton').textContent='Play Again';
      Arcade.panel('Game Over','Score: '+score+' · +'+earned+' Arcade Coins · '+Arcade.remaining('snake')+' plays left',
        [['Play Again',startGame],['Back to Arcade',()=>location.href='games.html']]);
    }

    function startGame() {

      if (game !== null) {
        return;
      }

      if(!Arcade.consume('snake')){Arcade.out('snake',()=>{});return;}
      snake=[{x:200,y:200}];direction='RIGHT';score=0;
      document.getElementById('score').textContent=0;
      food={x:100,y:100};
      game =
        setInterval(
          draw,
          120
        );

      const startButton =
        document.getElementById(
          "startButton"
        );

      startButton.disabled = true;

      startButton.textContent =
        "🎮 Game Running";
    }

  </script>

</body>
</html>
