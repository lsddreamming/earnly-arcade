<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earnly Arcade Games</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 38px;
    }

    .balance {
      background: #1f2937;
      padding: 20px;
      border-radius: 16px;
      margin: 20px 0;
    }

    button {
      width: 100%;
      padding: 18px;
      margin: 8px 0;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .game-button {
      background: #3b82f6;
      color: white;
    }

    .ad-button {
      background: #22c55e;
      color: white;
    }

    .coin-button {
      background: #f59e0b;
      color: white;
    }

    .back-button {
      background: #374151;
      color: white;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🕹 Earnly Arcade</h1>
    <p>Choose a game</p>

    <div class="balance">
      Arcade Coins:
      <strong id="points">0</strong>
    </div>

    <div class="balance">
      <h2>🐍 Snake</h2>
      <p>
        Plays Remaining:
        <strong id="snakePlaysRemaining">3</strong>
      </p>

      <button class="game-button"
        onclick="window.location.href='snake.html'">
        🐍 Play Snake
      </button>

      <button class="ad-button"
        id="snakeAdButton"
        onclick="watchAdForSnake()">
        📺 Watch Ad for 3 Snake Plays
      </button>

      <button class="coin-button"
        id="snakeCoinButton"
        onclick="buySnakePlays()">
        🪙 Spend 30 Coins for 3 Snake Plays
      </button>
    </div>

    <div class="balance">
      <h2>🧱 Block Drop</h2>
      <p>
        Plays Remaining:
        <strong id="blockDropPlaysRemaining">3</strong>
      </p>

      <button class="game-button"
        onclick="window.location.href='blockdrop.html'">
        🧱 Play Block Drop
      </button>

      <button class="ad-button"
        id="blockDropAdButton"
        onclick="watchAdForBlockDrop()">
        📺 Watch Ad for 3 Block Drop Plays
      </button>

      <button class="coin-button"
        id="blockDropCoinButton"
        onclick="buyBlockDropPlays()">
        🪙 Spend 30 Coins for 3 Block Drop Plays
      </button>
    </div>

    <button class="back-button"
      onclick="window.location.href='index.html'">
      ⬅ Back Home
    </button>

  </div>

  <script>
    let points = Number(localStorage.getItem("points")) || 0;
    document.getElementById("points").textContent = points;

    let snakeGamesPlayed =
      Number(localStorage.getItem("snakeGamesPlayed")) || 0;

    let blockDropGamesPlayed =
      Number(localStorage.getItem("blockDropGamesPlayed")) || 0;

    let snakePlaysRemaining =
      Math.max(0, 3 - snakeGamesPlayed);

    let blockDropPlaysRemaining =
      Math.max(0, 3 - blockDropGamesPlayed);

    document.getElementById("snakePlaysRemaining").textContent =
      snakePlaysRemaining;

    document.getElementById("blockDropPlaysRemaining").textContent =
      blockDropPlaysRemaining;

    const snakeAdButton =
      document.getElementById("snakeAdButton");

    const snakeCoinButton =
      document.getElementById("snakeCoinButton");

    const blockDropAdButton =
      document.getElementById("blockDropAdButton");

    const blockDropCoinButton =
      document.getElementById("blockDropCoinButton");

    if (snakeGamesPlayed < 3) {
      snakeAdButton.disabled = true;
      snakeAdButton.textContent = "✅ Snake Plays Available";

      snakeCoinButton.disabled = true;
      snakeCoinButton.textContent = "🪙 Use Snake Plays First";
    } else if (points < 30) {
      snakeCoinButton.disabled = true;
      snakeCoinButton.textContent = "🪙 Need 30 Arcade Coins";
    }

    if (blockDropGamesPlayed < 3) {
      blockDropAdButton.disabled = true;
      blockDropAdButton.textContent = "✅ Block Drop Plays Available";

      blockDropCoinButton.disabled = true;
      blockDropCoinButton.textContent =
        "🪙 Use Block Drop Plays First";
    } else if (points < 30) {
      blockDropCoinButton.disabled = true;
      blockDropCoinButton.textContent =
        "🪙 Need 30 Arcade Coins";
    }

    function watchAdForSnake() {
      alert("Prototype rewarded ad plays here.");

      localStorage.setItem("snakeGamesPlayed", 0);

      alert("You unlocked 3 more Snake games!");

      location.reload();
    }

    function buySnakePlays() {
      let currentPoints =
        Number(localStorage.getItem("points")) || 0;

      if (currentPoints < 30) {
        alert("You need 30 Arcade Coins.");
        return;
      }

      currentPoints -= 30;

      localStorage.setItem("points", currentPoints);
      localStorage.setItem("snakeGamesPlayed", 0);

      alert("You unlocked 3 more Snake games!");

      location.reload();
    }

    function watchAdForBlockDrop() {
      alert("Prototype rewarded ad plays here.");

      localStorage.setItem("blockDropGamesPlayed", 0);

      alert("You unlocked 3 more Block Drop games!");

      location.reload();
    }

    function buyBlockDropPlays() {
      let currentPoints =
        Number(localStorage.getItem("points")) || 0;

      if (currentPoints < 30) {
        alert("You need 30 Arcade Coins.");
        return;
      }

      currentPoints -= 30;

      localStorage.setItem("points", currentPoints);
      localStorage.setItem("blockDropGamesPlayed", 0);

      alert("You unlocked 3 more Block Drop games!");

      location.reload();
    }
  </script>

</body>
</html>
