      body.dodger-page .meta-pill{

      }
      body.dodger-page .meta-pill:nth-child(3){
        border-color:rgba(255,193,77,.28)!important;
        background:
          radial-gradient(circle at 80% 0%,rgba(255,193,77,.09),transparent 42%),

      }
      body.dodger-page.game-active .game-guide-strip,body.dodger-page.game-active .game-guide-more,body.dodger-page.game-active .game-guide-overlay,body.dodger-page.game-active .game-overlay,body.dodger-page.game-active .game-preflight,body.dodger-page.game-active .game-guide,body.dodger-page.game-active .game-guide-card,body.dodger-page.game-active .game-guide-reward,body.dodger-page.game-active .game-guide-tip,body.dodger-page.game-active [data-game-guide],body.dodger-page.game-active a.button.secondary{display:none!important}

        border-color:rgba(34,211,238,.48)!important;
        box-shadow:
          inset 0 0 42px rgba(0,0,0,.24),
          0 18px 38px rgba(0,0,0,.28),
          0 0 22px rgba(34,211,238,.08)!important;
        -webkit-tap-highlight-color:transparent
      }
      body.dodger-page.game-active,body.dodger-page.game-active .container,body.dodger-page.game-active .dodger-board{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

<body class="dodger-page">
  <main class="container">
    <div class="topbar">
      <a class="brand" href="games.html">← Games</a>
      <a class="balance-chip" href="rewards.html">🪙 <span id="balance">0</span></a>
    </div>

    <header class="page-header">
      <div class="game-title-status-row">
        <h1>🚗 Neon Dodger</h1>
        <span class="game-status title-status" id="gameStatus">Ready</span>
      </div>
      <div class="game-meta">
        <span class="meta-pill">Time: <span id="time">0</span>s</span>
        <span class="meta-pill">Dodged: <span id="dodged">0</span></span>
        <span class="meta-pill">Reward: <span id="rewardPreview">0</span> 🪙</span>
        <span class="meta-pill"><span id="plays">0</span> <span id="playsLabel">plays left</span></span>
      </div>
    </header>

    <button class="green wide" id="startButton" type="button">👆 Tap the Game to Start</button>
    <canvas class="dodger-board touch-surface" id="game" width="330" height="500" aria-label="Neon Dodger game board"></canvas>
    <a class="button wide secondary" href="games.html">← Back to Games</a>
  </main>

  <script src="arcade.js"></script>
  <script>
    const canvas=document.getElementById('game');
    const ctx=canvas.getContext('2d');
    const timeEl=document.getElementById('time');
    const dodgedEl=document.getElementById('dodged');
    const rewardPreviewEl=document.getElementById('rewardPreview');
    const playsEl=document.getElementById('plays');
    const playsLabelEl=document.getElementById('playsLabel');
    const balanceEl=document.getElementById('balance');
    const statusEl=document.getElementById('gameStatus');
    const startButton=document.getElementById('startButton');

    Arcade.gameGuide({
      game:'dodger',
      surface:canvas,
      steps:[
        { icon:'👆', title:'Start', text:'Tap the road' },
        { icon:'↔️', title:'Control', text:'Drag left or right' },
        { icon:'⏱️', title:'Goal', text:'Survive 30 seconds' }
      ],
      overlayIcon:'👆',
      overlayTitle:'Tap to Start',
      overlayText:'Drag anywhere around the road to dodge · keyboard: ← → or A D',
      replayTitle:'Tap to Play Again',
      tips:[
        'Keep your car away from every falling obstacle. One collision ends the run.',
        'The difficulty increases as the timer climbs toward 30 seconds.',
        'On a computer, use ← → or A / D. Press Enter or Space to start a run.'
      ],
      reward:'Survival time and obstacles dodged earn up to 20 Coins.'
    });

    const player={x:140,y:445,w:50,h:24};
    let obstacles=[];
    let running=false;
    let starting=false;
    let startTime=0;
    let lastSpawn=0;
    let dodged=0;
    let animation=null;
    let lastFrame=0;
    let nextSpawnAt=0;
    let dragAnchorClientX=null;
    let lastSecondShown=-1;

    function rewardFor(seconds,dodgedCount){
      let coins=Math.floor(seconds/3)+Math.floor(dodgedCount/5);
      if(seconds>=15) coins+=2;
      if(seconds>=25) coins+=3;
      if(seconds>=30) coins+=4;
      return Math.min(coins,20);
    }

    function refreshChrome(){
      const remaining=Arcade.remaining('dodger');
      if(running && remaining===0){
        playsEl.textContent='Last';
        playsLabelEl.textContent='play';
      }else{
        playsEl.textContent=remaining;
        playsLabelEl.textContent=remaining===1?'play left':'plays left';
      }
      balanceEl.textContent=Arcade.number('points').toLocaleString();
    }

    function setStatus(text,mode){
      statusEl.textContent=text;
      statusEl.className='game-status'+(mode?' '+mode:'');
      document.body.classList.toggle('game-active',mode==='running');
    }

    function drawNeonCar(x,y,w,h,color,isPlayer=false){
      ctx.save();

      const radius=Math.min(8,h*.32);
      ctx.shadowColor=color;
      ctx.shadowBlur=isPlayer?17:12;

      // Main body with tapered nose/rear so obstacles read as cars, not pills.
      ctx.fillStyle=color;
      ctx.beginPath();
      ctx.moveTo(x+radius,y);
      ctx.lineTo(x+w-radius,y);
      ctx.quadraticCurveTo(x+w,y,x+w,y+radius);
      ctx.lineTo(x+w,y+h-radius);
      ctx.quadraticCurveTo(x+w,y+h,x+w-radius,y+h);
      ctx.lineTo(x+radius,y+h);
      ctx.quadraticCurveTo(x,y+h,x,y+h-radius);
      ctx.lineTo(x,y+radius);
      ctx.quadraticCurveTo(x,y,x+radius,y);
      ctx.closePath();
      ctx.fill();

      ctx.shadowBlur=0;

      // Dark windshield/cabin.
      ctx.fillStyle='rgba(3,12,22,.76)';
      ctx.beginPath();
      ctx.roundRect(x+w*.23,y+h*.18,w*.54,h*.34,Math.max(2,radius*.45));
      ctx.fill();

      // Wheels.
      ctx.fillStyle='#020617';
      const wheelW=Math.max(3,w*.08);
      const wheelH=Math.max(5,h*.27);
      ctx.fillRect(x-wheelW*.35,y+h*.18,wheelW,wheelH);
      ctx.fillRect(x+w-wheelW*.65,y+h*.18,wheelW,wheelH);
      ctx.fillRect(x-wheelW*.35,y+h*.58,wheelW,wheelH);
      ctx.fillRect(x+w-wheelW*.65,y+h*.58,wheelW,wheelH);

      // Lights make travel direction easy to read.
      ctx.fillStyle=isPlayer?'#bbf7d0':'#fde68a';
      ctx.fillRect(x+w*.12,y+h*.70,Math.max(4,w*.13),Math.max(2,h*.10));
      ctx.fillRect(x+w*.75,y+h*.70,Math.max(4,w*.13),Math.max(2,h*.10));

      ctx.fillStyle=isPlayer?'#86efac':'#fb7185';
      ctx.fillRect(x+w*.12,y+h*.12,Math.max(4,w*.13),Math.max(2,h*.09));
      ctx.fillRect(x+w*.75,y+h*.12,Math.max(4,w*.13),Math.max(2,h*.09));

      if(isPlayer){
        ctx.strokeStyle='rgba(220,252,231,.58)';
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.roundRect(x+2,y+2,w-4,h-4,Math.max(3,radius-2));
        ctx.stroke();
      }

      ctx.restore();
    }

    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);

      const gradient=ctx.createLinearGradient(0,0,0,canvas.height);
      gradient.addColorStop(0,'#06111d');
      gradient.addColorStop(.58,'#091a2c');
      gradient.addColorStop(1,'#102342');
      ctx.fillStyle=gradient;
      ctx.fillRect(0,0,canvas.width,canvas.height);

      // Calm road treatment: broad lane zones and continuous, low-contrast
      // separators instead of repeated dashed marks.
      const laneWidth=canvas.width/3;
      ctx.fillStyle='rgba(56,189,248,.018)';
      ctx.fillRect(0,0,laneWidth,canvas.height);
      ctx.fillStyle='rgba(34,211,238,.028)';
      ctx.fillRect(laneWidth,0,laneWidth,canvas.height);
      ctx.fillStyle='rgba(56,189,248,.018)';
      ctx.fillRect(laneWidth*2,0,laneWidth,canvas.height);

      ctx.save();
      ctx.strokeStyle='rgba(125,211,252,.13)';
      ctx.lineWidth=1.5;
      [laneWidth,laneWidth*2].forEach(x=>{
        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,canvas.height);
        ctx.stroke();
      });
      ctx.restore();

      // Soft cyan shoulder glow frames the play area without flashing motion.
      const leftGlow=ctx.createLinearGradient(0,0,22,0);
      leftGlow.addColorStop(0,'rgba(34,211,238,.15)');
      leftGlow.addColorStop(1,'rgba(34,211,238,0)');
      ctx.fillStyle=leftGlow;
      ctx.fillRect(0,0,24,canvas.height);

      const rightGlow=ctx.createLinearGradient(canvas.width,0,canvas.width-22,0);
      rightGlow.addColorStop(0,'rgba(34,211,238,.15)');
      rightGlow.addColorStop(1,'rgba(34,211,238,0)');
      ctx.fillStyle=rightGlow;
      ctx.fillRect(canvas.width-24,0,24,canvas.height);

      // Slight spotlight under the player helps eye tracking without adding
      // more moving scenery.
      const focus=ctx.createRadialGradient(player.x+player.w/2,player.y+player.h/2,8,player.x+player.w/2,player.y+player.h/2,82);
      focus.addColorStop(0,'rgba(52,211,153,.085)');
      focus.addColorStop(1,'rgba(52,211,153,0)');
      ctx.fillStyle=focus;
      ctx.fillRect(Math.max(0,player.x-66),Math.max(0,player.y-66),player.w+132,player.h+132);

      drawNeonCar(player.x,player.y,player.w,player.h,'#36e57c',true);
      obstacles.forEach(o=>drawNeonCar(o.x,o.y,o.w,o.h,o.color,false));
    }

    function trafficSpeedFor(seconds){
      return Math.min(12.0,5.5+Math.max(0,seconds)*.22);
    }

    function spawnDelayFor(seconds){
      return Math.max(250,650-Math.max(0,seconds)*13);
    }

    function spawn(now){
      const width=34+Math.random()*34;
      const seconds=Math.max(0,(now-startTime)/1000);
      obstacles.push({
        x:Math.random()*(canvas.width-width),
        y:-32,
        w:width,
        h:24,
        speed:trafficSpeedFor(seconds),
        color:['#ef4444','#f97316','#eab308','#a855f7'][Math.floor(Math.random()*4)]
      });
    }

    function intersects(a,b){
      return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
    }

    function loop(now){
      if(!running) return;

      if(!startTime) startTime=now;
      const elapsed=Math.max(0,now-startTime);
      const seconds=Math.min(30,Math.floor(elapsed/1000));

      if(!nextSpawnAt) nextSpawnAt=now+560;
      if(now>=nextSpawnAt){
        spawn(now);
        lastSpawn=now;
        nextSpawnAt=now+spawnDelayFor(seconds);
      }

      const frameScale=lastFrame?Math.min(2,(now-lastFrame)/16.667):1;
      lastFrame=now;
      obstacles.forEach(o=>o.y+=o.speed*frameScale);

      const survivors=[];
      const hitPlayer={
        x:player.x+5,
        y:player.y+3,
        w:player.w-10,
        h:player.h-6
      };
      for(const o of obstacles){
        const hitObstacle={
          x:o.x+4,
          y:o.y+3,
          w:Math.max(1,o.w-8),
          h:Math.max(1,o.h-6)
        };
        if(intersects(hitPlayer,hitObstacle)){
          finishGame(false,seconds);
          return;
        }
        if(o.y>canvas.height){
          dodged+=1;
          dodgedEl.textContent=dodged;
          if(dodged===10 || dodged===20) Arcade.feedback(dodged===20?'perfect':'score');
        }else{
          survivors.push(o);
        }
      }
      obstacles=survivors;

      if(seconds!==lastSecondShown){
        lastSecondShown=seconds;
        timeEl.textContent=seconds;
        rewardPreviewEl.textContent=rewardFor(seconds,dodged);
        if(seconds===10) setStatus('Speeding Up','running');
        else if(seconds===20) setStatus('Final Stretch','running');
        else if(seconds===11 || seconds===21) setStatus('Running','running');
      }

      draw();

      if(elapsed>=30000){
        finishGame(true,30);
        return;
      }

      animation=requestAnimationFrame(loop);
    }

    function finishGame(survived,seconds){
      if(!running) return;
      running=false;
      pauseStartedAt=0;
      cancelAnimationFrame(animation);
      animation=null;
      clearDragState();
      lastFrame=0;

      const earned=rewardFor(seconds,dodged);
      timeEl.textContent=seconds;
      dodgedEl.textContent=dodged;
      rewardPreviewEl.textContent=earned;
      Arcade.earn(earned,'Neon Dodger', { kind:'game', game:'dodger', metric:seconds, aux:dodged });
      Arcade.feedback(survived?'success':'fail');
      const result=Arcade.recordResult('dodger', seconds);

      const best=Math.max(seconds,Arcade.number('dodgerBest'));
      localStorage.setItem('dodgerBest',String(best));

      starting=false;
      refreshChrome();
      setStatus(survived?'You Survived!':'Game Over','over');
      startButton.disabled=false;
      startButton.textContent='👆 Tap Game to Play Again';

      Arcade.gameResult({
        icon:survived?'🚗':'💥',
        title:survived?'You Survived!':'Run Over',
        scoreLabel:'Seconds Survived',
        score:seconds + 's',
        best:best + 's',
        coins:earned,
        result,
        playsLeft:Arcade.remaining('dodger'),
        game:'dodger',
        extra:['⏱️ Time played: '+seconds+'s','🚧 Obstacles dodged: ' + dodged, survived?'🏆 Full 30-second survival!':'Keep weaving through traffic.'],
        onReplay:startGame,
        onMorePlays:()=>Arcade.out('dodger',refreshChrome)
      });
    }

    function clientXToGameX(clientX){
      const rect=canvas.getBoundingClientRect();
      const scale=canvas.width/rect.width;
      return (clientX-rect.left)*scale;
    }

    function setPlayerX(x){
      player.x=Math.max(0,Math.min(canvas.width-player.w,x));
    }

    let dragging = false;
    let dragPointer = null;
    let dragStartClientX=0;
    let dragStartPlayerX=0;

    function beginDrag(event){
      if(!running || document.body.classList.contains('earnly-game-paused') || dragging || dragPointer!==null) return false;
      if(event.isPrimary===false || (event.pointerType==='mouse' && event.button!==0)) return false;
      dragging=true;
      dragPointer=event.pointerId;
      dragStartClientX=event.clientX;
      dragAnchorClientX=event.clientX;
      dragStartPlayerX=player.x;
      return true;
    }

    function moveDrag(event){
      // Use movement deltas instead of mapping the finger directly to the
      // canvas so control stays smooth even if the finger leaves the road.
      const rect=canvas.getBoundingClientRect();
      const scale=canvas.width/rect.width;
      const delta=(event.clientX-dragAnchorClientX)*scale;
      setPlayerX(player.x+delta);
      dragAnchorClientX=event.clientX;
    }

    canvas.addEventListener('pointerdown',event=>{
      if(event.isPrimary===false || (event.pointerType==='mouse' && event.button!==0)) return;
      event.preventDefault();

      if(!running){
        if(!starting) startGame();
        return;
      }

      if(beginDrag(event)) canvas.setPointerCapture?.(event.pointerId);
    });

    canvas.addEventListener('pointermove',event=>{
      if(!dragging || dragPointer !== event.pointerId) return;
      event.preventDefault();
      moveDrag(event);
    });

    document.addEventListener('pointerdown',event=>{
      if(event.target===canvas || event.target.closest?.('a,button,[role="button"],.earnly-pause-button')) return;
      if(!Arcade.inExpandedGameZone(event,canvas,130)) return;
      if(event.isPrimary===false || (event.pointerType==='mouse' && event.button!==0)) return;
      event.preventDefault();

      if(!running){
        if(!starting) startGame();
        return;
      }

      beginDrag(event);
    },{passive:false});

    document.addEventListener('pointermove',event=>{
      if(!dragging || dragPointer !== event.pointerId) return;
      event.preventDefault();
      moveDrag(event);
    },{passive:false});

    const stopDragging = event => {
      if(event && dragPointer !== event.pointerId) return;
      dragging = false;
      dragPointer = null;
      dragAnchorClientX = null;
    };

    canvas.addEventListener('pointerup',stopDragging);
    canvas.addEventListener('pointercancel',stopDragging);
    document.addEventListener('pointerup',stopDragging);
    document.addEventListener('pointercancel',stopDragging);
    canvas.addEventListener('contextmenu',event=>event.preventDefault());
    document.addEventListener('contextmenu',event=>{
      if(running && Arcade.inExpandedGameZone(event,canvas,130)) event.preventDefault();
    });

    document.addEventListener('keydown',event=>{
      if(!running) return;
      if(event.key==='ArrowLeft' || event.key==='a' || event.key==='A'){event.preventDefault();player.x=Math.max(0,player.x-24);}
      if(event.key==='ArrowRight' || event.key==='d' || event.key==='D'){event.preventDefault();player.x=Math.min(canvas.width-player.w,player.x+24);}
    });

    function clearDragState(){
      dragging=false;
      dragPointer=null;
      dragAnchorClientX=null;
    }

    window.addEventListener('blur',clearDragState);
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden) clearDragState();
    });

    let earnlyRunStartedAt=0,totalPausedMs=0,pauseStartedAt=0;
    function startGame(){
      if(running || starting) return;
      starting=true;
      if(!Arcade.consume('dodger')){
        starting=false;
        Arcade.out('dodger',refreshChrome);
        return;
      }
      earnlyRunStartedAt=0; totalPausedMs=0; pauseStartedAt=0; 

      cancelAnimationFrame(animation);
      animation=null;
      clearDragState();
      obstacles=[];
      player.x=(canvas.width-player.w)/2;
      lastFrame=0;
      startTime=0;
      lastSpawn=0;
      nextSpawnAt=0;
      dodged=0;
      lastSecondShown=-1;
      timeEl.textContent='0';
      dodgedEl.textContent='0';
      rewardPreviewEl.textContent='0';

      running=false;
      startButton.disabled=true;
      startButton.textContent='Get Ready…';
      setStatus('Get Ready');
      refreshChrome();
      draw();

      Arcade.countdown(()=>{
        starting=false;
        running=true;
        earnlyRunStartedAt=performance.now();
        startButton.textContent='Game Running';
        setStatus('Running','running');
        refreshChrome();
        requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'auto'}));
        startTime=0;
        lastSpawn=0;
        nextSpawnAt=0;
        animation=requestAnimationFrame(loop);
      });
    }

    Arcade.installPauseControl({
      isRunning:()=>running,
      pause:()=>{
        if(!running||pauseStartedAt)return;
        pauseStartedAt=performance.now();cancelAnimationFrame(animation);animation=null;clearDragState();lastFrame=0;
      },
      resume:()=>{
        if(!running||!pauseStartedAt)return;
        const d=performance.now()-pauseStartedAt;totalPausedMs+=d;pauseStartedAt=0;if(startTime)startTime+=d;if(lastSpawn)lastSpawn+=d;if(nextSpawnAt)nextSpawnAt+=d;lastFrame=0;cancelAnimationFrame(animation);animation=null;animation=requestAnimationFrame(loop);
      }
    });
    startButton.addEventListener('click',startGame);
    document.addEventListener('keydown',event=>{
      if((event.key==='Enter' || event.key===' ') && !running && !starting && !Arcade.isProtectedGameControlTarget(event.target)){
        event.preventDefault();
        startGame();
      }
    });
    refreshChrome();
    draw();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cloud.js"></script>
</body>
</html>
