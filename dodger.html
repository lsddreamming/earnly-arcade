<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Earnly">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="earnly-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="earnly-icon.svg">
  <title>Earnly Dodger</title>
  <link rel="stylesheet" href="arcade.css">
  <style>
    .dodger-board{width:min(82vw,330px);height:auto;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  </style>
</head>
<body class="dodger-page">
  <main class="container">
    <div class="topbar">
      <a class="brand" href="games.html">← Games</a>
      <a class="balance-chip" href="rewards.html">🪙 <span id="balance">0</span></a>
    </div>

    <header class="page-header">
      <div class="game-title-status-row">
        <h1>🚗 Neon Dodger</h1>
        <span class="game-status title-status" id="gameStatus">Ready</span>
      </div>
      <div class="game-meta">
        <span class="meta-pill">Time: <span id="time">0</span>s</span>
        <span class="meta-pill">Dodged: <span id="dodged">0</span></span>
        <span class="meta-pill">Reward: <span id="rewardPreview">0</span> 🪙</span>
        <span class="meta-pill"><span id="plays">0</span> plays left</span>
      </div>
    </header>

    <button class="green wide" id="startButton" type="button">👆 Tap the Game to Start</button>
    <canvas class="dodger-board touch-surface" id="game" width="330" height="500" aria-label="Neon Dodger game board"></canvas>
    <a class="button wide secondary" href="games.html">← Back to Games</a>
  </main>

  <script src="arcade.js"></script>
  <script>
    const canvas=document.getElementById('game');
    const ctx=canvas.getContext('2d');
    const timeEl=document.getElementById('time');
    const dodgedEl=document.getElementById('dodged');
    const rewardPreviewEl=document.getElementById('rewardPreview');
    const playsEl=document.getElementById('plays');
    const balanceEl=document.getElementById('balance');
    const statusEl=document.getElementById('gameStatus');
    const startButton=document.getElementById('startButton');

    Arcade.gameGuide({
      game:'dodger',
      surface:canvas,
      steps:[
        { icon:'👆', title:'Start', text:'Tap the road' },
        { icon:'↔️', title:'Control', text:'Drag left or right' },
        { icon:'⏱️', title:'Goal', text:'Survive 30 seconds' }
      ],
      overlayIcon:'👆',
      overlayTitle:'Tap to Start',
      overlayText:'Drag left and right to dodge the falling obstacles',
      replayTitle:'Tap to Play Again',
      tips:[
        'Keep your car away from every falling obstacle. One collision ends the run.',
        'The difficulty increases as the timer climbs toward 30 seconds.'
      ],
      reward:'Survival time and obstacles dodged earn up to 20 Coins.'
    });

    const player={x:140,y:445,w:50,h:24};
    let obstacles=[];
    let running=false;
    let starting=false;
    let startTime=0;
    let lastSpawn=0;
    let dodged=0;
    let animation=null;

    function rewardFor(seconds,dodgedCount){
      let coins=Math.floor(seconds/3)+Math.floor(dodgedCount/5);
      if(seconds>=15) coins+=2;
      if(seconds>=25) coins+=3;
      if(seconds>=30) coins+=4;
      return Math.min(coins,20);
    }

    function refreshChrome(){
      playsEl.textContent=Arcade.remaining('dodger');
      balanceEl.textContent=Arcade.number('points').toLocaleString();
    }

    function setStatus(text,mode){
      statusEl.textContent=text;
      statusEl.className='game-status'+(mode?' '+mode:'');
    }

    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);

      const gradient=ctx.createLinearGradient(0,0,0,canvas.height);
      gradient.addColorStop(0,'#0f172a');
      gradient.addColorStop(1,'#172554');
      ctx.fillStyle=gradient;
      ctx.fillRect(0,0,canvas.width,canvas.height);

      ctx.fillStyle='#22c55e';
      ctx.fillRect(player.x,player.y,player.w,player.h);

      obstacles.forEach(o=>{
        ctx.fillStyle=o.color;
        ctx.fillRect(o.x,o.y,o.w,o.h);
      });
    }

    function spawn(now){
      const width=34+Math.random()*34;
      obstacles.push({
        x:Math.random()*(canvas.width-width),
        y:-32,
        w:width,
        h:24,
        speed:3.2+Math.min(4,(now-startTime)/8000),
        color:['#ef4444','#f97316','#eab308','#a855f7'][Math.floor(Math.random()*4)]
      });
    }

    function intersects(a,b){
      return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
    }

    function loop(now){
      if(!running) return;

      if(!startTime) startTime=now;
      const seconds=Math.min(30,Math.floor((now-startTime)/1000));

      if(now-lastSpawn > Math.max(300,760-seconds*12)){
        spawn(now);
        lastSpawn=now;
      }

      obstacles.forEach(o=>o.y+=o.speed);

      const survivors=[];
      for(const o of obstacles){
        if(intersects(player,o)){
          finishGame(false,seconds);
          return;
        }
        if(o.y>canvas.height){
          dodged+=1;
          dodgedEl.textContent=dodged;
          if(dodged===10) Arcade.milestone('🚗 10 obstacles dodged!');
          if(dodged===20) Arcade.milestone('🔥 20 dodged · Road Warrior!', 'perfect');
        }else{
          survivors.push(o);
        }
      }
      obstacles=survivors;

      timeEl.textContent=seconds;
      rewardPreviewEl.textContent=rewardFor(seconds,dodged);

      draw();

      if(seconds>=30){
        finishGame(true,30);
        return;
      }

      animation=requestAnimationFrame(loop);
    }

    function finishGame(survived,seconds){
      if(!running) return;
      running=false;
      cancelAnimationFrame(animation);
      animation=null;

      const earned=rewardFor(seconds,dodged);
      Arcade.earn(earned,'Neon Dodger', { kind:'game', game:'dodger', metric:seconds, aux:dodged });
      Arcade.feedback(survived?'success':'fail');
      const result=Arcade.recordResult('dodger', seconds);

      const best=Math.max(seconds,Arcade.number('dodgerBest'));
      localStorage.setItem('dodgerBest',String(best));

      starting=false;
      refreshChrome();
      setStatus(survived?'You Survived!':'Game Over','over');
      startButton.disabled=false;
      startButton.textContent='👆 Tap Game to Play Again';

      Arcade.gameResult({
        icon:survived?'🚗':'💥',
        title:survived?'You Survived!':'Run Over',
        scoreLabel:'Seconds Survived',
        score:seconds + 's',
        best:best + 's',
        coins:earned,
        result,
        playsLeft:Arcade.remaining('dodger'),
        game:'dodger',
        extra:['🚧 Obstacles dodged: ' + dodged, survived?'🏆 Full 30-second survival!':'Keep weaving through traffic.'],
        onReplay:startGame,
        onMorePlays:()=>Arcade.out('dodger',refreshChrome)
      });
    }

    function setPlayerFromClientX(clientX){
      const rect=canvas.getBoundingClientRect();
      const scale=canvas.width/rect.width;
      const x=(clientX-rect.left)*scale-player.w/2;
      player.x=Math.max(0,Math.min(canvas.width-player.w,x));
    }

    let dragging = false;
    let dragPointer = null;

    canvas.addEventListener('pointerdown',event=>{
      event.preventDefault();

      if(!running){
        if(!starting) startGame();
        return;
      }

      dragging = true;
      dragPointer = event.pointerId;
      setPlayerFromClientX(event.clientX);
      canvas.setPointerCapture?.(event.pointerId);
    });

    canvas.addEventListener('pointermove',event=>{
      if(!dragging || dragPointer !== event.pointerId) return;
      event.preventDefault();
      setPlayerFromClientX(event.clientX);
    });

    document.addEventListener('pointerdown',event=>{
      if(event.target===canvas || !Arcade.inExpandedGameZone(event,canvas,130)) return;
      event.preventDefault();

      if(!running){
        if(!starting) startGame();
        return;
      }

      dragging=true;
      dragPointer=event.pointerId;
      setPlayerFromClientX(event.clientX);
    },{passive:false});

    document.addEventListener('pointermove',event=>{
      if(!dragging || dragPointer !== event.pointerId) return;
      event.preventDefault();
      setPlayerFromClientX(event.clientX);
    },{passive:false});

    const stopDragging = event => {
      if(event && dragPointer !== event.pointerId) return;
      dragging = false;
      dragPointer = null;
    };

    canvas.addEventListener('pointerup',stopDragging);
    canvas.addEventListener('pointercancel',stopDragging);
    document.addEventListener('pointerup',stopDragging);
    document.addEventListener('pointercancel',stopDragging);
    canvas.addEventListener('contextmenu',event=>event.preventDefault());

    document.addEventListener('keydown',event=>{
      if(!running) return;
      if(event.key==='ArrowLeft'){event.preventDefault();player.x=Math.max(0,player.x-24);}
      if(event.key==='ArrowRight'){event.preventDefault();player.x=Math.min(canvas.width-player.w,player.x+24);}
    });

    function startGame(){
      if(running || starting) return;
      starting=true;
      if(!Arcade.consume('dodger')){
        starting=false;
        Arcade.out('dodger',refreshChrome);
        return;
      }

      obstacles=[];
      player.x=(canvas.width-player.w)/2;
      startTime=0;
      lastSpawn=0;
      dodged=0;
      timeEl.textContent='0';
      dodgedEl.textContent='0';
      rewardPreviewEl.textContent='0';

      running=false;
      startButton.disabled=true;
      startButton.textContent='Get Ready…';
      setStatus('Get Ready');
      refreshChrome();
      draw();

      Arcade.countdown(()=>{
        starting=false;
        running=true;
        startButton.textContent='Game Running';
        setStatus('Running','running');
        startTime=0;
        lastSpawn=0;
        animation=requestAnimationFrame(loop);
      });
    }

    startButton.addEventListener('click',startGame);
    refreshChrome();
    draw();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cloud.js"></script>
</body>
</html>
