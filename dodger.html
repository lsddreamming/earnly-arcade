  <style>

      display:block;

      border-radius:20px;

      box-shadow:
        inset 0 0 34px rgba(0,0,0,.26),
        0 18px 38px rgba(0,0,0,.28),

    }
    @media(max-width:600px){
      body.dodger-page main.container{padding-top:max(14px,calc(env(safe-area-inset-top) + 8px))!important}
      body.dodger-page .topbar{margin-bottom:6px!important}
      body.dodger-page .page-header{
        margin:2px 0 7px!important;
        padding:11px!important;
        gap:6px!important;
        border:1px solid rgba(34,211,238,.28)!important;
        border-radius:18px!important;
        background:
          radial-gradient(circle at 88% 0%,rgba(34,211,238,.10),transparent 38%),
          radial-gradient(circle at 12% 100%,rgba(168,85,247,.07),transparent 34%),
          linear-gradient(145deg,rgba(17,38,61,.97),rgba(8,22,37,.97))!important;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 14px 30px rgba(0,0,0,.18)!important;
      }
      body.dodger-page .game-title-status-row h1{font-size:22px!important;letter-spacing:-.035em!important}
      body.dodger-page .game-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;width:100%}
      body.dodger-page .meta-pill{
        min-height:37px!important;
        padding:4px 3px!important;
        display:flex!important;
        align-items:center!important;
        justify-content:center!important;
        text-align:center!important;
        font-size:9px!important;
        font-weight:850!important;
        border:1px solid rgba(67,119,164,.34)!important;
        border-radius:11px!important;
        background:linear-gradient(145deg,rgba(16,34,55,.96),rgba(8,21,36,.96))!important;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.025)!important
      }
      body.dodger-page .meta-pill:nth-child(3){
        border-color:rgba(255,193,77,.28)!important;
        background:
          radial-gradient(circle at 80% 0%,rgba(255,193,77,.09),transparent 42%),
          linear-gradient(145deg,rgba(29,39,51,.97),rgba(10,23,37,.96))!important;
        color:#ffd86b!important
      }
      body.dodger-page.game-active .game-guide-strip,body.dodger-page.game-active .game-guide-more,body.dodger-page.game-active .game-guide-overlay,body.dodger-page.game-active .game-overlay,body.dodger-page.game-active .game-preflight,body.dodger-page.game-active .game-guide,body.dodger-page.game-active .game-guide-card,body.dodger-page.game-active .game-guide-reward,body.dodger-page.game-active .game-guide-tip,body.dodger-page.game-active [data-game-guide],body.dodger-page.game-active a.button.secondary{display:none!important}
      body.dodger-page.game-active .topbar,body.dodger-page.game-active #startButton{display:none!important}
      /* Keep Pause and Resume in thumb reach while the road is on screen. */
      body.dodger-page.game-active .earnly-pause-button{
        position:fixed!important;
        right:max(16px,env(safe-area-inset-right))!important;
        bottom:calc(18px + env(safe-area-inset-bottom))!important;
        width:124px!important;
        min-width:124px!important;
        min-height:56px!important;
        margin:0!important;
        padding:12px 16px!important;
        font-size:16px!important;
        border-radius:18px!important;
        border:2px solid rgba(103,232,249,.85)!important;
        background:#12314a!important;
        box-shadow:0 8px 26px rgba(0,0,0,.5),0 0 18px rgba(34,211,238,.3)!important;
        z-index:120!important;
        touch-action:manipulation;
      }
      body.dodger-page.game-active.earnly-game-paused .earnly-pause-button{
        border-color:#86efac!important;
        background:#14532d!important;
      }
      body.dodger-page.game-active .page-header{margin:0 0 4px}
      body.dodger-page.game-active .game-title-status-row h1{font-size:22px!important;margin:0!important}
      body.dodger-page.game-active .game-meta{margin:3px 0 4px}
      body.dodger-page.game-active .game-status{padding:3px 8px;font-size:9px}
      body.dodger-page.game-active .dodger-board{
        width:min(92vw,calc((100dvh - 340px) * .66),365px);
        margin:5px auto 4px;
        border-color:rgba(34,211,238,.48)!important;
        box-shadow:
          inset 0 0 42px rgba(0,0,0,.24),
          0 18px 38px rgba(0,0,0,.28),
          0 0 22px rgba(34,211,238,.08)!important;
        -webkit-tap-highlight-color:transparent
      }
      body.dodger-page.game-active,body.dodger-page.game-active .container,body.dodger-page.game-active .dodger-board{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
      body.dodger-page.game-active #arcadeBottomNav{display:none!important}
      body.dodger-page.game-active main.container{padding-bottom:max(18px,env(safe-area-inset-bottom))!important}
    }

    body.dodger-page .game-guide-surface-wrap{display:flex;justify-content:center}
    .dodger-level{width:min(92vw,365px);margin:8px auto 4px;padding:8px 10px;background:#10243b;border:1px solid #296076;border-radius:12px;font-size:11px;display:grid;grid-template-columns:1fr auto;gap:5px;color:#98fbff;box-sizing:border-box}
    .dodger-level strong{font-size:11px}.dodger-level small{grid-column:1/-1;color:#b6cadd;font-size:10px}
    .dodger-level-track{grid-column:1/-1;height:3px;background:#ffffff18;border-radius:3px;overflow:hidden}.dodger-level-track i{display:block;height:100%;background:#67e8f9;width:0}
    .dodger-swipe{width:min(92vw,365px);height:44px;margin:4px auto 12px;display:flex;align-items:center;justify-content:center;touch-action:none;color:#86c6d9;background:#0c2136;border:1px dashed #2c6375;border-radius:12px;font-size:12px;user-select:none}
    html body.dodger-page.game-active:not(.earnly-game-paused) #earnlyQuitButton{display:none!important}
    html body.dodger-page.game-active .earnly-session-dock{display:flex;align-items:center;justify-content:center;position:fixed!important;bottom:calc(12px + env(safe-area-inset-bottom))!important;left:50%!important;transform:translateX(-50%);width:min(92vw,440px);margin:0!important;gap:12px}
    html body.dodger-page.game-active .earnly-session-dock #earnlyPauseButton{position:relative!important;inset:auto!important;min-width:0!important;width:auto!important;min-height:48px!important;margin:0!important;flex:1!important}
    html body.dodger-page.game-active .earnly-session-dock #earnlyQuitButton{position:relative!important;inset:auto!important;margin:0!important}
    .dodger-level.level-new{border-color:#87fff0;box-shadow:0 0 12px #67e8f933}
    html body.dodger-page .dodger-sound{margin:0 0 0 auto!important;padding:5px 7px!important;min-height:30px!important;min-width:44px!important;width:auto!important;font-size:11px!important;line-height:1!important;border-radius:9px;background:#102d40;color:#a7ffff;border:1px solid #3c7787}
    body.dodger-page .game-title-status-row{gap:6px!important;flex-wrap:nowrap}
    @media(max-width:400px){body.dodger-page .game-title-status-row h1{font-size:20px!important}}

<body class="dodger-page">
  <main class="container">
    <div class="topbar">
      <a class="brand" href="games.html">← Games</a>
      <a class="balance-chip" href="rewards.html">🪙 <span id="balance">0</span></a>
    </div>

    <header class="page-header">
      <div class="game-title-status-row">
        <h1>🚗 Neon Dodger</h1>
        <button id="soundButton" type="button" class="dodger-sound" aria-pressed="true" aria-label="Mute sound effects">♫ On</button><span class="game-status title-status" id="gameStatus">Ready</span>
      </div>
      <div class="game-meta">
        <span class="meta-pill">Time: <span id="time">0</span>s</span>
        <span class="meta-pill">Dodged: <span id="dodged">0</span></span>
        <span class="meta-pill">Run: <span id="rewardPreview">0</span> 🪙 · <span id="xpPreview">+10</span> XP</span>
        <span class="meta-pill"><span id="plays">0</span> <span id="playsLabel">plays left</span></span>
      </div>
    </header>

    <button class="green wide" id="startButton" type="button">👆 Tap the Game to Start</button>
    <div class="dodger-level"><strong id="levelGoal">LEVEL 1 · SIDE STREETS</strong><span id="levelTarget">20s to Level 2</span><div class="dodger-level-track"><i id="levelProgress"></i></div><small id="levelCareer">Reach Level 3 · cyan car</small></div>
    <canvas class="dodger-board touch-surface" id="game" width="330" height="500" aria-label="Neon Dodger game board"></canvas>
    <div id="swipeZone" class="dodger-swipe">↔ Swipe here or on the road</div>
    <a class="button wide secondary" href="games.html">← Back to Games</a>
  </main>

  <script src="arcade.js"></script>
  <script src="dodger-progression.js"></script>
  <script src="dodger-audio.js"></script>
  <script>
    const canvas=document.getElementById('game');
    const ctx=canvas.getContext('2d');
    const timeEl=document.getElementById('time');
    const dodgedEl=document.getElementById('dodged');
    const rewardPreviewEl=document.getElementById('rewardPreview');
    const xpPreviewEl=document.getElementById('xpPreview');
    const playsEl=document.getElementById('plays');
    const playsLabelEl=document.getElementById('playsLabel');
    const balanceEl=document.getElementById('balance');
    const statusEl=document.getElementById('gameStatus');
    const startButton=document.getElementById('startButton');

    Arcade.gameGuide({
      game:'dodger',
      surface:canvas,
      steps:[
        { icon:'👆', title:'Start', text:'Tap the road' },
        { icon:'↔️', title:'Control', text:'Drag left or right' },
        { icon:'🏁', title:'Goal', text:'Clear a district every 20 seconds' }
      ],
      overlayIcon:'👆',
      overlayTitle:'Tap to Start',
      overlayText:'Drag anywhere around the road to dodge · keyboard: ← → or A D',
      replayTitle:'Tap to Play Again',
      tips:[
        'Keep your car away from every falling obstacle. One collision ends the run.',
        'Clear 20 seconds to reach the next district. Each level has faster traffic and more chained lane changes. Reach Level 3 for a cyan car and Level 5 for gold.',
        'On a computer, use ← → or A / D. Press Enter or Space to start a run.'
      ],
      reward:'Survival time and obstacles dodged earn up to 20 Coins.'
    });

    const player={x:140,y:445,w:50,h:24};
    let obstacles=[];
    let running=false;
    let starting=false;
    let startTime=0;
    let lastSpawn=0;
    let dodged=0;
    let animation=null;
    let lastFrame=0;
    let nextSpawnAt=0;
    let dragAnchorClientX=null;
    let lastSecondShown=-1;
    let lastOpenLane=1;
    let runLevel=1;
    let bestLevel=Math.max(1,Math.min(999,Math.floor(Number(localStorage.getItem('arcadeDodgerTopLevel')))||1));
    let levelNoticeUntil=0,roadOffset=0,visualParticles=[],lastWhooshAt=-1000,audioEndTimer=0;
    const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
    const soundButton=document.getElementById('soundButton');
    function soundControl(){const on=Arcade.soundEnabled();soundButton.textContent=on?'♫ On':'♫ Off';soundButton.setAttribute('aria-pressed',String(on));soundButton.setAttribute('aria-label',on?'Mute sound effects':'Enable sound effects');}
    soundButton.addEventListener('click',()=>{localStorage.setItem('arcadeSound',Arcade.soundEnabled()?'off':'on');if(Arcade.soundEnabled()&&!pauseStartedAt)DodgerAudio.unlock();else DodgerAudio.suspend();soundControl();});
    function nearEffect(o,now){if(now-lastWhooshAt<140)return;lastWhooshAt=now;DodgerAudio.effect('near',1);if(!reducedMotion.matches)for(let i=0;i<8;i++)visualParticles.push({x:player.x+(i%2?player.w:0),y:player.y+player.h/2,vx:(i%2?1:-1)*(18+i*5),vy:35+i*9,life:.38});}

    function updateLevel(seconds){
      const p=DodgerProgression.progress(seconds);
      if(p.level>runLevel){runLevel=p.level;bestLevel=Math.max(bestLevel,runLevel);localStorage.setItem('arcadeDodgerTopLevel',String(bestLevel));levelNoticeUntil=seconds+2;DodgerAudio.effect('stage');}
      document.querySelector('.dodger-level').classList.toggle('level-new',running && seconds<levelNoticeUntil);
      document.getElementById('levelGoal').textContent='LEVEL '+p.level+' · '+p.label;
      document.getElementById('levelTarget').textContent=Math.ceil(p.remaining)+'s to Level '+(p.level+1);
      document.getElementById('levelProgress').style.width=(p.fraction*100)+'%';
      document.getElementById('levelCareer').textContent='Best: Level '+bestLevel+' · '+(bestLevel>=5?'Gold car unlocked':bestLevel>=3?'Reach Level 5 · gold car':p.nextUnlock);
    }

    function rewardFor(seconds,dodgedCount){
      // Survival rewards remain capped even though the run can continue.
      let coins=Math.floor(seconds/6)+Math.floor(dodgedCount/12);
      if(seconds>=20) coins+=1;
      if(seconds>=40) coins+=2;
      if(seconds>=60) coins+=3;
      return Math.min(coins,20);
    }

    function refreshChrome(){
      const remaining=Arcade.remaining('dodger');
      if(running && remaining===0){
        playsEl.textContent='Last';
        playsLabelEl.textContent='play';
      }else{
        playsEl.textContent=remaining;
        playsLabelEl.textContent=remaining===1?'play left':'plays left';
      }
      balanceEl.textContent=Arcade.number('points').toLocaleString();
    }

    function setStatus(text,mode){
      statusEl.textContent=text;
      statusEl.className='game-status'+(mode?' '+mode:'');
      document.body.classList.toggle('game-active',mode==='running');
    }

    function drawNeonCar(x,y,w,h,color,isPlayer=false){
      ctx.save();

      const radius=Math.min(8,h*.32);
      ctx.shadowColor=color;
      ctx.shadowBlur=isPlayer?17:12;

      // Main body with tapered nose/rear so obstacles read as cars, not pills.
      ctx.fillStyle=color;
      ctx.beginPath();
      ctx.moveTo(x+radius,y);
      ctx.lineTo(x+w-radius,y);
      ctx.quadraticCurveTo(x+w,y,x+w,y+radius);
      ctx.lineTo(x+w,y+h-radius);
      ctx.quadraticCurveTo(x+w,y+h,x+w-radius,y+h);
      ctx.lineTo(x+radius,y+h);
      ctx.quadraticCurveTo(x,y+h,x,y+h-radius);
      ctx.lineTo(x,y+radius);
      ctx.quadraticCurveTo(x,y,x+radius,y);
      ctx.closePath();
      ctx.fill();

      ctx.shadowBlur=0;

      // Dark windshield/cabin.
      ctx.fillStyle='rgba(3,12,22,.76)';
      ctx.beginPath();
      ctx.roundRect(x+w*.23,y+h*.18,w*.54,h*.34,Math.max(2,radius*.45));
      ctx.fill();

      ctx.fillStyle='rgba(230,255,255,.5)';ctx.fillRect(x+w*.13,y+h*.55,w*.74,1);
      ctx.fillStyle='rgba(230,255,255,.2)';ctx.fillRect(x+w*.08,y+h*.28,w*.08,h*.25);
      // Wheels.
      ctx.fillStyle='#020617';
      const wheelW=Math.max(3,w*.08);
      const wheelH=Math.max(5,h*.27);
      ctx.fillRect(x-wheelW*.35,y+h*.18,wheelW,wheelH);
      ctx.fillRect(x+w-wheelW*.65,y+h*.18,wheelW,wheelH);
      ctx.fillRect(x-wheelW*.35,y+h*.58,wheelW,wheelH);
      ctx.fillRect(x+w-wheelW*.65,y+h*.58,wheelW,wheelH);

      // Lights make travel direction easy to read.
      ctx.fillStyle=isPlayer?'#bbf7d0':'#fde68a';
      ctx.fillRect(x+w*.12,y+h*.70,Math.max(4,w*.13),Math.max(2,h*.10));
      ctx.fillRect(x+w*.75,y+h*.70,Math.max(4,w*.13),Math.max(2,h*.10));

      ctx.fillStyle=isPlayer?'#86efac':'#fb7185';
      ctx.fillRect(x+w*.12,y+h*.12,Math.max(4,w*.13),Math.max(2,h*.09));
      ctx.fillRect(x+w*.75,y+h*.12,Math.max(4,w*.13),Math.max(2,h*.09));

      if(isPlayer){
        ctx.strokeStyle='rgba(220,252,231,.58)';
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.roundRect(x+2,y+2,w-4,h-4,Math.max(3,radius-2));
        ctx.stroke();
      }

      ctx.restore();
    }

    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);

      const gradient=ctx.createLinearGradient(0,0,0,canvas.height);
      gradient.addColorStop(0,'#06111d');
      gradient.addColorStop(.58,'#091a2c');
      gradient.addColorStop(1,'#102342');
      ctx.fillStyle=gradient;
      ctx.fillRect(0,0,canvas.width,canvas.height);

      // Calm road treatment: broad lane zones and continuous, low-contrast
      // separators instead of repeated dashed marks.
      const laneWidth=canvas.width/3;
      ctx.fillStyle='rgba(56,189,248,.018)';
      ctx.fillRect(0,0,laneWidth,canvas.height);
      ctx.fillStyle='rgba(34,211,238,.028)';
      ctx.fillRect(laneWidth,0,laneWidth,canvas.height);
      ctx.fillStyle='rgba(56,189,248,.018)';
      ctx.fillRect(laneWidth*2,0,laneWidth,canvas.height);

      ctx.save();
      ctx.strokeStyle='rgba(125,211,252,.13)';
      ctx.lineWidth=1.5;
      [laneWidth,laneWidth*2].forEach(x=>{
        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,canvas.height);
        ctx.stroke();
      });
      ctx.restore();

      const colors=['#67e8f9','#ae98ff','#fb89cf','#ffd77c','#ff9584'];
      const sectorColor=colors[Math.min(4,runLevel-1)];
      ctx.strokeStyle=sectorColor+'44';ctx.lineWidth=2;
      for(const edge of [8,canvas.width-8]){ctx.beginPath();ctx.moveTo(edge,0);ctx.lineTo(edge,canvas.height);ctx.stroke();}
      ctx.fillStyle=sectorColor+'30';
      for(let y=-40+(roadOffset%64);y<canvas.height;y+=64)for(const x of [laneWidth,laneWidth*2])ctx.fillRect(x-1,y,2,19);
      // Soft cyan shoulder glow frames the play area without flashing motion.
      const leftGlow=ctx.createLinearGradient(0,0,22,0);
      leftGlow.addColorStop(0,'rgba(34,211,238,.15)');
      leftGlow.addColorStop(1,'rgba(34,211,238,0)');
      ctx.fillStyle=leftGlow;
      ctx.fillRect(0,0,24,canvas.height);

      const rightGlow=ctx.createLinearGradient(canvas.width,0,canvas.width-22,0);
      rightGlow.addColorStop(0,'rgba(34,211,238,.15)');
      rightGlow.addColorStop(1,'rgba(34,211,238,0)');
      ctx.fillStyle=rightGlow;
      ctx.fillRect(canvas.width-24,0,24,canvas.height);

      // Slight spotlight under the player helps eye tracking without adding
      // more moving scenery.
      const focus=ctx.createRadialGradient(player.x+player.w/2,player.y+player.h/2,8,player.x+player.w/2,player.y+player.h/2,82);
      focus.addColorStop(0,'rgba(52,211,153,.085)');
      focus.addColorStop(1,'rgba(52,211,153,0)');
      ctx.fillStyle=focus;
      ctx.fillRect(Math.max(0,player.x-66),Math.max(0,player.y-66),player.w+132,player.h+132);

      if(running&&!reducedMotion.matches){ctx.fillStyle='#67e8f92b';ctx.fillRect(player.x+5,player.y+player.h+3,4,12);ctx.fillRect(player.x+player.w-9,player.y+player.h+3,4,12);}
      drawNeonCar(player.x,player.y,player.w,player.h,DodgerProgression.carColor(bestLevel),true);
      obstacles.forEach(o=>drawNeonCar(o.x,o.y,o.w,o.h,o.color,false));
      for(const p of visualParticles){ctx.globalAlpha=Math.max(0,p.life/.38);ctx.fillStyle='#a5ffff';ctx.fillRect(p.x,p.y,2,2);}ctx.globalAlpha=1;
    }

    function difficultyFor(seconds){
      return DodgerProgression.difficulty(seconds);
    }

    function trafficSpeedFor(seconds){
      return difficultyFor(seconds).speed;
    }

    function spawnDelayFor(seconds){
      return difficultyFor(seconds).delay;
    }

    function spawn(now){
      const seconds=Math.max(0,(now-startTime)/1000);
      const laneWidth=canvas.width/3;
      const stage=difficultyFor(seconds);
      const paired=Math.random()<stage.pairChance;
      let lanes;
      if(paired){
        // Later stages add true switchbacks. From an edge, some waves force
        // the opening all the way to the opposite edge instead of letting a
        // player camp near the same safe lane for the whole run.
        let next;
        const farLane=lastOpenLane===0?2:lastOpenLane===2?0:null;
        if(farLane!==null && Math.random()<stage.farShiftChance){
          next=farLane;
        }else if(lastOpenLane===1){
          next=Math.random()<.5?0:2;
        }else{
          next=1;
        }
        lastOpenLane=next;
        lanes=[0,1,2].filter(lane=>lane!==next);
      }else{
        // A single car follows the lane occupied at spawn time; idling in one
        // lane is no longer a reliable way through the opening seconds.
        lanes=[Math.max(0,Math.min(2,Math.floor((player.x+player.w/2)/laneWidth)))];
      }
      const color=['#ef4444','#f97316','#eab308','#a855f7'][Math.floor(Math.random()*4)];
      function addTrafficRow(blocked, y, width, rowColor){
        blocked.forEach(lane=>{
          obstacles.push({
            x:lane*laneWidth+(laneWidth-width)/2,
            y,
            w:width,
            h:28,
            speed:trafficSpeedFor(seconds),
            color:rowColor
          });
        });
      }
      addTrafficRow(lanes,-32,paired?stage.blockWidth:52,color);
      if(paired && Math.random()<stage.followUpChance){
        // The second row trails the first by 360–420 ms at the same speed.
        // Its safe lane is adjacent, so the player can clear row one and
        // move one lane before row two arrives; never demand a blind jump.
        const firstOpen=lastOpenLane;
        const followUpOpen=firstOpen===1?(Math.random()<.5?0:2):1;
        const followUpY=-32-stage.speed*stage.followUpGapMs/16.667;
        addTrafficRow([0,1,2].filter(lane=>lane!==followUpOpen),followUpY,stage.blockWidth,'#e879f9');
        lastOpenLane=followUpOpen;
        if(Math.random()<(stage.thirdRowChance||0)){
          // From the middle, open the opposite edge so camping or reversing
          // back to the first gap cannot clear the full pattern.
          const thirdOpen=followUpOpen===1?(firstOpen===0?2:0):1;
          const thirdY=followUpY-stage.speed*stage.followUpGapMs/16.667;
          addTrafficRow([0,1,2].filter(lane=>lane!==thirdOpen),thirdY,stage.blockWidth,'#22d3ee');
          lastOpenLane=thirdOpen;
          if(Math.random()<(stage.fourthRowChance||0)){
            const fourthOpen=thirdOpen===1?(firstOpen===0?0:2):1;
            const fourthY=thirdY-stage.speed*stage.followUpGapMs/16.667;
            addTrafficRow([0,1,2].filter(lane=>lane!==fourthOpen),fourthY,stage.blockWidth,'#fb923c');
            lastOpenLane=fourthOpen;return stage.followUpGapMs*3;
          }
          return stage.followUpGapMs*2;
        }
        return stage.followUpGapMs;
      }
      return 0;
    }

    function intersects(a,b){
      return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
    }

    function loop(now){
      if(!running) return;

      if(!startTime) startTime=now;
      const elapsed=Math.max(0,now-startTime);
      const seconds=Math.floor(elapsed/1000);

      if(!nextSpawnAt) nextSpawnAt=now+560;
      if(now>=nextSpawnAt){
        const followUpGapMs=spawn(now);
        lastSpawn=now;
        // Give the following wave its full approach time after the second row.
        nextSpawnAt=now+spawnDelayFor(seconds)+followUpGapMs;
      }

      const frameScale=lastFrame?Math.min(2,(now-lastFrame)/16.667):1;
      lastFrame=now;
      const visualDt=frameScale*16.667/1000;
      if(!reducedMotion.matches){roadOffset+=trafficSpeedFor(seconds)*frameScale;for(const p of visualParticles){p.life-=visualDt;p.x+=p.vx*visualDt;p.y+=p.vy*visualDt;}visualParticles=visualParticles.filter(p=>p.life>0).slice(-40);}else visualParticles=[];
      DodgerAudio.drive(dragging ? .32 : 0);
      obstacles.forEach(o=>o.y+=o.speed*frameScale);

      const survivors=[];
      const hitPlayer={
        x:player.x+5,
        y:player.y+3,
        w:player.w-10,
        h:player.h-6
      };
      for(const o of obstacles){
        const hitObstacle={
          x:o.x+4,
          y:o.y+3,
          w:Math.max(1,o.w-8),
          h:Math.max(1,o.h-6)
        };
        if(intersects(hitPlayer,hitObstacle)){
          finishGame(seconds);
          return;
        }
        if(!o.nearPlayed&&o.y>player.y+player.h){o.nearPlayed=true;const gap=Math.max(o.x-(player.x+player.w),player.x-(o.x+o.w));if(gap>=-4&&gap<28)nearEffect(o,now);}
        if(o.y>canvas.height){
          dodged+=1;
          dodgedEl.textContent=dodged;

        }else{
          survivors.push(o);
        }
      }
      obstacles=survivors;

      if(seconds!==lastSecondShown){
        lastSecondShown=seconds;
        timeEl.textContent=seconds;
        rewardPreviewEl.textContent=rewardFor(seconds,dodged);
        xpPreviewEl.textContent='+10';
        updateLevel(seconds);
        setStatus('LEVEL '+DodgerProgression.progress(seconds).level,'running');
      }

      draw();

      animation=requestAnimationFrame(loop);
    }

    function finishGame(seconds){
      if(!running) return;
      running=false;
      pauseStartedAt=0;
      cancelAnimationFrame(animation);
      animation=null;
      clearDragState();
      lastFrame=0;

      const earned=rewardFor(seconds,dodged);
      timeEl.textContent=seconds;
      dodgedEl.textContent=dodged;
      rewardPreviewEl.textContent=earned;
      Arcade.earn(earned,'Neon Dodger', { kind:'game', game:'dodger', metric:seconds, aux:dodged });
      DodgerAudio.stop();DodgerAudio.effect('crash');clearTimeout(audioEndTimer);audioEndTimer=setTimeout(()=>{if(!running&&!starting)DodgerAudio.suspend();},700);
      const result=Arcade.recordResult('dodger', seconds);

      const best=Math.max(seconds,Arcade.number('dodgerBest'));
      localStorage.setItem('dodgerBest',String(best));

      starting=false;
      refreshChrome();
      setStatus('Traffic Jammed!','over');
      startButton.disabled=false;
      startButton.textContent='👆 Tap Game to Play Again';

      Arcade.gameResult({
        icon:'💥',
        title:'Run Over',
        scoreLabel:'Seconds Survived',
        score:seconds + 's',
        best:best + 's',
        coins:earned,
        result,
        playsLeft:Arcade.remaining('dodger'),
        game:'dodger',
        badgeText:'🏁 LEVEL '+runLevel,
        extra:['⏱️ Time played: '+seconds+'s','🚧 Obstacles dodged: ' + dodged,'🏁 Level reached: '+runLevel+' · Best: '+bestLevel,'Next goal: Level '+(runLevel+1)+' at '+(runLevel*20)+'s'],
        onReplay:startGame,
        onMorePlays:()=>Arcade.out('dodger',refreshChrome)
      });
    }

    function clientXToGameX(clientX){
      const rect=canvas.getBoundingClientRect();
      const scale=canvas.width/rect.width;
      return (clientX-rect.left)*scale;
    }

    function setPlayerX(x){
      player.x=Math.max(0,Math.min(canvas.width-player.w,x));
    }

    let dragging = false;
    let dragPointer = null;
    let dragStartClientX=0;
    let dragStartPlayerX=0;

    function beginDrag(event){
      if(!running || document.body.classList.contains('earnly-game-paused') || dragging || dragPointer!==null) return false;
      if(event.isPrimary===false || (event.pointerType==='mouse' && event.button!==0)) return false;
      dragging=true;
      dragPointer=event.pointerId;
      dragStartClientX=event.clientX;
      dragAnchorClientX=event.clientX;
      dragStartPlayerX=player.x;
      return true;
    }

    function moveDrag(event){
      // Use movement deltas instead of mapping the finger directly to the
      // canvas so control stays smooth even if the finger leaves the road.
      const rect=canvas.getBoundingClientRect();
      const scale=canvas.width/rect.width;
      const delta=(event.clientX-dragAnchorClientX)*scale;
      setPlayerX(player.x+delta);
      dragAnchorClientX=event.clientX;
    }

    canvas.addEventListener('pointerdown',event=>{
      if(event.isPrimary===false || (event.pointerType==='mouse' && event.button!==0)) return;
      event.preventDefault();

      if(!running){
        if(!starting) startGame();
        return;
      }

      if(beginDrag(event)) canvas.setPointerCapture?.(event.pointerId);
    });

    canvas.addEventListener('pointermove',event=>{
      if(!dragging || dragPointer !== event.pointerId) return;
      event.preventDefault();
      moveDrag(event);
    });

    document.addEventListener('pointerdown',event=>{
      if(event.target===canvas || event.target.closest?.('a,button,[role="button"],.earnly-pause-button')) return;
      if(!Arcade.inExpandedGameZone(event,canvas,130)) return;
      if(event.isPrimary===false || (event.pointerType==='mouse' && event.button!==0)) return;
      event.preventDefault();

      if(!running){
        if(!starting) startGame();
        return;
      }

      beginDrag(event);
    },{passive:false});

    document.addEventListener('pointermove',event=>{
      if(!dragging || dragPointer !== event.pointerId) return;
      event.preventDefault();
      moveDrag(event);
    },{passive:false});

    const stopDragging = event => {
      if(event && dragPointer !== event.pointerId) return;
      dragging = false;
      dragPointer = null;
      dragAnchorClientX = null;
    };

    canvas.addEventListener('pointerup',stopDragging);
    canvas.addEventListener('pointercancel',stopDragging);
    document.addEventListener('pointerup',stopDragging);
    document.addEventListener('pointercancel',stopDragging);
    canvas.addEventListener('contextmenu',event=>event.preventDefault());
    document.addEventListener('contextmenu',event=>{
      if(running && Arcade.inExpandedGameZone(event,canvas,130)) event.preventDefault();
    });

    document.addEventListener('keydown',event=>{
      if(!running || document.body.classList.contains('earnly-game-paused') || Arcade.isProtectedGameControlTarget(event.target)) return;
      if(event.key==='ArrowLeft' || event.key==='a' || event.key==='A'){event.preventDefault();player.x=Math.max(0,player.x-24);}
      if(event.key==='ArrowRight' || event.key==='d' || event.key==='D'){event.preventDefault();player.x=Math.min(canvas.width-player.w,player.x+24);}
    });

    function clearDragState(){
      dragging=false;
      dragPointer=null;
      dragAnchorClientX=null;
    }

    window.addEventListener('blur',()=>{clearDragState();DodgerAudio.suspend();});
    window.addEventListener('pagehide',()=>{clearTimeout(audioEndTimer);DodgerAudio.suspend();});
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden){clearDragState();DodgerAudio.suspend();}
    });

    let earnlyRunStartedAt=0,totalPausedMs=0,pauseStartedAt=0;
    function startGame(){
      if(running || starting) return;
      starting=true;
      if(!Arcade.consume('dodger')){
        starting=false;
        Arcade.out('dodger',refreshChrome);
        return;
      }
      clearTimeout(audioEndTimer);DodgerAudio.stop();DodgerAudio.unlock().then(ok=>{if(ok&&starting&&!document.hidden)DodgerAudio.effect('start');});roadOffset=0;visualParticles=[];lastWhooshAt=-1000;
      earnlyRunStartedAt=0; totalPausedMs=0; pauseStartedAt=0; 

      cancelAnimationFrame(animation);
      animation=null;
      clearDragState();
      obstacles=[];
      player.x=(canvas.width-player.w)/2;
      lastFrame=0;
      startTime=0;
      lastSpawn=0;
      nextSpawnAt=0;
      dodged=0;
      lastSecondShown=-1;
      lastOpenLane=1;
      runLevel=1;levelNoticeUntil=0;updateLevel(0);
      timeEl.textContent='0';
      dodgedEl.textContent='0';
      rewardPreviewEl.textContent='0';

      running=false;
      startButton.disabled=true;
      startButton.textContent='Get Ready…';
      setStatus('Get Ready');
      refreshChrome();
      draw();

      Arcade.countdown(()=>{
        starting=false;
        running=true;
        earnlyRunStartedAt=performance.now();
        startButton.textContent='Game Running';
        setStatus('Running','running');
        refreshChrome();
        requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'auto'}));
        startTime=0;
        lastSpawn=0;
        nextSpawnAt=0;
        animation=requestAnimationFrame(loop);
      });
    }

    Arcade.installPauseControl({
      isRunning:()=>running,
      pause:()=>{
        if(!running||pauseStartedAt)return;
        DodgerAudio.suspend();pauseStartedAt=performance.now();cancelAnimationFrame(animation);animation=null;clearDragState();lastFrame=0;
      },
      allowWhilePaused:event=>!!event.target.closest?.('#soundButton'),
      resume:()=>{
        if(!running||!pauseStartedAt)return;
        DodgerAudio.unlock();const d=performance.now()-pauseStartedAt;totalPausedMs+=d;pauseStartedAt=0;if(startTime)startTime+=d;if(lastSpawn)lastSpawn+=d;if(nextSpawnAt)nextSpawnAt+=d;lastFrame=0;cancelAnimationFrame(animation);animation=null;animation=requestAnimationFrame(loop);
      }
    });
    let sessionDock=document.querySelector('.earnly-session-dock');if(!sessionDock){sessionDock=document.createElement('div');sessionDock.className='earnly-session-dock';sessionDock.append(document.getElementById('earnlyPauseButton'),document.getElementById('earnlyQuitButton'));document.body.append(sessionDock);}
    startButton.addEventListener('click',startGame);
    document.addEventListener('keydown',event=>{
      if((event.key==='Enter' || event.key===' ') && !running && !starting && !Arcade.isProtectedGameControlTarget(event.target)){
        event.preventDefault();
        startGame();
      }
    });
    soundControl();
    refreshChrome();
    updateLevel(0);
    draw();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cloud.js"></script>
</body>
</html>
