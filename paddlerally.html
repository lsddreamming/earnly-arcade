<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Earnly">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="earnly-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="earnly-icon.svg">
  <title>Earnly Paddle Rally</title>
  <link rel="stylesheet" href="arcade.css">
  <style>html,body,.container{touch-action:manipulation}.rally-board{width:min(88vw,360px);height:auto;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:18px}
    .rally-control-zone{display:none}
    @media(max-width:600px){
      body.paddlerally-page main.container{padding-top:8px!important;padding-bottom:92px!important}
      body.paddlerally-page .topbar{margin-bottom:4px!important}
      body.paddlerally-page .page-header{margin:0 0 5px!important}
      body.paddlerally-page .page-header h1{font-size:20px!important;margin:2px 0 5px!important}
      body.paddlerally-page .game-meta{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:4px!important;width:100%!important}
      body.paddlerally-page .meta-pill{font-size:9px!important;padding:4px 2px!important;min-height:28px!important;text-align:center!important}
      body.paddlerally-page #startButton{margin:4px auto 6px!important;min-height:42px!important}
      body.paddlerally-page .rally-board{width:min(88vw,350px)!important;margin:5px auto!important;display:block!important}
      body.paddlerally-page.game-active .game-guide-strip,body.paddlerally-page.game-active .game-guide-more,body.paddlerally-page.game-active a.button.secondary{display:none!important}
      body.paddlerally-page.game-active .topbar,body.paddlerally-page.game-active #startButton{visibility:hidden!important;pointer-events:none!important}
      body.paddlerally-page.game-active main.container{padding-top:8px!important}
      body.paddlerally-page.game-active .page-header{margin-bottom:3px!important}
      body.paddlerally-page.game-active .page-header h1{font-size:18px!important;margin:0 0 4px!important}
      body.paddlerally-page.game-active .rally-board{width:min(90vw,358px)!important;margin:3px auto!important}
      body.paddlerally-page.game-active .rally-control-zone{display:flex;width:min(90vw,358px);height:52px;margin:4px auto 0;border:1px solid #334155;border-radius:14px;background:#17243a;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:800;color:#cbd5e1;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
      body.paddlerally-page.game-active .game-status{font-size:9px!important;padding:3px 7px!important}
    }
  </style>
</head>
<body class="paddlerally-page">
  <main class="container">
    <div class="topbar">
      <a class="brand" href="games.html">← Games</a>
      <a class="balance-chip" href="rewards.html">🪙 <span id="balance">0</span></a>
    </div>
    <header class="page-header">
      <h1>🏓 Paddle Rally</h1>
      <div class="game-meta"><span class="meta-pill">Rallies: <span id="score">0</span></span>
        <span class="meta-pill">Speed: <span id="speed">1.0</span>x</span>
        <span class="meta-pill">Reward: <span id="rewardPreview">0</span> 🪙</span>
        <span class="meta-pill"><span id="plays">0</span> plays left</span></div>
      <span class="game-status" id="gameStatus">Ready</span>
      <button class="secondary" id="pauseButton" type="button" hidden>⏸ Pause</button>
    </header>
    <button class="green wide" id="startButton" type="button">👆 Tap the Game to Start</button>
    <canvas class="rally-board touch-surface" id="game" width="360" height="500" aria-label="Paddle Rally game board"></canvas>
    <div class="rally-control-zone" id="rallyControlZone" aria-label="Swipe left or right to move paddle">↔️ Swipe here to move paddle</div>
    <a class="button wide secondary" href="games.html">← Back to Games</a>
  </main>
  <script src="arcade.js"></script>
  <script>
    const playsEl=document.getElementById('plays');
    const balanceEl=document.getElementById('balance');
    const statusEl=document.getElementById('gameStatus');
    const startButton=document.getElementById('startButton');
    const pauseButton=document.getElementById('pauseButton');
    function setStatus(text,mode){ statusEl.textContent=text; statusEl.className='game-status'+(mode?' '+mode:''); document.body.classList.toggle('game-active',mode==='running'); }
    function refreshChrome(){ playsEl.textContent=Arcade.remaining('paddleRally'); balanceEl.textContent=Arcade.number('points').toLocaleString(); if(typeof refreshReward==='function') refreshReward(); }
    function beginPlay(){
      if(!Arcade.consume('paddleRally')){ Arcade.out('paddleRally',refreshChrome); return false; }
      refreshChrome(); return true;
    }
    
    const canvas=document.getElementById('game'),rallyControlZone=document.getElementById('rallyControlZone'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),speedEl=document.getElementById('speed'),rewardPreviewEl=document.getElementById('rewardPreview');
    Arcade.gameGuide({game:'paddleRally',surface:canvas,steps:[{icon:'👆',title:'Start',text:'Tap board or press Enter'},{icon:'↔️',title:'Control',text:'Move the paddle'},{icon:'🏓',title:'Goal',text:'Keep the rally alive'}],
      overlayIcon:'🏓',overlayTitle:'Keep the Ball Alive',overlayText:'Move the paddle under the ball. Each return makes it faster.',replayTitle:'Tap to Play Again',
      tips:['Mouse/finger movement controls the paddle. Arrow keys also work.','The run ends when the ball gets past your paddle.'],reward:'Long rallies earn up to 25 Coins.'});
    const paddle={x:136,y:458,w:88,h:14},ball={x:180,y:300,r:7,dx:4.0,dy:-5.3};
    let score=0,running=false,starting=false,paused=false,animation=null,last=0,pauseStartedAt=0,totalPausedMs=0,lastFrame=0;
    function rewardFor(v){let c=Math.floor(v/3);if(v>=10)c+=2;if(v>=20)c+=3;if(v>=35)c+=5;return Math.min(c,25)}
    function refreshReward(){rewardPreviewEl.textContent=rewardFor(score)}
    function reset(){cancelAnimationFrame(animation);animation=null;clearRallyControl();score=0;paused=false;pauseStartedAt=0;totalPausedMs=0;lastFrame=0;paddle.w=88;paddle.x=(canvas.width-paddle.w)/2;ball.x=180;ball.y=350;ball.dx=(Math.random()>.5?1:-1)*4.0;ball.dy=-5.3;scoreEl.textContent='0';speedEl.textContent='1.0';refreshReward();draw()}
    function draw(){
      const bg=ctx.createLinearGradient(0,0,0,canvas.height);bg.addColorStop(0,'#0b1729');bg.addColorStop(1,'#10263d');ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.strokeStyle='rgba(56,189,248,.12)';ctx.lineWidth=1;for(let y=55;y<canvas.height;y+=55){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke()}
      ctx.strokeStyle='rgba(148,163,184,.25)';ctx.setLineDash([6,8]);ctx.beginPath();ctx.moveTo(0,250);ctx.lineTo(canvas.width,250);ctx.stroke();ctx.setLineDash([]);
      ctx.save();ctx.shadowColor='rgba(59,130,246,.55)';ctx.shadowBlur=14;const pg=ctx.createLinearGradient(paddle.x,paddle.y,paddle.x,paddle.y+paddle.h);pg.addColorStop(0,'#60a5fa');pg.addColorStop(1,'#2563eb');ctx.fillStyle=pg;ctx.beginPath();ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,7);ctx.fill();ctx.restore();
      ctx.save();ctx.shadowColor='rgba(255,255,255,.8)';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.restore();
    }
    function clearRallyControl(){controlPointer=null;controlLastX=null}
    function finish(){
      if(!running)return;running=false;paused=false;clearRallyControl();pauseButton.hidden=true;cancelAnimationFrame(animation);animation=null;
      const earned=rewardFor(score);Arcade.earn(earned,'Paddle Rally',{kind:'game',game:'paddleRally',metric:score});Arcade.feedback('fail');const result=Arcade.recordResult('paddleRally',score);
      starting=false;refreshChrome();startButton.disabled=false;startButton.textContent='👆 Tap Game to Play Again';setStatus('Missed','over');draw();
      Arcade.gameResult({icon:'🏓',title:'Rally Over',scoreLabel:'Returns',score,best:result.best.display,coins:earned,result,playsLeft:Arcade.remaining('paddleRally'),game:'paddleRally',
        extra:['⏱️ Time played: '+Math.max(1,Math.round((performance.now()-earnlyRunStartedAt-totalPausedMs)/1000))+'s',score>=20?'🔥 Serious rally!':'Stay centered under the ball.'],onReplay:startGame,onMorePlays:()=>Arcade.out('paddleRally',refreshChrome)});
    }
    function loop(now){
      if(!running||paused)return;
      if(!lastFrame)lastFrame=now;
      const dt=Math.min(34,Math.max(0,now-lastFrame))/16.67;
      lastFrame=now;
      const prevY=ball.y;
      ball.x+=ball.dx*dt;ball.y+=ball.dy*dt;
      if(ball.x-ball.r<=0&&ball.dx<0){ball.x=ball.r;ball.dx*=-1}
      if(ball.x+ball.r>=canvas.width&&ball.dx>0){ball.x=canvas.width-ball.r;ball.dx*=-1}
      if(ball.y-ball.r<=0&&ball.dy<0){ball.y=ball.r;ball.dy*=-1}
      // Swept paddle check keeps very fast rallies from skipping through the paddle between frames.
      const crossedPaddle=ball.dy>0&&prevY+ball.r<=paddle.y&&ball.y+ball.r>=paddle.y;
      if(crossedPaddle&&ball.x+ball.r>=paddle.x&&ball.x-ball.r<=paddle.x+paddle.w){
        const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
        // Keep accelerating throughout long rallies instead of capping near 2x.
        const currentMag=Math.hypot(ball.dx,ball.dy);
        const mag=currentMag*1.045;
        ball.dx=mag*.72*hit;ball.dy=-Math.sqrt(Math.max(10,mag*mag-ball.dx*ball.dx));ball.y=paddle.y-ball.r-1;score++;scoreEl.textContent=String(score);speedEl.textContent=(mag/5.8).toFixed(1);refreshReward();
        // Keep normal returns quiet enough that long rallies do not become a wall of feedback.
        if(score===1||score%5===0)Arcade.feedback('hit');
        if(score===8)paddle.w=78;
        if(score===18)paddle.w=68;
        if(score===30)paddle.w=60;
      }
      if(ball.y-ball.r>canvas.height){finish();return}draw();animation=requestAnimationFrame(loop);
    }
    function moveTo(clientX){const r=canvas.getBoundingClientRect();const x=(clientX-r.left)*(canvas.width/r.width);paddle.x=Math.max(0,Math.min(canvas.width-paddle.w,x-paddle.w/2))}
    let earnlyRunStartedAt=0;
    function startGame(){if(running||starting)return;starting=true;if(!beginPlay()){starting=false;return} earnlyRunStartedAt=performance.now();reset();startButton.disabled=true;startButton.textContent='Get Ready…';setStatus('Get Ready');
      Arcade.countdown(()=>{starting=false;running=true;paused=false;pauseButton.hidden=false;pauseButton.textContent='⏸ Pause';startButton.textContent='Game Running';setStatus('Running','running');animation=requestAnimationFrame(loop)})}
    function togglePause(){if(!running)return;if(!paused){paused=true;clearRallyControl();pauseStartedAt=performance.now();lastFrame=0;cancelAnimationFrame(animation);animation=null;pauseButton.textContent='▶ Resume';setStatus('Paused');}else{paused=false;totalPausedMs+=performance.now()-pauseStartedAt;pauseStartedAt=0;lastFrame=0;pauseButton.textContent='⏸ Pause';setStatus('Running','running');animation=requestAnimationFrame(loop)}}
    pauseButton.addEventListener('click',togglePause);
    let controlPointer=null,controlLastX=null;
    function beginRelativeControl(e,target){
      if(!running||paused||controlPointer!==null)return;
      if(e.isPrimary===false||(e.pointerType==='mouse'&&e.button!==0))return;
      controlPointer=e.pointerId;controlLastX=e.clientX;
      try{target?.setPointerCapture?.(e.pointerId)}catch{}
    }
    function moveRelative(clientX){
      if(controlLastX===null){controlLastX=clientX;return}
      const delta=clientX-controlLastX;controlLastX=clientX;
      const r=canvas.getBoundingClientRect();
      paddle.x=Math.max(0,Math.min(canvas.width-paddle.w,paddle.x+delta*(canvas.width/r.width)));
    }
    canvas.addEventListener('pointerdown',e=>{
      e.preventDefault();
      if(!running){if(!starting)startGame();return}
      beginRelativeControl(e,canvas)
    });
    canvas.addEventListener('pointermove',e=>{
      if(running&&!paused&&controlPointer===e.pointerId){e.preventDefault();moveRelative(e.clientX)}
    },{passive:false});
    const stopControl=e=>{if(e&&controlPointer!==e.pointerId)return;clearRallyControl()};
    canvas.addEventListener('pointerup',stopControl);
    canvas.addEventListener('pointercancel',stopControl);
    rallyControlZone.addEventListener('pointerdown',e=>{if(!running||paused)return;e.preventDefault();beginRelativeControl(e,rallyControlZone)});
    rallyControlZone.addEventListener('pointermove',e=>{if(running&&!paused&&controlPointer===e.pointerId){e.preventDefault();moveRelative(e.clientX)}},{passive:false});
    rallyControlZone.addEventListener('pointerup',stopControl);rallyControlZone.addEventListener('pointercancel',stopControl);

    document.addEventListener('pointerdown',e=>{
      const bottomControl=running&&!paused&&e.clientY>=window.innerHeight-150;
      if(e.target===canvas||rallyControlZone.contains(e.target))return;
      if(!bottomControl&&!Arcade.inExpandedGameZone(e,canvas,130))return;
      e.preventDefault();
      if(!running){if(!starting)startGame();return}
      beginRelativeControl(e,e.target);
    },{passive:false});
    document.addEventListener('pointermove',e=>{
      if(!running||paused||controlPointer!==e.pointerId)return;
      e.preventDefault();
      moveRelative(e.clientX);
    },{passive:false});
    document.addEventListener('touchmove',e=>{
      if(!running||paused||controlPointer===null)return;
      e.preventDefault();
    },{passive:false});
    document.addEventListener('pointerup',stopControl);
    document.addEventListener('pointercancel',stopControl);
    window.addEventListener('blur',clearRallyControl);
    document.addEventListener('visibilitychange',()=>{if(document.hidden)clearRallyControl()});
    document.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&!running&&!starting){e.preventDefault();startGame();return}
      if((e.key===' '||e.key==='p'||e.key==='P')&&running){e.preventDefault();togglePause();return}
      if(!running||paused)return;
      if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){e.preventDefault();paddle.x=Math.max(0,paddle.x-28)}
      if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){e.preventDefault();paddle.x=Math.min(canvas.width-paddle.w,paddle.x+28)}
    });
    startButton.addEventListener('click',startGame);reset();refreshChrome();
  
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cloud.js"></script>
</body>
</html>
