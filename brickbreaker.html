<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Earnly">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="earnly-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="earnly-icon.svg">
  <title>Earnly Brick Breaker</title>
  <link rel="stylesheet" href="arcade.css">
  <style>
    .brick-board{width:min(86vw,360px);height:auto;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  </style>
</head>
<body>
  <main class="container">
    <div class="topbar">
      <a class="brand" href="games.html">← Games</a>
      <a class="balance-chip" href="rewards.html">🪙 <span id="balance">0</span></a>
    </div>

    <header class="page-header">
      <h1>🧱 Brick Breaker</h1>
      <div class="game-meta">
        <span class="meta-pill">Level: <span id="level">1</span></span>
        <span class="meta-pill">Bricks: <span id="bricks">0</span>/35</span>
        <span class="meta-pill">Reward: <span id="rewardPreview">0</span> 🪙</span>
        <span class="meta-pill"><span id="plays">0</span> plays left</span>
      </div>
      <span class="game-status" id="gameStatus">Ready</span>
    </header>

    <button class="green wide" id="startButton" type="button">👆 Tap the Game to Start</button>
    <canvas class="brick-board touch-surface" id="game" width="360" height="500" aria-label="Brick Breaker game board"></canvas>
    <a class="button wide secondary" href="games.html">← Back to Games</a>
  </main>

  <script src="arcade.js"></script>
  <script>
    const canvas=document.getElementById('game');
    const ctx=canvas.getContext('2d');
    const levelEl=document.getElementById('level');
    const bricksEl=document.getElementById('bricks');
    const rewardPreviewEl=document.getElementById('rewardPreview');
    const playsEl=document.getElementById('plays');
    const balanceEl=document.getElementById('balance');
    const statusEl=document.getElementById('gameStatus');
    const startButton=document.getElementById('startButton');

    Arcade.gameGuide({
      game:'brickBreaker',
      surface:canvas,
      steps:[
        { icon:'👆', title:'Start', text:'Tap the board' },
        { icon:'↔️', title:'Control', text:'Drag the paddle' },
        { icon:'🧱', title:'Goal', text:'Clear levels. Each round gets faster' }
      ],
      overlayIcon:'👆',
      overlayTitle:'Tap to Start',
      overlayText:'Drag left and right to keep the ball in play',
      replayTitle:'Tap to Play Again',
      tips:[
        'Keep the paddle under the ball. Missing the ball ends the run.',
        'Clear all 35 bricks to advance instantly to the next level.',
        'Every new level speeds up the ball and increases your possible Coin reward.'
      ],
      reward:'Higher levels build bigger rewards — up to 100 Coins in one run.'
    });

    const paddle={x:135,y:465,w:90,h:12};
    const ball={x:180,y:430,r:7,dx:3.8,dy:-4.4};
    let bricks=[];
    let level=1;
    let levelBroken=0;
    let totalBroken=0;
    let levelsCleared=0;
    let running=false;
    let starting=false;
    let animation=null;
    let levelTimer=null;

    function levelSpeed(){
      return Math.min(9.8, 5.6 + (level-1)*0.7);
    }

    function levelClearBonus(clearedLevel){
      return Math.min(20, 5 + (clearedLevel-1)*3);
    }

    function rewardFor(count,clears){
      let reward=Math.floor(count/3);
      if(count>=15) reward+=2;
      if(count>=25) reward+=3;
      for(let clearedLevel=1; clearedLevel<=clears; clearedLevel++){
        reward+=levelClearBonus(clearedLevel);
      }
      return Math.min(reward,100);
    }

    function currentReward(){
      return rewardFor(totalBroken,levelsCleared);
    }

    function launchBall(){
      const speed=levelSpeed();
      const horizontal=speed*(0.48+Math.random()*0.12)*(Math.random()>.5?1:-1);
      ball.x=canvas.width/2;
      ball.y=430;
      ball.dx=horizontal;
      ball.dy=-Math.sqrt(Math.max(1,speed*speed-horizontal*horizontal));
    }

    function refreshChrome(){
      playsEl.textContent=Arcade.remaining('brickBreaker');
      balanceEl.textContent=Arcade.number('points').toLocaleString();
    }

    function setStatus(text,mode){
      statusEl.textContent=text;
      statusEl.className='game-status'+(mode?' '+mode:'');
    }

    function resetBricks(){
      bricks=[];
      const rows=5, cols=7, gap=6, margin=16;
      const w=(canvas.width-margin*2-gap*(cols-1))/cols;
      const h=18;
      const colors=['#38bdf8','#a78bfa','#f472b6','#fb923c','#facc15'];
      for(let r=0;r<rows;r++){
        for(let c=0;c<cols;c++){
          bricks.push({
            x:margin+c*(w+gap),
            y:42+r*(h+gap),
            w,h,
            alive:true,
            color:colors[r]
          });
        }
      }
    }

    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#182334';
      ctx.fillRect(0,0,canvas.width,canvas.height);

      bricks.forEach(b=>{
        if(!b.alive) return;
        ctx.fillStyle=b.color;
        ctx.fillRect(b.x,b.y,b.w,b.h);
      });

      ctx.fillStyle='#3b82f6';
      ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);

      ctx.beginPath();
      ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
      ctx.fillStyle='#fff';
      ctx.fill();
    }

    function collideBrick(){
      for(const b of bricks){
        if(!b.alive) continue;
        if(ball.x+ball.r>b.x && ball.x-ball.r<b.x+b.w && ball.y+ball.r>b.y && ball.y-ball.r<b.y+b.h){
          b.alive=false;
          levelBroken+=1;
          totalBroken+=1;
          Arcade.feedback('brick');
          if(totalBroken===10) Arcade.milestone('💥 10 bricks smashed!');
          if(totalBroken===20) Arcade.milestone('🔥 20 bricks · Brick Smasher!', 'perfect');
          bricksEl.textContent=levelBroken;
          rewardPreviewEl.textContent=currentReward();
          ball.dy*=-1;
          return true;
        }
      }
      return false;
    }

    function loop(){
      if(!running) return;

      ball.x+=ball.dx;
      ball.y+=ball.dy;

      if(ball.x-ball.r<=0 || ball.x+ball.r>=canvas.width) ball.dx*=-1;
      if(ball.y-ball.r<=0) ball.dy=Math.abs(ball.dy);

      if(
        ball.dy>0 &&
        ball.y+ball.r>=paddle.y &&
        ball.y-ball.r<=paddle.y+paddle.h &&
        ball.x>=paddle.x &&
        ball.x<=paddle.x+paddle.w
      ){
        const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
        const speed=levelSpeed();
        ball.dx=speed*0.78*hit;
        ball.dy=-Math.sqrt(Math.max((speed*0.58)*(speed*0.58),speed*speed-ball.dx*ball.dx));
        ball.y=paddle.y-ball.r-1;
      }

      collideBrick();

      if(levelBroken===35){
        advanceLevel();
        return;
      }

      if(ball.y-ball.r>canvas.height){
        finishGame();
        return;
      }

      draw();
      animation=requestAnimationFrame(loop);
    }

    function advanceLevel(){
      if(!running) return;
      running=false;
      starting=true;
      cancelAnimationFrame(animation);
      animation=null;

      levelsCleared+=1;
      const clearedLevel=level;
      const bonus=levelClearBonus(clearedLevel);
      level+=1;
      levelBroken=0;

      levelEl.textContent=level;
      bricksEl.textContent='0';
      rewardPreviewEl.textContent=currentReward();
      resetBricks();
      paddle.x=(canvas.width-paddle.w)/2;
      launchBall();
      draw();

      Arcade.feedback('success');
      Arcade.milestone('🚀 Level '+level+' · Faster ball · Bigger rewards', 'perfect');
      setStatus('Level '+level+' · Speed '+levelSpeed().toFixed(1),'running');
      startButton.textContent='Level '+level+' · +'+bonus+' clear bonus';

      clearTimeout(levelTimer);
      levelTimer=setTimeout(()=>{
        starting=false;
        running=true;
        startButton.textContent='Game Running · Level '+level;
        setStatus('Running · Level '+level,'running');
        animation=requestAnimationFrame(loop);
      },850);
    }

    function finishGame(){
      if(!running && !starting) return;
      running=false;
      starting=false;
      clearTimeout(levelTimer);
      cancelAnimationFrame(animation);
      animation=null;

      const earned=currentReward();
      Arcade.earn(earned,'Brick Breaker', {
        kind:'game',
        game:'brickBreaker',
        metric:totalBroken,
        aux:levelsCleared,
        levelReached:level
      });
      Arcade.feedback(levelsCleared>0?'success':'fail');
      const result=Arcade.recordResult('brickBreaker', totalBroken);

      const best=Math.max(totalBroken,Arcade.number('brickBreakerBest'));
      localStorage.setItem('brickBreakerBest',String(best));

      refreshChrome();
      setStatus('Game Over · Level '+level,'over');
      startButton.disabled=false;
      startButton.textContent='👆 Tap Game to Play Again';

      const levelText=levelsCleared
        ? '🚀 Reached Level '+level+' · '+levelsCleared+' level'+(levelsCleared===1?'':'s')+' cleared'
        : 'Break all 35 bricks to reach Level 2.';

      Arcade.gameResult({
        icon:levelsCleared>0?'🏆':'💥',
        title:levelsCleared>0?'Level '+level+' Run Complete':'Brick Run Over',
        scoreLabel:'Bricks Broken',
        score:totalBroken,
        best:best+' bricks',
        coins:earned,
        result,
        playsLeft:Arcade.remaining('brickBreaker'),
        game:'brickBreaker',
        extra:[levelText,'⚡ Next levels move faster and can pay more Coins.'],
        onReplay:startGame,
        onMorePlays:()=>Arcade.out('brickBreaker',refreshChrome)
      });
    }

    function setPaddleFromClientX(clientX){
      const rect=canvas.getBoundingClientRect();
      const scale=canvas.width/rect.width;
      const x=(clientX-rect.left)*scale-paddle.w/2;
      paddle.x=Math.max(0,Math.min(canvas.width-paddle.w,x));
    }

    let dragging = false;
    let dragPointer = null;

    canvas.addEventListener('pointerdown',event=>{
      event.preventDefault();

      if(!running){
        if(!starting) startGame();
        return;
      }

      dragging = true;
      dragPointer = event.pointerId;
      setPaddleFromClientX(event.clientX);
      canvas.setPointerCapture?.(event.pointerId);
    });

    canvas.addEventListener('pointermove',event=>{
      if(!dragging || dragPointer !== event.pointerId) return;
      event.preventDefault();
      setPaddleFromClientX(event.clientX);
    });

    document.addEventListener('pointerdown',event=>{
      if(event.target===canvas || !Arcade.inExpandedGameZone(event,canvas,130)) return;
      event.preventDefault();

      if(!running){
        if(!starting) startGame();
        return;
      }

      dragging=true;
      dragPointer=event.pointerId;
      setPaddleFromClientX(event.clientX);
    },{passive:false});

    document.addEventListener('pointermove',event=>{
      if(!dragging || dragPointer !== event.pointerId) return;
      event.preventDefault();
      setPaddleFromClientX(event.clientX);
    },{passive:false});

    const stopDragging = event => {
      if(event && dragPointer !== event.pointerId) return;
      dragging = false;
      dragPointer = null;
    };

    canvas.addEventListener('pointerup',stopDragging);
    canvas.addEventListener('pointercancel',stopDragging);
    document.addEventListener('pointerup',stopDragging);
    document.addEventListener('pointercancel',stopDragging);
    canvas.addEventListener('contextmenu',event=>event.preventDefault());

    document.addEventListener('keydown',event=>{
      if(!running) return;
      if(event.key==='ArrowLeft'){event.preventDefault();paddle.x=Math.max(0,paddle.x-24);}
      if(event.key==='ArrowRight'){event.preventDefault();paddle.x=Math.min(canvas.width-paddle.w,paddle.x+24);}
    });

    function startGame(){
      if(running || starting) return;
      starting=true;
      if(!Arcade.consume('brickBreaker')){
        starting=false;
        Arcade.out('brickBreaker',refreshChrome);
        return;
      }

      clearTimeout(levelTimer);
      resetBricks();
      level=1;
      levelBroken=0;
      totalBroken=0;
      levelsCleared=0;
      levelEl.textContent='1';
      bricksEl.textContent='0';
      rewardPreviewEl.textContent='0';
      paddle.x=(canvas.width-paddle.w)/2;
      launchBall();

      running=false;
      startButton.disabled=true;
      startButton.textContent='Get Ready…';
      setStatus('Get Ready · Level 1');
      refreshChrome();
      draw();

      Arcade.countdown(()=>{
        starting=false;
        running=true;
        startButton.textContent='Game Running · Level 1';
        setStatus('Running · Level 1','running');
        animation=requestAnimationFrame(loop);
      });
    }

    startButton.addEventListener('click',startGame);
    resetBricks();
    refreshChrome();
    draw();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cloud.js"></script>
</body>
</html>
