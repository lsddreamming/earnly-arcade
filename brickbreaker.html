<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Earnly">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="earnly-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="earnly-icon.svg">
  <title>Earnly Brick Breaker</title>
  <link rel="stylesheet" href="arcade.css">
  <style>
    .brick-board{width:min(86vw,360px);height:auto;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  </style>
</head>
<body>
  <main class="container">
    <div class="topbar">
      <a class="brand" href="games.html">← Games</a>
      <a class="balance-chip" href="rewards.html">🪙 <span id="balance">0</span></a>
    </div>

    <header class="page-header">
      <h1>🧱 Brick Breaker</h1>
      <div class="game-meta">
        <span class="meta-pill">Bricks: <span id="bricks">0</span>/35</span>
        <span class="meta-pill">Reward: <span id="rewardPreview">0</span> 🪙</span>
        <span class="meta-pill"><span id="plays">0</span> plays left</span>
      </div>
      <span class="game-status" id="gameStatus">Ready</span>
    </header>

    <button class="green wide" id="startButton" type="button">👆 Tap the Game to Start</button>
    <canvas class="brick-board touch-surface" id="game" width="360" height="500" aria-label="Brick Breaker game board"></canvas>
    <p class="muted small">Tap the board to start the countdown. Then drag left/right to move the paddle and clear all 35 bricks.</p>

    <a class="button wide secondary" href="games.html">← Back to Games</a>
  </main>

  <script src="arcade.js"></script>
  <script>
    const canvas=document.getElementById('game');
    const ctx=canvas.getContext('2d');
    const bricksEl=document.getElementById('bricks');
    const rewardPreviewEl=document.getElementById('rewardPreview');
    const playsEl=document.getElementById('plays');
    const balanceEl=document.getElementById('balance');
    const statusEl=document.getElementById('gameStatus');
    const startButton=document.getElementById('startButton');

    const paddle={x:135,y:465,w:90,h:12};
    const ball={x:180,y:430,r:7,dx:3.2,dy:-3.6};
    let bricks=[];
    let broken=0;
    let running=false;
    let starting=false;
    let animation=null;

    function rewardFor(count,cleared){
      let reward=Math.floor(count/3);
      if(count>=15) reward+=2;
      if(count>=25) reward+=3;
      if(cleared) reward+=5;
      return Math.min(reward,22);
    }

    function refreshChrome(){
      playsEl.textContent=Arcade.remaining('brickBreaker');
      balanceEl.textContent=Arcade.number('points').toLocaleString();
    }

    function setStatus(text,mode){
      statusEl.textContent=text;
      statusEl.className='game-status'+(mode?' '+mode:'');
    }

    function resetBricks(){
      bricks=[];
      const rows=5, cols=7, gap=6, margin=16;
      const w=(canvas.width-margin*2-gap*(cols-1))/cols;
      const h=18;
      const colors=['#38bdf8','#a78bfa','#f472b6','#fb923c','#facc15'];
      for(let r=0;r<rows;r++){
        for(let c=0;c<cols;c++){
          bricks.push({
            x:margin+c*(w+gap),
            y:42+r*(h+gap),
            w,h,
            alive:true,
            color:colors[r]
          });
        }
      }
    }

    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#182334';
      ctx.fillRect(0,0,canvas.width,canvas.height);

      bricks.forEach(b=>{
        if(!b.alive) return;
        ctx.fillStyle=b.color;
        ctx.fillRect(b.x,b.y,b.w,b.h);
      });

      ctx.fillStyle='#3b82f6';
      ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);

      ctx.beginPath();
      ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
      ctx.fillStyle='#fff';
      ctx.fill();
    }

    function collideBrick(){
      for(const b of bricks){
        if(!b.alive) continue;
        if(ball.x+ball.r>b.x && ball.x-ball.r<b.x+b.w && ball.y+ball.r>b.y && ball.y-ball.r<b.y+b.h){
          b.alive=false;
          broken+=1;
          Arcade.feedback('brick');
          if(broken===10) Arcade.milestone('💥 10 bricks smashed!');
          if(broken===20) Arcade.milestone('🔥 20 bricks · Brick Smasher!', 'perfect');
          bricksEl.textContent=broken;
          rewardPreviewEl.textContent=rewardFor(broken,false);
          ball.dy*=-1;
          return true;
        }
      }
      return false;
    }

    function loop(){
      if(!running) return;

      ball.x+=ball.dx;
      ball.y+=ball.dy;

      if(ball.x-ball.r<=0 || ball.x+ball.r>=canvas.width) ball.dx*=-1;
      if(ball.y-ball.r<=0) ball.dy=Math.abs(ball.dy);

      if(
        ball.dy>0 &&
        ball.y+ball.r>=paddle.y &&
        ball.y-ball.r<=paddle.y+paddle.h &&
        ball.x>=paddle.x &&
        ball.x<=paddle.x+paddle.w
      ){
        const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
        ball.dx=4.2*hit;
        ball.dy=-Math.abs(ball.dy);
        ball.y=paddle.y-ball.r-1;
      }

      collideBrick();

      if(broken===35){
        finishGame(true);
        return;
      }

      if(ball.y-ball.r>canvas.height){
        finishGame(false);
        return;
      }

      draw();
      animation=requestAnimationFrame(loop);
    }

    function finishGame(cleared){
      if(!running) return;
      running=false;
      cancelAnimationFrame(animation);
      animation=null;

      const earned=rewardFor(broken,cleared);
      Arcade.earn(earned,'Brick Breaker');
      Arcade.feedback(cleared?'success':'fail');
      const result=Arcade.recordResult('brickBreaker', broken);

      const best=Math.max(broken,Arcade.number('brickBreakerBest'));
      localStorage.setItem('brickBreakerBest',String(best));

      starting=false;
      refreshChrome();
      setStatus(cleared?'Level Clear!':'Game Over','over');
      startButton.disabled=false;
      startButton.textContent='👆 Tap Game to Play Again';

      Arcade.gameResult({
        icon:cleared?'🏆':'💥',
        title:cleared?'Level Clear!':'Brick Run Over',
        scoreLabel:'Bricks Broken',
        score:broken + '/35',
        best:best + '/35',
        coins:earned,
        result,
        playsLeft:Arcade.remaining('brickBreaker'),
        game:'brickBreaker',
        extra:[cleared?'🏆 Every brick cleared!':'Keep the ball alive and finish the wall.'],
        onReplay:startGame,
        onMorePlays:()=>Arcade.out('brickBreaker',refreshChrome)
      });
    }

    function setPaddleFromClientX(clientX){
      const rect=canvas.getBoundingClientRect();
      const scale=canvas.width/rect.width;
      const x=(clientX-rect.left)*scale-paddle.w/2;
      paddle.x=Math.max(0,Math.min(canvas.width-paddle.w,x));
    }

    let dragging = false;
    let dragPointer = null;

    canvas.addEventListener('pointerdown',event=>{
      event.preventDefault();

      if(!running){
        if(!starting) startGame();
        return;
      }

      dragging = true;
      dragPointer = event.pointerId;
      setPaddleFromClientX(event.clientX);
      canvas.setPointerCapture?.(event.pointerId);
    });

    canvas.addEventListener('pointermove',event=>{
      if(!dragging || dragPointer !== event.pointerId) return;
      event.preventDefault();
      setPaddleFromClientX(event.clientX);
    });

    const stopDragging = event => {
      if(event && dragPointer !== event.pointerId) return;
      dragging = false;
      dragPointer = null;
    };

    canvas.addEventListener('pointerup',stopDragging);
    canvas.addEventListener('pointercancel',stopDragging);
    canvas.addEventListener('contextmenu',event=>event.preventDefault());

    document.addEventListener('keydown',event=>{
      if(!running) return;
      if(event.key==='ArrowLeft'){event.preventDefault();paddle.x=Math.max(0,paddle.x-24);}
      if(event.key==='ArrowRight'){event.preventDefault();paddle.x=Math.min(canvas.width-paddle.w,paddle.x+24);}
    });

    function startGame(){
      if(running || starting) return;
      starting=true;
      if(!Arcade.consume('brickBreaker')){
        starting=false;
        Arcade.out('brickBreaker',refreshChrome);
        return;
      }

      resetBricks();
      broken=0;
      bricksEl.textContent='0';
      rewardPreviewEl.textContent='0';
      paddle.x=(canvas.width-paddle.w)/2;
      ball.x=canvas.width/2;
      ball.y=430;
      ball.dx=3.2*(Math.random()>.5?1:-1);
      ball.dy=-3.6;

      running=false;
      startButton.disabled=true;
      startButton.textContent='Get Ready…';
      setStatus('Get Ready');
      refreshChrome();
      draw();

      Arcade.countdown(()=>{
        starting=false;
        running=true;
        startButton.textContent='Game Running';
        setStatus('Running','running');
        animation=requestAnimationFrame(loop);
      });
    }

    startButton.addEventListener('click',startGame);
    resetBricks();
    refreshChrome();
    draw();
  </script>
</body>
</html>
