<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Earnly Tap Rush</title>
  <link rel="stylesheet" href="arcade.css">
  <style>
    .tap-board{
      position:relative;
      width:min(88vw,380px);
      aspect-ratio:4/5;
      margin:14px auto;
      border:2px solid #64748b;
      border-radius:20px;
      overflow:hidden;
      background:
        radial-gradient(circle at 30% 20%,rgba(59,130,246,.15),transparent 28%),
        #182334;
      touch-action:manipulation;
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;
    }
    .target{
      position:absolute;
      width:64px;
      height:64px;
      border-radius:50%;
      border:4px solid rgba(255,255,255,.9);
      background:linear-gradient(135deg,#22c55e,#16a34a);
      box-shadow:0 8px 20px rgba(34,197,94,.35);
      transform:translate(-50%,-50%);
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;
      touch-action:manipulation;
    }
    .target:active{transform:translate(-50%,-50%) scale(.92)}
    .tap-help{margin-top:8px}
  </style>
</head>
<body>
  <main class="container">
    <div class="topbar">
      <a class="brand" href="games.html">← Games</a>
      <a class="balance-chip" href="rewards.html">🪙 <span id="balance">0</span></a>
    </div>

    <header class="page-header">
      <h1>🎯 Tap Rush</h1>
      <div class="game-meta">
        <span class="meta-pill">Hits: <span id="hits">0</span></span>
        <span class="meta-pill">Time: <span id="time">20</span>s</span>
        <span class="meta-pill">Reward: <span id="rewardPreview">0</span> 🪙</span>
        <span class="meta-pill"><span id="plays">0</span> plays left</span>
      </div>
      <span class="game-status" id="gameStatus">Ready</span>
    </header>

    <button class="green wide" id="startButton" type="button">▶ Start Game</button>

    <div class="tap-board touch-surface" id="board" aria-label="Tap Rush game area">
      <button class="target touch-surface" id="target" type="button" aria-label="Tap target" hidden></button>
    </div>

    <p class="muted tap-help">Tap the green target as fast as you can — the whole game is optimized for quick iPhone taps.</p>
    <p class="muted small">Earn 1 coin every 5 hits, plus milestone bonuses at 20, 35, and 50 hits. Max 20 coins per run.</p>

    <a class="button wide secondary" href="games.html">← Back to Games</a>
  </main>

  <script src="arcade.js"></script>
  <script>
    const board = document.getElementById('board');
    const target = document.getElementById('target');
    const hitsEl = document.getElementById('hits');
    const timeEl = document.getElementById('time');
    const rewardPreviewEl = document.getElementById('rewardPreview');
    const playsEl = document.getElementById('plays');
    const balanceEl = document.getElementById('balance');
    const statusEl = document.getElementById('gameStatus');
    const startButton = document.getElementById('startButton');

    const ROUND_SECONDS = 20;
    const MAX_COINS = 20;

    let hits = 0;
    let timeLeft = ROUND_SECONDS;
    let timer = null;
    let running = false;

    function rewardForHits(value) {
      let coins = Math.floor(value / 5);
      if (value >= 20) coins += 2;
      if (value >= 35) coins += 3;
      if (value >= 50) coins += 5;
      return Math.min(coins, MAX_COINS);
    }

    function refreshChrome() {
      playsEl.textContent = Arcade.remaining('tapRush');
      balanceEl.textContent = Arcade.number('points').toLocaleString();
      rewardPreviewEl.textContent = rewardForHits(hits);
    }

    function setStatus(text, mode) {
      statusEl.textContent = text;
      statusEl.className = 'game-status' + (mode ? ' ' + mode : '');
    }

    function moveTarget() {
      const rect = board.getBoundingClientRect();
      const radius = 38;
      const x = radius + Math.random() * Math.max(1, rect.width - radius * 2);
      const y = radius + Math.random() * Math.max(1, rect.height - radius * 2);
      target.style.left = x + 'px';
      target.style.top = y + 'px';
    }

    function finishGame() {
      if (!running) return;
      running = false;
      clearInterval(timer);
      timer = null;
      target.hidden = true;

      const earned = rewardForHits(hits);
      Arcade.earn(earned, 'Tap Rush');
      Arcade.feedback('success');
      const result = Arcade.recordResult('tapRush', hits);

      const best = Math.max(hits, Arcade.number('tapRushBest'));
      localStorage.setItem('tapRushBest', String(best));

      refreshChrome();
      startButton.disabled = false;
      startButton.textContent = '▶ Play Again';
      setStatus('Game Over', 'over');

      Arcade.panel(
        '🎯 Time!',
        'Hits: ' + hits +
        '\nBest: ' + best +
        '\n+' + earned + ' Arcade Coins' +
        Arcade.resultText(result) +
        '\n' + Arcade.remaining('tapRush') + ' Tap Rush plays remaining',
        Arcade.remaining('tapRush') > 0
          ? [['Play Again', startGame, 'green'], ['Back to Games', () => location.href = 'games.html', 'secondary']]
          : [['Get More Plays', () => Arcade.out('tapRush', refreshChrome), 'green'], ['Back to Games', () => location.href = 'games.html', 'secondary']]
      );
    }

    function startGame() {
      if (running) return;

      if (!Arcade.consume('tapRush')) {
        Arcade.out('tapRush', refreshChrome);
        return;
      }

      hits = 0;
      timeLeft = ROUND_SECONDS;
      hitsEl.textContent = '0';
      timeEl.textContent = String(timeLeft);
      rewardPreviewEl.textContent = '0';
      running = false;

      refreshChrome();
      setStatus('Get Ready');
      startButton.disabled = true;
      startButton.textContent = 'Get Ready…';
      target.hidden = true;

      Arcade.countdown(() => {
        running = true;
        setStatus('Running', 'running');
        startButton.textContent = 'Game Running';
        target.hidden = false;
        moveTarget();

        timer = setInterval(() => {
          timeLeft -= 1;
          timeEl.textContent = String(timeLeft);
          if (timeLeft <= 0) finishGame();
        }, 1000);
      });
    }

    target.addEventListener('pointerdown', event => {
      event.preventDefault();
      if (!running) return;

      hits += 1;
      Arcade.feedback('tap');
      hitsEl.textContent = String(hits);
      rewardPreviewEl.textContent = rewardForHits(hits);

      if (hits === 20) Arcade.toast('🎯 20 hits! +2 milestone bonus');
      if (hits === 35) Arcade.toast('🔥 35 hits! +3 milestone bonus');
      if (hits === 50) Arcade.toast('🏆 50 hits! +5 milestone bonus');

      moveTarget();
    });

    target.addEventListener('contextmenu', event => event.preventDefault());
    startButton.addEventListener('click', startGame);

    refreshChrome();
  </script>
</body>
</html>
