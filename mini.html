<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Earnly">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="earnly-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="earnly-icon.svg">
  <title>Earnly Arcade</title>
  <link rel="stylesheet" href="arcade.css">
  <style>
    .mini-surface{width:min(92vw,390px);min-height:390px;margin:10px auto;border:1px solid #475569;border-radius:20px;background:#111c2d;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;position:relative}
    .mini-grid{display:grid;gap:5px;padding:14px}.mini-cell{aspect-ratio:1;border:1px solid #334155;border-radius:7px;background:#162235;display:grid;place-items:center;font-weight:900;min-width:0}
    .mini-cell.filled{background:#3b82f6;border-color:#60a5fa}.mini-cell.target{box-shadow:inset 0 0 0 2px #22c55e}
    .piece-tray{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 12px 12px}.piece-button{margin:0;padding:9px 12px;min-width:72px}
    .merge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:14px}.merge-tile{aspect-ratio:1;border-radius:12px;background:#1f2937;display:grid;place-items:center;font-size:22px;font-weight:900;border:1px solid #374151}
    .fit-wrap{padding:18px}.fit-shape{display:grid;grid-template-columns:repeat(4,50px);grid-template-rows:repeat(4,50px);gap:5px;justify-content:center;margin:18px auto}.fit-dot{border-radius:9px;background:#172033;border:1px solid #334155}.fit-dot.on{background:#22c55e;border-color:#4ade80}
    .fit-answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fit-answer{margin:0;min-height:48px}
    .traffic-grid{position:relative;width:330px;height:330px;max-width:100%;margin:18px auto;background:linear-gradient(#172033 1px,transparent 1px),linear-gradient(90deg,#172033 1px,transparent 1px);background-size:55px 55px;border:1px solid #475569;border-radius:16px;overflow:hidden}
    .traffic-car{position:absolute;border-radius:10px;border:2px solid rgba(255,255,255,.35);display:grid;place-items:center;font-size:22px;transition:transform .16s ease}
    .mini-help{color:#94a3b8;font-size:11px;margin:8px 16px 14px;text-align:center}
    .mini-canvas{display:block;width:100%;height:auto;touch-action:none}
  </style>
</head>
<body>
  <main class="container">
    <div class="topbar">
      <a class="brand" href="games.html">← Games</a>
      <a class="balance-chip" href="rewards.html">🪙 <span id="balance">0</span></a>
    </div>
    <header class="page-header">
      <h1><span id="gameIcon">🎮</span> <span id="gameTitle">Arcade Game</span></h1>
      <div class="game-meta">
        <span class="meta-pill"><span id="scoreLabel">Score</span>: <span id="score">0</span></span>
        <span class="meta-pill"><span id="secondaryLabel">Level</span>: <span id="secondary">1</span></span>
        <span class="meta-pill">Reward: <span id="rewardPreview">0</span> 🪙</span>
        <span class="meta-pill"><span id="plays">0</span> plays left</span>
      </div>
      <span class="game-status" id="gameStatus">Ready</span>
    </header>
    <button class="green wide" id="startButton" type="button">👆 Tap Game to Start</button>
    <div class="mini-surface touch-surface" id="surface"></div>
    <div class="mini-help" id="miniHelp"></div>
    <a class="button wide secondary" href="games.html">← Back to Games</a>
  </main>
  <script src="arcade.js"></script>
  <script src="mini-games.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cloud.js"></script>
</body>
</html>
