<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Earnly">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="earnly-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="earnly-icon.svg">
  <title>Earnly Arcade</title>
  <link rel="stylesheet" href="arcade.css">
  <style>
    .mini-surface{width:min(92vw,390px);min-height:390px;margin:10px auto;border:1px solid #475569;border-radius:20px;background:#111c2d;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;position:relative}
    .mini-grid{display:grid;gap:5px;padding:12px}.mini-cell{aspect-ratio:1;border:1px solid #334155;border-radius:7px;background:#162235;display:grid;place-items:center;font-weight:900;min-width:0}
    .mini-cell.filled{background:#3b82f6;border-color:#60a5fa}.mini-cell.target{box-shadow:inset 0 0 0 2px #22c55e}
    .piece-tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:2px 12px 12px}
    .piece-button{margin:0;min-width:0;min-height:74px;padding:8px 6px;display:grid;place-items:center;align-content:center;gap:5px;border:1px solid #475569;border-radius:14px;background:#263244;color:#d7e2f1}
    .piece-button.selected{border-color:#22c55e;background:#123a28;box-shadow:0 0 0 2px rgba(34,197,94,.18)}
    .piece-button small{font-size:7px;letter-spacing:.08em;color:#94a3b8;font-weight:900}
    .piece-button.selected small{color:#86efac}
    .piece-preview{display:grid;grid-template-columns:repeat(4,10px);grid-template-rows:repeat(4,10px);gap:2px;place-content:center}
    .piece-preview-cell{width:10px;height:10px;border-radius:3px;background:transparent}
    .piece-preview-cell.on{background:#60a5fa;box-shadow:inset 0 0 0 1px #93c5fd}
    .piece-button.selected .piece-preview-cell.on{background:#4ade80;box-shadow:inset 0 0 0 1px #86efac}
    .merge-wrap{padding:10px 10px 14px}
    .merge-rules{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
    .merge-rules span{padding:7px 8px;border:1px solid #334155;border-radius:10px;background:#0e1726;color:#b8c6d8;font-size:8px;font-weight:800;line-height:1.25;text-align:left}
    .merge-rules strong{color:#86efac}
    .merge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:4px}
    .merge-tile{aspect-ratio:1;border-radius:12px;background:#1f2937;display:grid;place-items:center;font-size:22px;font-weight:900;border:1px solid #374151}
    .merge-goal{display:grid;gap:2px;margin:9px 4px 0;padding:8px 10px;border:1px solid #334155;border-radius:11px;background:#0e1726;text-align:center}
    .merge-goal strong{color:#93c5fd;font-size:10px}
    .merge-goal span{color:#7f8ea3;font-size:8px}
    .merge-goal.goal-hit{border-color:#15803d;background:#0d2a1d}
    .merge-goal.goal-hit strong{color:#86efac}
    .fit-wrap{padding:16px}
    .fit-title{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 11px;border:1px solid #334155;border-radius:12px;background:#0e1726}
    .fit-title strong{font-size:11px;color:#dbeafe}.fit-title span{font-size:9px;color:#94a3b8;white-space:nowrap}
    .fit-shape{display:grid;grid-template-columns:repeat(4,42px);grid-template-rows:repeat(4,42px);gap:5px;justify-content:center;margin:14px auto}
    .fit-dot{border-radius:9px;background:#172033;border:1px solid #334155}.fit-dot.on{background:#22c55e;border-color:#4ade80;box-shadow:0 0 10px rgba(34,197,94,.2)}
    .fit-hint{min-height:22px;margin:0 0 8px;text-align:center;font-size:10px;font-weight:800;color:#93c5fd}
    .fit-answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .fit-answer{margin:0;min-height:92px;padding:9px;display:grid;place-items:center;align-content:center;gap:5px;border:1px solid #475569;background:#1a2638;color:#dbeafe}
    .fit-answer-preview{display:grid;grid-template-columns:repeat(4,12px);grid-template-rows:repeat(4,12px);gap:2px}
    .fit-preview-dot{width:12px;height:12px;border-radius:3px;background:transparent}
    .fit-preview-dot.on{background:#60a5fa;box-shadow:inset 0 0 0 1px #93c5fd}
    .fit-answer small{font-size:8px;color:#94a3b8;font-weight:800}
    .fit-answer.correct{border-color:#22c55e;background:#123a28}.fit-answer.correct .fit-preview-dot.on{background:#4ade80}
    .fit-answer.wrong{border-color:#ef4444;background:#3a171c}
    .traffic-wrap{padding:10px 8px 14px}
    .traffic-guide{display:grid;gap:2px;margin:2px 4px 8px;padding:9px 11px;border:1px solid #334155;border-radius:12px;background:#0e1726}
    .traffic-guide strong{font-size:10px;color:#dbeafe}.traffic-guide span{font-size:8px;color:#94a3b8}
    .traffic-level-line{min-height:22px;text-align:center;font-size:9px;font-weight:800;color:#93c5fd}
    .traffic-grid{position:relative;width:330px;height:330px;max-width:100%;margin:6px auto;background:linear-gradient(#172033 1px,transparent 1px),linear-gradient(90deg,#172033 1px,transparent 1px);background-size:55px 55px;border:1px solid #475569;border-radius:16px;overflow:hidden}
    .traffic-car{position:absolute;margin:0;padding:0;border-radius:10px;border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;gap:2px;font-size:18px;transition:transform .2s ease,filter .16s ease}
    .traffic-emoji{font-size:18px}.traffic-arrow{font-size:17px;font-weight:900;color:#fff}
    .traffic-car.escaping{filter:brightness(1.25)}
    .traffic-car.blocked{animation:trafficShake .22s linear}
    @keyframes trafficShake{0%,100%{translate:0 0}25%{translate:-5px 0}75%{translate:5px 0}}
    .mini-help{color:#94a3b8;font-size:11px;margin:8px 16px 14px;text-align:center}
    .mini-canvas{display:block;width:100%;height:auto;touch-action:none}
  </style>
</head>
<body>
  <main class="container">
    <div class="topbar">
      <a class="brand" href="games.html">← Games</a>
      <a class="balance-chip" href="rewards.html">🪙 <span id="balance">0</span></a>
    </div>
    <header class="page-header">
      <h1><span id="gameIcon">🎮</span> <span id="gameTitle">Arcade Game</span></h1>
      <div class="game-meta">
        <span class="meta-pill"><span id="scoreLabel">Score</span>: <span id="score">0</span></span>
        <span class="meta-pill"><span id="secondaryLabel">Level</span>: <span id="secondary">1</span></span>
        <span class="meta-pill">Run Reward: <span id="rewardPreview">0</span> 🪙</span>
        <span class="meta-pill"><span id="plays">0</span> plays left</span>
      </div>
      <span class="game-status" id="gameStatus">Ready</span>
    </header>
    <button class="green wide" id="startButton" type="button">👆 Tap Game to Start</button>
    <div class="mini-surface touch-surface" id="surface"></div>
    <div class="mini-help" id="miniHelp"></div>
    <a class="button wide secondary" href="games.html">← Back to Games</a>
  </main>
  <script src="arcade.js"></script>
  <script src="mini-games.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cloud.js"></script>
</body>
</html>
