<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Earnly">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="earnly-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="earnly-icon.svg">
  <title>Earnly Arcade</title>
  <link rel="stylesheet" href="arcade.css">
  <style>
    .mini-surface{width:min(92vw,390px);min-height:390px;margin:10px auto;border:1px solid #475569;border-radius:20px;background:#111c2d;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;position:relative}
    .mini-grid{display:grid;gap:5px;padding:12px}.mini-cell{aspect-ratio:1;border:1px solid #334155;border-radius:7px;background:#162235;display:grid;place-items:center;font-weight:900;min-width:0}
    .mini-cell.filled{background:#3b82f6;border-color:#60a5fa}.mini-cell.target{box-shadow:inset 0 0 0 2px #22c55e}
    .piece-tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:2px 12px 12px}
    .piece-button{margin:0;min-width:0;min-height:74px;padding:8px 6px;display:grid;place-items:center;align-content:center;gap:5px;border:1px solid #475569;border-radius:14px;background:#263244;color:#d7e2f1}
    .piece-button.selected{border-color:#22c55e;background:#123a28;box-shadow:0 0 0 2px rgba(34,197,94,.18)}
    .piece-button small{font-size:7px;letter-spacing:.08em;color:#94a3b8;font-weight:900}
    .piece-button.selected small{color:#86efac}
    .piece-preview{display:grid;grid-template-columns:repeat(4,10px);grid-template-rows:repeat(4,10px);gap:2px;place-content:center}
    .piece-preview-cell{width:10px;height:10px;border-radius:3px;background:transparent}
    .piece-preview-cell.on{background:#60a5fa;box-shadow:inset 0 0 0 1px #93c5fd}
    .piece-button.selected .piece-preview-cell.on{background:#4ade80;box-shadow:inset 0 0 0 1px #86efac}
    .merge-wrap{padding:10px 10px 14px}
    .merge-rules{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
    .merge-rules span{padding:7px 8px;border:1px solid #334155;border-radius:10px;background:#0e1726;color:#b8c6d8;font-size:8px;font-weight:800;line-height:1.25;text-align:left}
    .merge-rules strong{color:#86efac}
    .merge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:4px}
    .merge-tile{aspect-ratio:1;border-radius:12px;background:#1f2937;display:grid;place-items:center;font-size:22px;font-weight:900;border:1px solid #374151}
    .merge-goal{display:grid;gap:2px;margin:9px 4px 0;padding:8px 10px;border:1px solid #334155;border-radius:11px;background:#0e1726;text-align:center}
    .merge-goal strong{color:#93c5fd;font-size:10px}
    .merge-goal span{color:#7f8ea3;font-size:8px}
    .merge-goal.goal-hit{border-color:#15803d;background:#0d2a1d}
    .merge-goal.goal-hit strong{color:#86efac}
    .fit-wrap{padding:16px}
    .fit-title{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 11px;border:1px solid #334155;border-radius:12px;background:#0e1726}
    .fit-title strong{font-size:11px;color:#dbeafe}.fit-title span{font-size:9px;color:#94a3b8;white-space:nowrap}
    .fit-stage{display:grid;gap:2px}.fit-stage small{font-size:8px;color:#64748b;font-weight:800}
    .fit-clock{display:grid;gap:4px;min-width:86px;text-align:right}.fit-clock i{display:block;height:5px;border-radius:99px;background:#1e293b;overflow:hidden}.fit-clock b{display:block;height:100%;border-radius:inherit;background:#60a5fa;transition:width .1s linear}
    .fit-title.urgent{border-color:#b45309;background:#2b1b0c}.fit-title.urgent .fit-clock span{color:#fde68a}.fit-title.urgent .fit-clock b{background:#f59e0b}
    .fit-wrap.fit-success .fit-shape{filter:drop-shadow(0 0 9px rgba(34,197,94,.5));transform:scale(1.025)}
    .fit-wrap.fit-miss .fit-shape{animation:fitMiss .22s linear}
    @keyframes fitMiss{0%,100%{transform:translateX(0)}30%{transform:translateX(-7px)}70%{transform:translateX(7px)}}
    .fit-shape{display:grid;grid-template-columns:repeat(4,42px);grid-template-rows:repeat(4,42px);gap:5px;justify-content:center;margin:14px auto}
    .fit-dot{border-radius:9px;background:#172033;border:1px solid #334155}.fit-dot.on{background:#22c55e;border-color:#4ade80;box-shadow:0 0 10px rgba(34,197,94,.2)}
    .fit-hint{min-height:22px;margin:0 0 8px;text-align:center;font-size:10px;font-weight:800;color:#93c5fd}
    .fit-answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .fit-answer{margin:0;min-height:92px;padding:9px;display:grid;place-items:center;align-content:center;gap:5px;border:1px solid #475569;background:#1a2638;color:#dbeafe}
    .fit-answer-preview{display:grid;grid-template-columns:repeat(4,12px);grid-template-rows:repeat(4,12px);gap:2px}
    .fit-preview-dot{width:12px;height:12px;border-radius:3px;background:transparent}
    .fit-preview-dot.on{background:#60a5fa;box-shadow:inset 0 0 0 1px #93c5fd}
    .fit-answer small{font-size:8px;color:#94a3b8;font-weight:800}
    .fit-answer.correct{border-color:#22c55e;background:#123a28}.fit-answer.correct .fit-preview-dot.on{background:#4ade80}
    .fit-answer.wrong{border-color:#ef4444;background:#3a171c}
    /* Shape Fit: keep larger rounds usable on phones without forcing the
       player to hunt for a narrow page-scroll gutter beside the choices. */
    .fit-wrap.many-choices{padding-bottom:10px}
    .fit-wrap.many-choices .fit-shape{grid-template-columns:repeat(4,36px);grid-template-rows:repeat(4,36px);gap:4px;margin:9px auto}
    .fit-wrap.many-choices .fit-hint{margin-bottom:6px}
    .fit-wrap.many-choices .fit-answers{max-height:250px;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding:1px 3px 8px 1px;touch-action:pan-y}
    .fit-wrap.many-choices .fit-answer{min-height:78px;padding:7px}
    .fit-wrap.many-choices .fit-answer-preview{grid-template-columns:repeat(4,10px);grid-template-rows:repeat(4,10px)}
    .fit-wrap.many-choices .fit-preview-dot{width:10px;height:10px}
    .traffic-wrap{padding:10px 8px 14px}
    .traffic-guide{display:grid;gap:2px;margin:2px 4px 8px;padding:9px 11px;border:1px solid #334155;border-radius:12px;background:#0e1726}
    .traffic-guide strong{font-size:10px;color:#dbeafe}.traffic-guide span{font-size:8px;color:#94a3b8}
    .traffic-level-line{min-height:22px;text-align:center;font-size:9px;font-weight:800;color:#93c5fd}
    .traffic-level-line.urgent{color:#fca5a5;animation:trafficPulse .7s ease-in-out infinite alternate}
    @keyframes trafficPulse{from{opacity:.72}to{opacity:1}}
    .traffic-grid{position:relative;width:330px;height:330px;max-width:100%;margin:6px auto;background:linear-gradient(#172033 1px,transparent 1px),linear-gradient(90deg,#172033 1px,transparent 1px);background-size:55px 55px;border:1px solid #475569;border-radius:16px;overflow:hidden}
    .traffic-car{position:absolute;margin:0;padding:0;border-radius:10px;border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;gap:2px;font-size:18px;transition:transform .2s ease,filter .16s ease}
    .traffic-emoji{font-size:18px}.traffic-arrow{font-size:17px;font-weight:900;color:#fff}
    .traffic-car.escaping{filter:brightness(1.25)}
    .traffic-car.clear-path{box-shadow:0 0 0 1px rgba(134,239,172,.32),0 0 10px rgba(34,197,94,.12)}
    .traffic-car.clear-path:active{filter:brightness(1.18)}
    .traffic-car.blocked{animation:trafficShake .22s linear;box-shadow:0 0 0 2px rgba(248,113,113,.5)}
    @keyframes trafficShake{0%,100%{translate:0 0}25%{translate:-5px 0}75%{translate:5px 0}}
    .mini-help{color:#94a3b8;font-size:11px;margin:8px 16px 14px;text-align:center}
    .mini-canvas{display:block;width:100%;height:auto;touch-action:none}
    /* Mini games need the playfield on screen quickly, especially on phones. */
    @media(max-width:600px){
      .page-header{margin:7px 0 9px}
      .page-header h1{margin-bottom:5px;font-size:clamp(27px,8vw,34px)}
      .game-meta{gap:5px;margin:5px 0 6px}
      .meta-pill{padding:5px 8px;font-size:11px}
      .game-status{padding:5px 9px;font-size:11px}
      /* Keep every mini-game header compact so gameplay stays above the fold. */
      .topbar{margin-bottom:5px}
      .mini-surface{margin-top:6px}
      body.mini-traffic .topbar{margin-bottom:2px}
      body.mini-traffic .page-header{margin:2px 0 5px}
      body.mini-traffic .page-header h1{font-size:clamp(24px,7vw,30px);margin:0 0 3px}
      body.mini-traffic .game-meta{margin:3px 0 4px;gap:4px}
      body.mini-traffic .meta-pill{padding:4px 7px;font-size:10px}
      body.mini-traffic .game-status{padding:4px 8px;font-size:10px}
      body.mini-traffic .traffic-wrap{padding-top:6px}
      body.mini-traffic .traffic-guide{margin-bottom:5px;padding:7px 9px}
      body.mini-traffic .mini-help{margin-top:5px;margin-bottom:9px}
      body.mini-blockGrid .topbar{margin-bottom:2px}
      body.mini-blockGrid .page-header{margin:2px 0 4px}
      body.mini-blockGrid .page-header h1{font-size:clamp(23px,6.8vw,29px);margin:0 0 3px}
      body.mini-blockGrid .game-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:2px 0 4px}
      body.mini-blockGrid .meta-pill{padding:4px 2px;font-size:9px;text-align:center}
      body.mini-blockGrid.game-active .topbar,body.mini-blockGrid.game-active #startButton{display:none!important}
      body.mini-blockGrid.game-active .game-guide-strip,body.mini-blockGrid.game-active .game-guide-more,body.mini-blockGrid.game-active .game-guide-overlay,body.mini-blockGrid.game-active .game-overlay,body.mini-blockGrid.game-active .mini-help,body.mini-blockGrid.game-active a.button.secondary{display:none!important}
       body.mini-blockGrid.game-active .page-header{margin:0 0 2px}
      body.mini-blockGrid.game-active .page-header h1{font-size:19px!important}
      body.mini-blockGrid.game-active .page-header{display:grid;grid-template-columns:1fr;align-items:center;gap:2px}
      body.mini-blockGrid.game-active .page-header h1{grid-column:1;text-align:center}
      body.mini-blockGrid.game-active .game-meta{grid-column:1}
      body.mini-blockGrid.game-active .game-status{margin:2px auto 0!important}
      body.mini-blockGrid.game-active .pause-control{margin:0!important}
      body.mini-blockGrid.game-active main.container{padding-top:8px!important;padding-bottom:76px!important}
      body.mini-blockGrid.game-active .mini-surface{background:#0f1a2b;border-color:#334155;box-shadow:0 12px 28px rgba(0,0,0,.24)}
      body.mini-blockGrid.game-active .game-status{padding:2px 8px;font-size:9px;margin:0 auto}
      body.mini-blockGrid.game-active .pause-control{position:absolute!important;right:calc(50% - 92px);top:118px;margin:0!important;padding:5px 8px!important;min-height:28px!important;font-size:9px!important;width:auto!important;z-index:5}
      body.mini-blockGrid.game-active .mini-surface{margin:4px auto 0;width:min(94vw,400px);border-radius:16px}
      body.mini-blockGrid.game-active .mini-grid{gap:3px;padding:5px 8px}
      body.mini-blockGrid.game-active .block-grid-progress{display:grid!important;grid-template-columns:1fr 1fr;gap:5px;padding:4px 8px!important}
      body.mini-blockGrid.game-active .block-grid-progress>*{min-height:32px!important;padding:3px!important;border-radius:9px!important;background:transparent!important;border:0!important;box-shadow:none!important}
      body.mini-blockGrid.game-active .block-grid-progress>*+*{border-left:1px solid rgba(71,85,105,.55)!important}
      body.mini-blockGrid.game-active .block-grid-progress small{font-size:7px!important}
      body.mini-blockGrid.game-active .block-grid-progress strong{font-size:10px!important}
      body.mini-blockGrid.game-active .mini-surface{min-height:0!important}
      body.mini-blockGrid.game-active .mini-cell{aspect-ratio:1;max-height:48px}
      body.mini-blockGrid.game-active .mini-guide{display:none!important}
      body.mini-blockGrid.game-active .block-grid-progress{margin-top:2px!important}
      body.mini-blockGrid.game-active .piece-tray{position:sticky;bottom:0;background:#0f1a2b;z-index:3;border-top:1px solid rgba(71,85,105,.45);padding:5px 8px 6px!important}
      body.mini-blockGrid.game-active .piece-button{min-height:58px!important;padding:4px!important;background:#1a2638;border-color:#3b4b62}
      body.mini-blockGrid.game-active .piece-button.selected{background:#103c29;border-color:#22c55e;box-shadow:0 0 0 2px rgba(34,197,94,.2),0 0 18px rgba(34,197,94,.08)}
      body.mini-blockGrid.game-active .piece-button:not(.selected):active{transform:scale(.98)}
      body.mini-blockGrid.game-active .mini-cell.filled{box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
      body.mini-blockGrid.game-active .mini-cell{transition:background .12s ease,border-color .12s ease,transform .1s ease}
      body.mini-blockGrid.game-active .mini-cell.just-placed{animation:blockPop .18s ease-out}
      body.mini-blockGrid.game-active .mini-cell.clearing{animation:blockClear .34s ease-out}
      @keyframes blockPop{0%{transform:scale(.72);filter:brightness(1.5)}100%{transform:scale(1);filter:none}}
      @keyframes blockClear{0%{transform:scale(1);filter:brightness(1)}45%{transform:scale(1.08);filter:brightness(1.7)}100%{transform:scale(.82);opacity:.25}}
      body.mini-blockGrid.game-active .piece-tray{gap:7px;padding:2px 8px 8px}
      body.mini-blockGrid.game-active .piece-button{min-height:66px;border-radius:12px}
      body.mini-blockGrid.game-active .mini-cell{border-radius:6px}
    }
  
      @media(max-width:600px){
        body.mini-blockGrid.game-active .page-header{position:relative!important;transform:none!important;top:auto!important}
        body.mini-blockGrid.game-active .page-header h1,body.mini-blockGrid.game-active .game-meta{visibility:visible!important;opacity:1!important}
        body.mini-blockGrid.game-active .game-meta{display:grid!important}
      }

      /* Block Grid active HUD: keep everything below iPhone safe area */
      @media(max-width:600px){
        body.mini-blockGrid.game-active main.container{padding-top:max(10px,env(safe-area-inset-top))!important}
        body.mini-blockGrid.game-active .page-header{position:relative!important;top:auto!important;transform:none!important;margin:0 auto 4px!important;display:grid!important;grid-template-columns:1fr!important;gap:3px!important}
        body.mini-blockGrid.game-active .page-header h1{display:block!important;visibility:visible!important;opacity:1!important;font-size:20px!important;line-height:1.1!important;margin:0!important;text-align:center!important}
        body.mini-blockGrid.game-active .game-meta{display:grid!important;visibility:visible!important;opacity:1!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:4px!important;margin:2px 0!important}
        body.mini-blockGrid.game-active .meta-pill{min-height:27px!important;padding:3px 2px!important;font-size:8px!important}
        body.mini-blockGrid.game-active .game-status{margin:2px auto!important;padding:3px 8px!important;font-size:9px!important}
        body.mini-blockGrid.game-active .pause-control{position:relative!important;right:auto!important;top:auto!important;display:block!important;margin:-34px calc(50% - 104px) 5px auto!important;padding:5px 8px!important;min-height:28px!important;font-size:9px!important;width:max-content!important}
        body.mini-blockGrid.game-active .mini-surface{margin:5px auto 0!important}
      }
</style>
</head>
<body>
  <main class="container">
    <div class="topbar">
      <a class="brand" href="games.html">← Games</a>
      <a class="balance-chip" href="rewards.html">🪙 <span id="balance">0</span></a>
    </div>
    <header class="page-header">
      <h1><span id="gameIcon">🎮</span> <span id="gameTitle">Arcade Game</span></h1>
      <div class="game-meta" role="group" aria-label="Current game stats">
        <span class="meta-pill"><span id="scoreLabel">Score</span>: <span id="score">0</span></span>
        <span class="meta-pill"><span id="secondaryLabel">Level</span>: <span id="secondary">1</span></span>
        <span class="meta-pill">Run Reward: <span id="rewardPreview">0</span> 🪙</span>
        <span class="meta-pill"><span id="plays">0</span> plays left</span>
      </div>
      <span class="game-status" id="gameStatus" role="status" aria-live="polite">Ready</span>
    </header>
    <button class="green wide" id="startButton" type="button" aria-describedby="miniHelp">👆 Tap Game to Start</button>
    <div class="mini-surface touch-surface" id="surface" role="region" aria-label="Game play area"></div>
    <div class="mini-help" id="miniHelp" aria-live="polite"></div>
    <a class="button wide secondary" href="games.html">← Back to Games</a>
  </main>
  <script src="arcade.js"></script>
  <script src="mini-games.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cloud.js"></script>
</body>
</html>
