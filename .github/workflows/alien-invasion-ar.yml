name: Alien Invasion AR prototype
on:
  push:
    branches: [main]
    paths: ['native/AlienInvasionAR/**', 'native/AlienInvasionBridge.swift', 'native/alien-invasion-native.html', 'native-alien-ar-entry.js', 'scripts/*alien-ar*', 'scripts/build-native-web.mjs', 'scripts/configure-ios.mjs', 'alien-invasion-ar*', 'tests/alien-invasion-ar*', '.github/workflows/alien-invasion-ar.yml']
  pull_request:
    paths: ['native/AlienInvasionAR/**', 'native/AlienInvasionBridge.swift', 'native/alien-invasion-native.html', 'native-alien-ar-entry.js', 'scripts/*alien-ar*', 'scripts/build-native-web.mjs', 'scripts/configure-ios.mjs', 'alien-invasion-ar*', 'tests/alien-invasion-ar*', '.github/workflows/alien-invasion-ar.yml']
  workflow_dispatch:
concurrency:
  group: alien-ar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  camera-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: node --test tests/alien-invasion-ar-engine.cjs
      - run: node --test scripts/test-alien-ar-preview.mjs
      - name: Verify new public page keeps Earnly information links
        run: npx playwright test tests/page-polish.spec.js --project=desktop-chromium --grep 'every public page has working static information links'
      - run: npx playwright test tests/alien-invasion-ar.spec.js --project=desktop-chromium --project=mobile-webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alien-camera-demo-report
          path: test-results/
          retention-days: 7
  earnly-integrated-game:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      EARNLY_ALIEN_AR_PREVIEW: '1'
      EARNLY_ADMOB_TEST_MODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build small AR game inside existing Earnly app
        run: |
          npm run native:web
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          node scripts/configure-ios.mjs
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' ios/App/App/Info.plist)" = 'false'
          test -s ios/App/App/public/alien-ar-zap.wav
          grep -q 'alienARPreviewEntry' ios/App/App/public/index.html
      - name: Compile integrated game for physical iPhone SDK (unsigned)
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO build
  native-prototype:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test 3D simulation and offscreen persistence
        working-directory: native/AlienInvasionAR
        run: swift test
      - name: Generate isolated Xcode project
        run: python3 native/AlienInvasionAR/generate-project.py
      - name: Compile prototype for physical iPhone SDK (unsigned)
        run: >-
          xcodebuild -project native/AlienInvasionAR/AlienInvasionAR.xcodeproj
          -scheme AlienInvasionAR -configuration Debug -sdk iphoneos
          -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
          -derivedDataPath native/AlienInvasionAR/DerivedData build
      - name: Package source for Mac and device testing
        run: |
          cd native/AlienInvasionAR
          zip -r ../../Alien-Invasion-AR-Xcode.zip Sources Tests Package.swift generate-project.py audio_assets.py AlienInvasionAR.xcodeproj Info.plist *.wav README.md
      - uses: actions/upload-artifact@v4
        with:
          name: Alien-Invasion-AR-Xcode
          path: Alien-Invasion-AR-Xcode.zip
          retention-days: 14
