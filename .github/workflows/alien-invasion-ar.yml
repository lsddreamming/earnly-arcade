name: Alien Invasion AR prototype
on:
  pull_request:
    paths: ['native/AlienInvasionAR/**', 'alien-invasion-ar*', 'tests/alien-invasion-ar*', '.github/workflows/alien-invasion-ar.yml']
  workflow_dispatch:
jobs:
  camera-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: node --test tests/alien-invasion-ar-engine.cjs
      - run: npx playwright test tests/alien-invasion-ar.spec.js --project=desktop-chromium --project=mobile-webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alien-camera-demo-report
          path: test-results/
          retention-days: 7
  native-prototype:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test 3D simulation and offscreen persistence
        working-directory: native/AlienInvasionAR
        run: swift test
      - name: Generate isolated Xcode project
        run: python3 native/AlienInvasionAR/generate-project.py
      - name: Compile prototype for physical iPhone SDK (unsigned)
        run: >-
          xcodebuild -project native/AlienInvasionAR/AlienInvasionAR.xcodeproj
          -scheme AlienInvasionAR -configuration Debug -sdk iphoneos
          -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
          -derivedDataPath native/AlienInvasionAR/DerivedData build
      - name: Package source for Mac and device testing
        run: |
          cd native/AlienInvasionAR
          zip -r ../../Alien-Invasion-AR-Xcode.zip Sources Tests Package.swift generate-project.py AlienInvasionAR.xcodeproj Info.plist zap.wav README.md
      - uses: actions/upload-artifact@v4
        with:
          name: Alien-Invasion-AR-Xcode
          path: Alien-Invasion-AR-Xcode.zip
          retention-days: 14
