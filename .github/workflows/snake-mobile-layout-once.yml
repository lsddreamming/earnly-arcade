name: Snake mobile layout validation
on:
  push:
    branches: [fix/snake-compact-controls-20260926]
    paths: [.github/workflows/snake-mobile-layout-once.yml]
permissions:
  contents: write
concurrency:
  group: snake-mobile-layout-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/snake-compact-controls-20260926
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Snake patch and deterministic UI fixture assertions
        shell: python
        run: |
          from pathlib import Path
          import subprocess, textwrap
          source = subprocess.check_output(['git','show','0d32e32b8a8ed7fdd0e66b05b39c1fc10eda3483:.github/workflows/snake-mobile-layout-once.yml'], text=True)
          patch = source.split('\n        run: |\n',1)[1].split('\n      - name: Install dependencies',1)[0]
          exec(compile(textwrap.dedent(patch), '<snake-complete-patch>', 'exec'))
          p = Path('tests/snake-mobile.cases.js')
          t = p.read_text()
          old = "    await press(pause,info); await expect(page.locator('#gameStatus')).toHaveText('Running');\n    const before=await page.evaluate(()=>({points:Arcade.number('points'),runs:Arcade.number('gameRuns_snake')}));\n    await press(quit,info); await expect(page).toHaveURL(/games\\.html/);"
          new = """    // Reset only this test fixture before resuming; inspection may pause near a wall.
              // Actual production speed, timers, input dispatch and handlers remain unchanged.
              const before=await page.evaluate(()=>{
                snake=[{x:0,y:200}]; direction=nextDirection='RIGHT';
                return {points:Arcade.number('points'),runs:Arcade.number('gameRuns_snake')};
              });
              await press(pause,info); await expect(page.locator('#gameStatus')).toHaveText('Running');
              await press(quit,info); await expect(page).toHaveURL(/games\\.html/);
              await page.waitForFunction(()=>!!window.Arcade);"""
          assert old in t, 'Resume/navigation test block missing'
          p.write_text(t.replace(old,new,1))
          print('UI fixtures avoid unrelated wall death and wait for destination scripts to load.')
      - name: Install dependencies
        run: npm install > /tmp/snake-npm.log 2>&1 || { tail -100 /tmp/snake-npm.log; exit 1; }
      - name: Install both browser engines
        run: npx playwright install --with-deps chromium webkit > /tmp/snake-browsers.log 2>&1 || { tail -100 /tmp/snake-browsers.log; exit 1; }
      - name: Validate Snake and shared entry regressions without retries
        run: |
          set +e
          npx playwright test tests/smoke.spec.js --project=desktop-chromium --project=mobile-webkit --grep 'Snake|game start screen explains|compact entry:' --retries=0 > /tmp/snake-tests.log 2>&1
          result=$?
          grep -v '\[WebServer\]' /tmp/snake-tests.log
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snake-mobile-layout-evidence
          path: |
            test-results
            playwright-report
      - name: Commit only validated changes to the isolated branch
        run: |
          test "$GITHUB_REF_NAME" = "fix/snake-compact-controls-20260926"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snake.html www/snake.html snake-ui.css www/snake-ui.css tests/snake-mobile.cases.js tests/smoke.spec.js service-worker.js
          git rm .github/workflows/snake-mobile-layout-once.yml
          git commit -m "Declutter Snake and keep Pause and Quit reachable on iPhone"
          git push origin HEAD:fix/snake-compact-controls-20260926
