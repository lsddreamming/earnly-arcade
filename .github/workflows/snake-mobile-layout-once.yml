name: Snake mobile layout validation
on:
  push:
    branches: [fix/snake-compact-controls-20260926]
    paths: [.github/workflows/snake-mobile-layout-once.yml]
permissions:
  contents: write
concurrency:
  group: snake-mobile-layout-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/snake-compact-controls-20260926
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply isolated Snake UI patch
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('snake.html')
          s = p.read_text()
          original = s
          def replace_once(old, new):
              global s
              assert s.count(old) == 1, 'Snake patch target missing or ambiguous: ' + old[:100]
              s = s.replace(old, new, 1)
          replace_once('  <link rel="stylesheet" href="premium.css?v=14">', '  <link rel="stylesheet" href="premium.css?v=14">\n  <link rel="stylesheet" href="snake-ui.css?v=1">')
          replace_once('<div class="topbar">', '<div class="topbar snake-toolbar" aria-label="Snake navigation and pause">')
          replace_once('<a class="brand" href="games.html">← Games</a>', '<a id="snakeExit" class="brand snake-exit" href="games.html">← Games</a>')
          replace_once('<button class="green wide" id="startButton" type="button">👆 Tap the Game to Start</button>', '<button class="green wide" id="startButton" type="button">▶ Start Snake</button>\n    <p class="snake-quick-tip">Swipe anywhere to steer · Eat apples, avoid walls</p>')
          replace_once('<a class="button wide secondary" href="games.html">← Back to Games</a>', '<a class="button wide secondary snake-back-link" href="games.html">← Back to Games</a>')
          replace_once('let starting = false;', 'let starting = false;\n    let snakeRunGeneration = 0;')
          replace_once("      rewardPreviewEl.textContent = snakeReward(score);\n    }", "      rewardPreviewEl.textContent = snakeReward(score);\n      if (game === null && !starting) {\n        startButton.textContent = Arcade.remaining('snake') > 0 ? '▶ Start Snake' : '🎟 Get More Plays';\n      }\n    }")
          replace_once("      statusEl.className = 'game-status' + (mode ? ' ' + mode : '');", "      statusEl.className = 'game-status' + (mode ? ' ' + mode : '');\n      document.getElementById('snakeExit').textContent = /running|ready…|get ready|paused/i.test(text) ? '× Quit' : '← Games';")
          replace_once("startButton.textContent = '👆 Tap Game to Play Again · or press Enter';", "startButton.textContent = Arcade.remaining('snake') > 0 ? '▶ Play Again' : '🎟 Get More Plays';")
          replace_once('      if (game !== null || starting) return;\n      starting = true;', '      if (game !== null || starting) return;\n      const runGeneration = ++snakeRunGeneration;\n      starting = true;')
          replace_once("      setStatus('Get Ready');\n      enableFullScreenSteering();", "      window.scrollTo(0, 0);\n      setStatus('Get Ready');\n      enableFullScreenSteering();")
          replace_once('      Arcade.countdown(() => {\n        starting = false;', '      Arcade.countdown(() => {\n        if (runGeneration !== snakeRunGeneration || !starting) return;\n        starting = false;')
          replace_once('    Arcade.installPauseControl({', '    const snakePauseControl = Arcade.installPauseControl({')
          replace_once("    startButton.addEventListener('click', startGame);", """    // Keep the existing shared Pause/Resume control above the full-screen steering layer.
              const snakeToolbar = document.querySelector('.snake-toolbar');
              if (snakePauseControl) snakeToolbar.append(snakePauseControl.button);

              // Quit abandons the run just like the old Games link; it does not grant rewards.
              function stopSnakeRun() {
                snakeRunGeneration += 1;
                clearInterval(game);
                game = null;
                starting = false;
                pauseStartedAt = 0;
                disableFullScreenSteering();
                startButton.disabled = false;
                setStatus('Ready');
                snakePauseControl?.sync();
                Arcade.setGameplayScrollLock(false);
                refreshChrome();
              }
              document.getElementById('snakeExit').addEventListener('click', stopSnakeRun);
              window.addEventListener('pagehide', stopSnakeRun);

              // Fit a square board to the actual visible iPhone viewport, not a guessed header height.
              let snakeFitFrame = 0;
              function fitSnakeBoard() {
                cancelAnimationFrame(snakeFitFrame);
                snakeFitFrame = requestAnimationFrame(() => {
                  if (!matchMedia('(max-width:699px)').matches) {
                    document.body.style.removeProperty('--snake-board-size');
                    return;
                  }
                  const wrapper = snakeGuide?.wrapper;
                  if (!wrapper) return;
                  const active = document.body.classList.contains('snake-game-active');
                  const viewportHeight = window.visualViewport?.height || innerHeight;
                  const nav = document.getElementById('arcadeBottomNav');
                  const navTop = nav && getComputedStyle(nav).display !== 'none'
                    ? nav.getBoundingClientRect().top : viewportHeight;
                  const bottom = Math.min(viewportHeight, navTop);
                  const top = wrapper.getBoundingClientRect().top;
                  const available = bottom - top - (active ? 16 : 52);
                  const side = Math.max(160, Math.floor(Math.min(innerWidth - 28, 440, available)));
                  document.body.style.setProperty('--snake-board-size', side + 'px');
                });
              }
              new MutationObserver(fitSnakeBoard).observe(statusEl, {childList:true,subtree:true,attributes:true});
              const snakeLayoutObserver = new ResizeObserver(fitSnakeBoard);
              for (const element of [snakeToolbar, document.querySelector('.snake-header'), document.getElementById('earnlyCompactLeaderboard'), document.getElementById('arcadeBottomNav')]) {
                if (element) snakeLayoutObserver.observe(element);
              }
              window.addEventListener('resize', fitSnakeBoard);
              window.visualViewport?.addEventListener('resize', fitSnakeBoard);
              window.addEventListener('pageshow', fitSnakeBoard);
              fitSnakeBoard();
              startButton.addEventListener('click', startGame);""")
          # Confirm no physics, collision, reward curve, score recording, or drawing changes.
          for name in ['snakeReward','setDirection','randomFood','drawSnakeBody','drawSnakeHead','drawApple','draw']:
              pattern = r'    function ' + name + r'\([^)]*\) \{.*?\n    \}'
              before = re.search(pattern, original, re.S)
              after = re.search(pattern, s, re.S)
              assert before and after and before.group() == after.group(), 'Gameplay changed: ' + name
          p.write_text(s)
          Path('www/snake.html').write_text(s)
          css = '''/* Snake v1.1: one compact entry, an unobstructed board, and real session controls. */
          body.snake-page .snake-toolbar { position:relative; z-index:60; }
          body.snake-page #snakeControlLayer { z-index:40 !important; }
          body.snake-page .snake-toolbar #earnlyPauseButton { position:relative !important; inset:auto !important; margin:0 !important; z-index:61 !important; min-height:44px; min-width:90px; }
          body.snake-page .snake-toolbar #earnlyPauseButton[hidden] { display:none !important; }
          body.snake-page #snakeExit { display:inline-flex; align-items:center; justify-content:center; min-height:44px; min-width:82px; padding:8px 12px; border-radius:12px; touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
          body.snake-page.snake-game-active .snake-toolbar .balance-chip { display:none !important; }
          body.snake-page.snake-game-active #snakeExit { color:#ffdbdf; background:#371721; border:1px solid #ab4d60; }
          body.snake-page .snake-quick-tip { display:none; }
          @media (max-width:699px) {
            body.snake-page.game-guide-page main.container { padding:8px 14px 100px !important; padding-top:max(8px,env(safe-area-inset-top)) !important; }
            body.snake-page.game-guide-page.snake-game-active main.container { padding-bottom:max(16px,env(safe-area-inset-bottom)) !important; }
            body.snake-page.game-guide-page .snake-toolbar { display:flex !important; align-items:center !important; justify-content:space-between !important; position:sticky !important; top:env(safe-area-inset-top,0px); min-height:44px !important; gap:8px !important; margin:0 0 4px !important; padding:0 !important; background:#071621 !important; }
            body.snake-page.game-guide-page .snake-toolbar .balance-chip { font-size:13px; padding:6px 10px; }
            body.snake-page.game-guide-page .snake-toolbar #earnlyPauseButton { font-size:14px !important; padding:9px 13px !important; border-radius:12px !important; touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
            body.snake-page.game-guide-page .snake-header { display:block !important; padding:4px 0 !important; margin:0 0 4px !important; background:none !important; border:0 !important; border-radius:0 !important; box-shadow:none !important; }
            body.snake-page.game-guide-page .game-title-status-row { display:flex !important; align-items:center !important; justify-content:center !important; gap:8px !important; margin:0 0 6px !important; }
            body.snake-page.game-guide-page .snake-header h1 { font-size:22px !important; line-height:1.15 !important; margin:0 !important; }
            body.snake-page.game-guide-page #gameStatus { padding:4px 8px !important; font-size:11px !important; }
            body.snake-page.game-guide-page .snake-stats { display:grid !important; grid-template-columns:repeat(3,minmax(0,1fr)) !important; gap:0 !important; margin:0 !important; border:1px solid #284757; border-radius:11px; overflow:hidden; background:#0a1c29; }
            body.snake-page.game-guide-page .snake-stats > span { display:flex !important; align-items:center !important; justify-content:center !important; gap:6px !important; padding:6px 3px !important; min-height:32px !important; min-width:0 !important; border:0 !important; border-right:1px solid #284757 !important; border-radius:0 !important; background:none !important; box-shadow:none !important; }
            body.snake-page.game-guide-page .snake-stats > span:last-child { border-right:0 !important; }
            body.snake-page.game-guide-page .snake-stats small { font-size:11px !important; line-height:1.2 !important; letter-spacing:0 !important; text-transform:none !important; color:#b9cedd !important; margin:0 !important; }
            body.snake-page.game-guide-page .snake-stats strong { font-size:15px !important; line-height:1.2 !important; margin:0 !important; }
            body.snake-page.game-guide-page .game-start-summary,
            body.snake-page.game-guide-page .game-guide-strip,
            body.snake-page.game-guide-page .game-guide-overlay,
            body.snake-page.game-guide-page .snake-back-link,
            body.snake-page.game-guide-page .desktop-controls { display:none !important; }
            body.snake-page.game-guide-page:not(.snake-game-active) #startButton { display:block !important; width:100% !important; min-height:46px !important; padding:10px 12px !important; margin:5px 0 4px !important; border-radius:13px !important; font-size:16px !important; line-height:1.2 !important; }
            body.snake-page.game-guide-page .snake-quick-tip { display:block; margin:3px 0 7px; font-size:12px; line-height:1.3; color:#b0c9d3; }
            body.snake-page.game-guide-page.snake-game-active #startButton,
            body.snake-page.game-guide-page.snake-game-active .snake-quick-tip,
            body.snake-page.game-guide-page.snake-game-active .game-guide-more,
            body.snake-page.game-guide-page.snake-game-active .game-goal-card,
            body.snake-page.game-guide-page.snake-game-active #arcadeBottomNav,
            body.snake-page.game-guide-page.snake-game-active #arcadeDesktopNav { display:none !important; }
            body.snake-page.game-guide-page #earnlyCompactLeaderboard { display:block !important; position:relative !important; z-index:0; padding:4px 7px 6px !important; margin:3px 0 5px !important; border-radius:13px !important; animation:none !important; }
            body.snake-page.game-guide-page #earnlyCompactLeaderboard .compact-leaderboard-head { min-height:28px !important; margin:0 0 3px !important; gap:5px !important; }
            body.snake-page.game-guide-page #earnlyCompactLeaderboard .compact-leaderboard-head strong { font-size:13px !important; line-height:1.2 !important; }
            body.snake-page.game-guide-page #earnlyCompactLeaderboard .compact-leaderboard-eyebrow,
            body.snake-page.game-guide-page #earnlyCompactLeaderboard .compact-leaderboard-avatar,
            body.snake-page.game-guide-page #earnlyCompactLeaderboard .compact-leaderboard-target { display:none !important; }
            body.snake-page.game-guide-page #earnlyCompactLeaderboard .compact-leaderboard-link { display:inline-flex !important; align-items:center !important; min-height:44px !important; padding:0 5px !important; border:0 !important; background:none !important; font-size:12px !important; white-space:nowrap; }
            body.snake-page.game-guide-page.snake-game-active #earnlyCompactLeaderboard .compact-leaderboard-link { display:none !important; }
            body.snake-page.game-guide-page #earnlyCompactLeaderboard .compact-leaderboard-list { display:grid !important; grid-template-columns:repeat(3,minmax(0,1fr)) !important; gap:5px !important; }
            body.snake-page.game-guide-page #earnlyCompactLeaderboard .compact-leaderboard-row { display:grid !important; grid-template-columns:17px minmax(0,1fr) !important; grid-template-rows:auto auto !important; min-width:0 !important; min-height:37px !important; gap:2px 3px !important; padding:4px !important; border-radius:8px !important; }
            body.snake-page.game-guide-page #earnlyCompactLeaderboard .compact-leaderboard-rank { grid-column:1; grid-row:1 / 3; align-self:center; font-size:15px !important; }
            body.snake-page.game-guide-page #earnlyCompactLeaderboard .compact-leaderboard-player,
            body.snake-page.game-guide-page #earnlyCompactLeaderboard .compact-leaderboard-score { grid-column:2 !important; font-size:12px !important; line-height:1.15 !important; text-align:left !important; min-width:0 !important; white-space:nowrap !important; overflow:hidden !important; text-overflow:ellipsis !important; }
            body.snake-page.game-guide-page #earnlyCompactLeaderboard .compact-leaderboard-player { grid-row:1; }
            body.snake-page.game-guide-page #earnlyCompactLeaderboard .compact-leaderboard-score { grid-row:2; }
            body.snake-page.game-guide-page #earnlyCompactLeaderboard :is(.compact-leaderboard-empty,.compact-leaderboard-loading) { grid-column:1 / -1; padding:4px !important; font-size:12px !important; }
            body.snake-page.game-guide-page .game-guide-surface-wrap { width:var(--snake-board-size,100%) !important; max-width:100% !important; margin:2px auto 0 !important; min-height:0 !important; }
            body.snake-page.game-guide-page #game { display:block !important; width:100% !important; height:auto !important; aspect-ratio:1; max-width:100% !important; min-width:0 !important; margin:0 !important; filter:none !important; opacity:1 !important; }
            body.snake-page.game-guide-page .game-guide-more { display:block; padding:0 !important; margin:4px 0 !important; border:0 !important; background:none !important; font-size:12px; }
            body.snake-page.game-guide-page .game-guide-more summary { min-height:44px; padding:12px 4px; color:#b9cedd; }
          }
          '''
          for dest in ['snake-ui.css','www/snake-ui.css']:
              Path(dest).write_text(css)
          tests = r'''const { test, expect } = require('@playwright/test');
          async function snakeFixture(page) {
            await page.route('**/cloud.js', r => r.fulfill({contentType:'application/javascript',body:''}));
            await page.route('https://cdn.jsdelivr.net/**', r => r.fulfill({contentType:'application/javascript',body:''}));
            await page.addInitScript(() => {
              localStorage.setItem('arcadeOnboardingSeen','1');
              window.EarnlyCloud = { leaderboard:async () => ({entries:[
                {rank:1,username:'LongPlayerName123',avatar:'🚀',score:27},
                {rank:2,username:'McGogh',avatar:'🧠',score:24},
                {rank:3,username:'Elmerglue',avatar:'🎮',score:12}
              ],label:'apples',lowerIsBetter:false}), submitLeaderboardScore:async () => ({ok:true}) };
            });
          }
          async function press(locator, info) { if(info.project.use.hasTouch) await locator.tap(); else await locator.click(); }
          async function geometry(page) {
            return page.evaluate(() => {
              const box = s => { const r=document.querySelector(s).getBoundingClientRect(); return {x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom}; };
              const nav=document.getElementById('arcadeBottomNav');
              return {board:box('#game'),header:box('.snake-header'),leaderboard:box('#earnlyCompactLeaderboard'),stats:box('.snake-stats'),
                navTop:getComputedStyle(nav).display==='none'?innerHeight:nav.getBoundingClientRect().top,
                overflow:document.documentElement.scrollWidth-innerWidth,
                rows:[...document.querySelectorAll('#earnlyCompactLeaderboard .compact-leaderboard-row')].map(x=>x.getBoundingClientRect().y)};
            });
          }
          for (const size of [{width:320,height:568},{width:390,height:844},{width:440,height:956}]) {
            test(`Snake mobile ${size.width}px: compact entry and real pause quit controls`, async ({page},info) => {
              await page.setViewportSize(size); await snakeFixture(page); await page.goto('/snake.html');
              const start=page.locator('#startButton'), pause=page.locator('#earnlyPauseButton'), quit=page.locator('#snakeExit');
              await expect(page.locator('#earnlyCompactLeaderboard .compact-leaderboard-row')).toHaveCount(3);
              await expect(start).toBeInViewport();
              for(const selector of ['.game-start-summary','.game-guide-strip','.game-guide-overlay']) await expect(page.locator(selector)).toBeHidden();
              await expect(page.locator('.snake-quick-tip')).toContainText('Swipe anywhere');
              await expect.poll(async()=> (await geometry(page)).board.bottom).toBeLessThan(size.height-40);
              const ready=await geometry(page); console.log('SNAKE_READY',size.width,JSON.stringify(ready));
              expect(ready.board.y).toBeLessThan(300); expect(ready.stats.height).toBeLessThan(40);
              expect(ready.leaderboard.height).toBeLessThan(110); expect(ready.board.width).toBeGreaterThanOrEqual(150);
              expect(Math.abs(ready.board.width-ready.board.height)).toBeLessThan(2);
              expect(ready.board.bottom).toBeLessThanOrEqual(ready.navTop-40); expect(ready.overflow).toBeLessThanOrEqual(1);
              expect(Math.max(...ready.rows)-Math.min(...ready.rows)).toBeLessThan(3);
              await info.attach('snake-ready-'+size.width,{body:await page.screenshot(),contentType:'image/png'});
              await press(start,info); await expect(page.locator('#gameStatus')).toHaveText('Running',{timeout:6000});
              // Physical click/tap, never DOM .click(): proves the full-screen controller is not covering Pause.
              await press(pause,info); await expect(page.locator('#gameStatus')).toHaveText('Paused');
              await expect(quit).toHaveText('× Quit'); await expect(quit).toBeInViewport(); await expect(pause).toBeInViewport();
              await expect(page.locator('#arcadeBottomNav')).toBeHidden();
              const live=await geometry(page); console.log('SNAKE_ACTIVE',size.width,JSON.stringify(live));
              expect(live.board.y).toBeLessThan(250); expect(live.board.bottom).toBeLessThanOrEqual(size.height);
              expect(live.leaderboard.height).toBeLessThan(95);
              for (const id of ['snakeExit','earnlyPauseButton']) {
                const control=await page.locator('#'+id).boundingBox(); expect(control.height).toBeGreaterThanOrEqual(44);
                expect(control.y).toBeGreaterThanOrEqual(0); expect(control.bottom||control.y+control.height).toBeLessThan(live.board.y);
              }
              const state=await page.evaluate(()=>JSON.stringify({snake,nextDirection,score}));
              await page.keyboard.press('ArrowUp'); await page.waitForTimeout(300);
              expect(await page.evaluate(()=>JSON.stringify({snake,nextDirection,score}))).toBe(state);
              await info.attach('snake-paused-'+size.width,{body:await page.screenshot(),contentType:'image/png'});
              await press(pause,info); await expect(page.locator('#gameStatus')).toHaveText('Running');
              const before=await page.evaluate(()=>({points:Arcade.number('points'),runs:Arcade.number('gameRuns_snake')}));
              await press(quit,info); await expect(page).toHaveURL(/games\.html/);
              expect(await page.evaluate(()=>({points:Arcade.number('points'),runs:Arcade.number('gameRuns_snake')}))).toEqual(before);
            });
          }
          test('Snake mobile: quit remains usable while paused',async({page},info)=>{
            await page.setViewportSize({width:390,height:844}); await snakeFixture(page); await page.goto('/snake.html');
            await press(page.locator('#startButton'),info); await expect(page.locator('#gameStatus')).toHaveText('Running',{timeout:6000});
            await press(page.locator('#earnlyPauseButton'),info); await expect(page.locator('#gameStatus')).toHaveText('Paused');
            await press(page.locator('#snakeExit'),info); await expect(page).toHaveURL(/games\.html/);
            await expect(page.locator('body')).not.toHaveClass(/earnly-gameplay-locked|snake-game-active|earnly-game-paused/);
          });
          test('Snake mobile: quit cancels a pending countdown without a ghost run',async({page},info)=>{
            await page.setViewportSize({width:390,height:844}); await snakeFixture(page); await page.goto('/snake.html');
            await page.evaluate(()=>{Arcade.countdown=callback=>{window.pendingSnakeStart=callback;};});
            await press(page.locator('#startButton'),info); await expect(page.locator('#gameStatus')).toHaveText('Get Ready');
            // Hold navigation in this test so the cancelled callback can be delivered on the old document.
            await page.evaluate(()=>document.getElementById('snakeExit').addEventListener('click',e=>e.preventDefault()));
            await press(page.locator('#snakeExit'),info); await page.evaluate(()=>window.pendingSnakeStart());
            await expect(page.locator('#gameStatus')).toHaveText('Ready');
            expect(await page.evaluate(()=>({game,starting,hidden:controlLayer.hidden}))).toEqual({game:null,starting:false,hidden:true});
            await expect(page.locator('#earnlyPauseButton')).toBeHidden();
          });
          test('Snake mobile: bottom steering results and replay still work',async({page},info)=>{
            await page.setViewportSize({width:390,height:844}); await snakeFixture(page); await page.goto('/snake.html');
            await press(page.locator('#startButton'),info); await expect(page.locator('#gameStatus')).toHaveText('Running',{timeout:6000});
            const steering=await page.evaluate(()=>{
              controlLayer.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerId:8,pointerType:'touch',clientX:170,clientY:innerHeight-30}));
              document.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,cancelable:true,pointerId:8,pointerType:'touch',clientX:170,clientY:innerHeight-110}));
              document.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,cancelable:true,pointerId:8,pointerType:'touch',clientX:170,clientY:innerHeight-110}));
              const selected=nextDirection; gameOver(); return selected;
            });
            expect(steering).toBe('UP'); await expect(page.locator('dialog.game-result-dialog')).toBeVisible();
            await expect(page.locator('body')).not.toHaveClass(/snake-game-active/);
            await press(page.locator('dialog.game-result-dialog button').filter({hasText:/Play Again/}).first(),info);
            await expect(page.locator('#gameStatus')).toHaveText('Running',{timeout:6000});
            await press(page.locator('#earnlyPauseButton'),info); await expect(page.locator('#gameStatus')).toHaveText('Paused');
          });
          test('Snake mobile: web native assets and cache stay aligned',async({request})=>{
            for(const file of ['snake.html','snake-ui.css']){
              const web=await request.get('/'+file), native=await request.get('/www/'+file);
              expect(web.ok()).toBeTruthy(); expect(native.ok()).toBeTruthy(); expect(await web.text()).toBe(await native.text());
            }
            const worker=await(await request.get('/service-worker.js')).text(); expect(worker).toContain("'./snake-ui.css'");
          });
          '''
          Path('tests/snake-mobile.cases.js').write_text(tests)
          smoke = Path('tests/smoke.spec.js')
          t = smoke.read_text()
          old = """  const summary = page.locator('.game-start-summary');
            await expect(summary).toBeVisible();
            await expect(summary.locator('.game-start-plays')).toContainText('play');
            await expect(summary.locator('.game-start-reward')).toContainText('Coin');
            await expect(summary.locator('.game-start-control')).toContainText('Steer');"""
          new = """  const summary = page.locator('.game-start-summary');
            if (await page.evaluate(() => matchMedia('(max-width:699px)').matches)) {
              await expect(summary).toBeHidden();
              await expect(page.locator('.snake-stats')).toContainText('Plays');
              await expect(page.locator('.snake-quick-tip')).toContainText('Swipe anywhere');
              await page.locator('.game-guide-more summary').click();
              await expect(page.locator('.game-guide-more')).toContainText('Max 30 Coins per run');
            } else {
              await expect(summary).toBeVisible();
              await expect(summary.locator('.game-start-plays')).toContainText('play');
              await expect(summary.locator('.game-start-reward')).toContainText('Coin');
              await expect(summary.locator('.game-start-control')).toContainText('Steer');
            }"""
          assert t.count(old) == 1, 'Original Snake entry contract missing'
          smoke.write_text(t.replace(old,new,1) + "\nrequire('./snake-mobile.cases');\n")
          worker = Path('service-worker.js')
          w = worker.read_text()
          w,n = re.subn(r"earnly-arcade-v1\.1-cache-v(\d+)",lambda m:'earnly-arcade-v1.1-cache-v'+str(int(m[1])+1),w,count=1)
          assert n == 1
          assert "'./compact-game-entry.css'" in w
          worker.write_text(w.replace("'./compact-game-entry.css'","'./compact-game-entry.css', './snake-ui.css'",1))
          print('Patched Snake entry and session controls; physics, score, and rewards preserved.')
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - name: Validate Snake and shared entry regressions
        run: npx playwright test tests/smoke.spec.js --project=desktop-chromium --project=mobile-webkit --grep 'Snake|game start screen explains|compact entry:' --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snake-mobile-layout-evidence
          path: |
            test-results
            playwright-report
      - name: Commit only validated changes to the isolated branch
        run: |
          test "$GITHUB_REF_NAME" = "fix/snake-compact-controls-20260926"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snake.html www/snake.html snake-ui.css www/snake-ui.css tests/snake-mobile.cases.js tests/smoke.spec.js service-worker.js
          git rm .github/workflows/snake-mobile-layout-once.yml
          git commit -m "Declutter Snake and keep Pause and Quit reachable on iPhone"
          git push origin HEAD:fix/snake-compact-controls-20260926
