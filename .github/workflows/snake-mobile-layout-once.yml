name: Snake mobile layout validation
on:
  push:
    branches: [fix/snake-compact-controls-20260926]
    paths: [.github/workflows/snake-mobile-layout-once.yml]
permissions:
  contents: write
concurrency:
  group: snake-mobile-layout-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/snake-compact-controls-20260926
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile only the overlapping Snake UI and preserve current main assets
        shell: python
        run: |
          from pathlib import Path
          import subprocess, re
          base='1cc95b28c28d9533d5147d0a4c7137a0589d8326'
          main='d2b236c28ad461e28837121adbf0b26ef3b98106'
          changed=subprocess.check_output(['git','diff','--name-only',base,main],text=True).splitlines()
          print('Concurrent main changes:',changed)
          assert set(changed) <= {'snake.html','www/snake.html','service-worker.js'}, 'Main has additional changes requiring review'
          ours=Path('snake.html').read_text()
          theirs=subprocess.check_output(['git','show',main+':snake.html'],text=True)
          # Both updates address the same UI. Keep the tested single-control layout,
          # while proving no newer physics/rewards/drawing function is being discarded.
          for name in ['snakeReward','setDirection','randomFood','drawSnakeBody','drawSnakeHead','drawApple','draw','gameOver']:
              pattern=r'    function '+name+r'\([^)]*\) \{.*?\n    \}'
              a=re.search(pattern,ours,re.S); b=re.search(pattern,theirs,re.S)
              assert a and b, name
              av=a.group(); bv=b.group()
              if name=='gameOver':
                  av=re.sub(r'      startButton.textContent = .*?;', '', av)
                  bv=re.sub(r'      startButton.textContent = .*?;', '', bv)
              assert av==bv, 'Concurrent gameplay change: '+name
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          merged=subprocess.run(['git','merge','--no-commit','--no-ff',main])
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          assert set(conflicts) <= {'snake.html','www/snake.html','service-worker.js'}, conflicts
          for file in ['snake.html','www/snake.html']:
              Path(file).write_text(ours)
          worker=subprocess.check_output(['git','show',main+':service-worker.js'],text=True)
          worker,n=re.subn(r'earnly-arcade-v1\.1-cache-v(\d+)',lambda m:'earnly-arcade-v1.1-cache-v'+str(int(m[1])+1),worker,count=1)
          assert n==1 and "'./compact-game-entry.css'" in worker
          if "'./snake-ui.css'" not in worker:
              worker=worker.replace("'./compact-game-entry.css'","'./compact-game-entry.css', './snake-ui.css'",1)
          Path('service-worker.js').write_text(worker)
          subprocess.run(['git','add','snake.html','www/snake.html','service-worker.js'],check=True)
          assert not subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).strip()
          print('Single tested toolbar retained; main gameplay unchanged; asset cache advanced to v68.')
      - name: Install dependencies
        run: npm install > /tmp/snake-npm.log 2>&1 || { tail -100 /tmp/snake-npm.log; exit 1; }
      - name: Install both browser engines
        run: npx playwright install --with-deps chromium webkit > /tmp/snake-browsers.log 2>&1 || { tail -100 /tmp/snake-browsers.log; exit 1; }
      - name: Validate reconciled Snake and entry regressions without retries
        run: |
          set +e
          npx playwright test tests/smoke.spec.js --project=desktop-chromium --project=mobile-webkit --grep 'Snake|game start screen explains|compact entry:' --retries=0 > /tmp/snake-tests.log 2>&1
          result=$?
          grep -v '\[WebServer\]' /tmp/snake-tests.log
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snake-mobile-layout-evidence
          path: |
            test-results
            playwright-report
      - name: Commit reconciled and validated source to the isolated branch
        run: |
          test "$GITHUB_REF_NAME" = "fix/snake-compact-controls-20260926"
          git add snake.html www/snake.html snake-ui.css www/snake-ui.css tests/snake-mobile.cases.js tests/smoke.spec.js service-worker.js
          git rm .github/workflows/snake-mobile-layout-once.yml
          git commit -m "Reconcile compact Snake controls with latest main HUD and cache"
          git push origin HEAD:fix/snake-compact-controls-20260926
