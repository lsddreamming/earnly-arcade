name: Snake mobile layout validation
on:
  push:
    branches: [fix/snake-compact-controls-20260926]
    paths: [.github/workflows/snake-mobile-layout-once.yml]
permissions:
  contents: write
concurrency:
  group: snake-mobile-layout-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/snake-compact-controls-20260926
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply validated refinements and resolve legacy style collisions
        shell: python
        run: |
          from pathlib import Path
          import subprocess, textwrap
          source = subprocess.check_output(['git','show','24b0bd62f63d9ff48d99d03113e6f87837096284:.github/workflows/snake-mobile-layout-once.yml'], text=True)
          patch = source.split('        run: |\n',1)[1].split('      - name: Install dependencies',1)[0]
          exec(compile(textwrap.dedent(patch), '<snake-layout-refinements>', 'exec'))
          css = Path('snake-ui.css').read_text()
          css = css.replace('min-height:44px; min-width:90px;', 'min-height:44px !important; min-width:90px !important;')
          css = css.replace('min-height:44px; min-width:82px;', 'min-height:44px !important; min-width:82px !important;')
          old = 'body.snake-page.game-guide-page #game {'
          new = 'body.snake-page.game-guide-page canvas#game, body.snake-page.game-guide-page.snake-game-active canvas#game {'
          assert old in css
          css = css.replace(old,new,1)
          css += '''
          /* Session buttons must not move or shrink when the run starts or pauses. */
          body.snake-page .snake-toolbar,
          body.snake-page .snake-toolbar #snakeExit,
          body.snake-page .snake-toolbar #earnlyPauseButton {
            animation:none !important; transition:none !important; transform:none !important;
          }
          body.snake-page.game-guide-page .snake-toolbar #snakeExit,
          body.snake-page.game-guide-page .snake-toolbar #earnlyPauseButton {
            height:44px !important; min-height:44px !important; max-height:none !important;
            box-sizing:border-box !important; flex-shrink:0 !important;
          }
          '''
          for p in ['snake-ui.css','www/snake-ui.css']: Path(p).write_text(css)
          html = Path('snake.html').read_text()
          old = 'const available = bottom - top - (active ? 16 : 52);'
          new = "const bottomInset = active ? Math.max(16, parseFloat(getComputedStyle(document.querySelector('main.container')).paddingBottom) || 0) : 52;\n                  const available = bottom - top - bottomInset;"
          assert old in html
          html = html.replace(old,new,1)
          for p in ['snake.html','www/snake.html']: Path(p).write_text(html)
          tests = Path('tests/snake-mobile.cases.js').read_text()
          tests = tests.replace('expect(control.height).toBeGreaterThanOrEqual(44);', 'expect(control.height, id + " must retain a full-size touch target").toBeGreaterThanOrEqual(44);')
          Path('tests/snake-mobile.cases.js').write_text(tests)
          print('Removed legacy active canvas cap and enforced stable 44px Pause/Quit hit targets.')
      - name: Install dependencies
        run: npm install > /tmp/snake-npm.log 2>&1 || { tail -100 /tmp/snake-npm.log; exit 1; }
      - name: Install both browser engines
        run: npx playwright install --with-deps chromium webkit > /tmp/snake-browsers.log 2>&1 || { tail -100 /tmp/snake-browsers.log; exit 1; }
      - name: Validate Snake and shared entry regressions without retries
        run: |
          set +e
          npx playwright test tests/smoke.spec.js --project=desktop-chromium --project=mobile-webkit --grep 'Snake|game start screen explains|compact entry:' --retries=0 > /tmp/snake-tests.log 2>&1
          result=$?
          grep -v '\[WebServer\]' /tmp/snake-tests.log
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snake-mobile-layout-evidence
          path: |
            test-results
            playwright-report
      - name: Commit only validated changes to the isolated branch
        run: |
          test "$GITHUB_REF_NAME" = "fix/snake-compact-controls-20260926"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snake.html www/snake.html snake-ui.css www/snake-ui.css tests/snake-mobile.cases.js tests/smoke.spec.js service-worker.js
          git rm .github/workflows/snake-mobile-layout-once.yml
          git commit -m "Declutter Snake and keep Pause and Quit reachable on iPhone"
          git push origin HEAD:fix/snake-compact-controls-20260926
