name: Prepare catalog repair
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/prepare-catalog-repair.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.number == 459 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/spuddy-evolution-public-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare exact five-line repair without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const assert = require('node:assert/strict');
          const { spawnSync } = require('node:child_process');
          const vm = require('node:vm');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const pr = event.pull_request;
          const repo = 'lsddreamming/earnly-arcade';
          assert.equal(process.env.GITHUB_REPOSITORY, repo);
          assert.equal(pr.number, 459);
          assert.equal(pr.head.repo.full_name, repo);
          assert.equal(pr.head.ref, 'release/spuddy-evolution-public-beta');
          const sha = content => crypto.createHash('sha1').update('blob ' + Buffer.byteLength(content) + '\0').update(content).digest('hex');
          function replaceExact(content, before, after, count) {
            assert.equal(content.split(before).length - 1, count, 'Unexpected occurrence count: ' + before);
            return content.split(before).join(after);
          }
          const changes = [
            { path: 'tests/dodger-style.spec.js', before: '0ca66f40a306fe025fcdfdff00e74dd121d9c8bc', after: '194a0822a086329993cf803c2339f40d046df636', replacements: [['toHaveCount(27)', 'toHaveCount(28)', 1]] },
            { path: 'tests/smoke.spec.js', before: '2415dc36e4b0590cbfddf36bade755f86f46cd1c', after: 'bb9c2c0b460b041999e92f6b474062e8da6a8da3', replacements: [['toHaveCount(27)', 'toHaveCount(28)', 2], ['27-game catalog', '28-game catalog', 1], ['27 games to explore', '28 games to explore', 1]] }
          ];
          for (const change of changes) {
            let content = fs.readFileSync(change.path, 'utf8');
            assert.equal(sha(content), change.before, 'Source changed; stop and review ' + change.path);
            for (const replacement of change.replacements) content = replaceExact(content, ...replacement);
            assert.equal(sha(content), change.after, 'Corrected bytes must match local verification');
            new vm.Script(content, { filename: change.path });
            fs.writeFileSync(change.path, content);
            change.content = content;
          }
          for (const prefix of ['', 'www/']) {
            const html = fs.readFileSync(prefix + 'games.html', 'utf8');
            const match = html.match(/const gameInfo = (\[[\s\S]*?\n    \]);/);
            assert.ok(match);
            const games = vm.runInNewContext('(' + match[1] + ')');
            assert.equal(games.length, 28);
            assert.equal(new Set(games.map(g => g.key)).size, 28);
            assert.equal(games.filter(g => g.key === 'spuddyEvolution').length, 1);
          }
          const tests = spawnSync(process.execPath, ['--test', 'tests/spuddy-evolution-runtime.cjs', 'tests/spuddy-evolution-catalog.cjs'], { stdio: 'inherit' });
          assert.equal(tests.status, 0, 'Runtime and catalog checks must pass before preparing commit');
          async function api(path, body) {
            const response = await fetch('https://api.github.com/repos/' + repo + path, {
              method: body === undefined ? 'GET' : 'POST',
              headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
              body: body === undefined ? undefined : JSON.stringify(body)
            });
            if (!response.ok) throw new Error('GitHub API ' + path + ': ' + response.status + ' ' + await response.text());
            return response.json();
          }
          (async () => {
            const fresh = await api('/pulls/459');
            assert.equal(fresh.head.sha, pr.head.sha, 'PR advanced; do not publish a stale correction');
            const parent = await api('/git/commits/' + pr.head.sha);
            const tree = [];
            for (const change of changes) {
              const blob = await api('/git/blobs', { content: change.content, encoding: 'utf-8' });
              assert.equal(blob.sha, change.after);
              tree.push({ path: change.path, mode: '100644', type: 'blob', sha: blob.sha });
            }
            // Remove this one-off helper from the prepared commit. No branch or
            // deployment is changed here; the connector will verify and apply it.
            tree.push({ path: '.github/workflows/prepare-catalog-repair.yml', mode: '100644', type: 'blob', sha: null });
            const result = await api('/git/trees', { base_tree: parent.tree.sha, tree });
            const commit = await api('/git/commits', {
              message: 'test: expect 28 catalog games after the approved Evolution beta addition\n\nCorrect five stale test lines only, retaining all layout, favorites, navigation and retirement assertions. Exact source and result blobs verified; 19 runtime/catalog checks passed. Remove the one-off preparation helper. Full browser CI remains required before merge.',
              tree: result.sha, parents: [pr.head.sha]
            });
            console.log('PREPARED_REPAIR_COMMIT=' + commit.sha);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Prepared exact five-line catalog repair: `' + commit.sha + '`.\n\nNo branch updated, no merge, and no deployment. Helper removed from prepared tree. Full browser CI still required.\n');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
