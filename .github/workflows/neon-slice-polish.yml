name: Neon Slice polish QA
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  polish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            project: desktop-chromium
            browser: chromium
          - os: macos-latest
            project: mobile-webkit
            browser: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test tests/neon-slice.spec.js --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neon-slice-polish-${{ matrix.project }}
          path: test-results/
