name: Publish Earnly Pages after QA

on:
  workflow_run:
    workflows: [Earnly automated tests]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: earnly-pages-production
  cancel-in-progress: false

jobs:
  publish:
    # PR and manually dispatched QA runs cannot publish. A failed or cancelled
    # suite leaves the previous Pages deployment online.
    if: >-
      ${{ github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the exact commit that passed QA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Ensure this is still the latest main commit
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$TESTED_SHA" ] || [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            echo 'QA passed for an older commit; leaving production as is.'
            exit 1
          fi

      - name: Stage the existing root web site
        run: |
          mkdir -p _pages
          cp -- ./*.html ./*.css ./*.js ./*.svg ./*.webmanifest ./CNAME _pages/
          printf '' > _pages/.nojekyll
          test "$(cat _pages/CNAME)" = 'earnlyarcade.com'
          test -s _pages/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - name: Recheck main immediately before publishing
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$TESTED_SHA"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
