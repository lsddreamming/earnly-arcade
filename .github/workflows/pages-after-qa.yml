name: Publish Earnly Pages after QA

on:
  workflow_run:
    workflows: [Earnly automated tests]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: earnly-pages-production
  cancel-in-progress: false

jobs:
  publish:
    # PR and manually dispatched QA runs cannot publish. A failed or cancelled
    # suite leaves the previous Pages deployment online.
    if: >-
      ${{ github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the exact commit that passed QA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Ensure this is still the latest main commit
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$TESTED_SHA" ] || [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            echo 'QA passed for an older commit; leaving production as is.'
            exit 1
          fi

      - name: Require successful World engine checks when scheduled
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python - <<'PYTHON'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/world-engine.yml/runs?head_sha={os.environ['TESTED_SHA']}&event=push&per_page=100"
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(request) as response:
              runs = json.load(response)["workflow_runs"]
          # This workflow is path-filtered, so unrelated changes have no run.
          # If scheduled, the latest attempt must finish successfully first.
          if runs:
              latest = max(runs, key=lambda run: run["id"])
              if latest["status"] != "completed" or latest["conclusion"] != "success":
                  raise SystemExit("World engine QA is not green; leaving production unchanged.")
          print("World engine publication gate passed.")
          PYTHON

      - name: Require successful Metal Mayhem checks when scheduled
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python - <<'PYTHON'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/metal-mayhem.yml/runs?head_sha={os.environ['TESTED_SHA']}&event=push&per_page=100"
          request = urllib.request.Request(url, headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"})
          runs = json.load(urllib.request.urlopen(request))["workflow_runs"]
          if runs:
              latest = max(runs, key=lambda run: run["id"])
              if latest["status"] != "completed" or latest["conclusion"] != "success":
                  raise SystemExit("Metal Mayhem QA is not green; leaving production unchanged.")
          print("Metal Mayhem publication gate passed.")
          PYTHON

      - name: Stage the existing root web site
        run: |
          mkdir -p _pages
          cp -- ./*.html ./*.css ./*.js ./*.svg ./*.webmanifest ./CNAME _pages/
          # Starter picture previews are WebP files. Without them the live
          # catalog removes 3 of its 4 preview cards' images on load.
          cp -- ./*.webp _pages/
          cp -- ./*.woff2 _pages/
          cp -- ./metal-mayhem-*-LICENSE.txt _pages/
          cp -- ./sitemap.xml ./robots.txt ./ads.txt ./app-ads.txt _pages/
          # The existing branch-backed site also serves the native web mirror
          # at /www/, so keep that URL tree available after the source switch.
          cp -R -- ./www _pages/www
          printf '' > _pages/.nojekyll
          test "$(cat _pages/CNAME)" = 'earnlyarcade.com'
          test -s _pages/index.html
          test -s _pages/www/index.html
          # Verify all three photographic starter previews are packaged at
          # the root and under the native mirror before deployment begins.
          for asset in game-preview-neon-slice.webp game-preview-snake.webp game-preview-bubble-pop.webp game-preview-big-fish-energy.webp; do
            test -s "_pages/$asset"
            test -s "_pages/www/$asset"
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
          name: github-pages-${{ github.run_attempt }}

      - name: Wait for the Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          python - <<'PYTHON'
          import json, os, time, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts"
          for attempt in range(12):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  artifacts = [
                      artifact
                      for artifact in json.load(response)["artifacts"]
                      if artifact["name"] == os.environ["ARTIFACT_NAME"]
                  ]
              if len(artifacts) == 1:
                  print("Pages artifact metadata is available.")
                  break
              if attempt == 11:
                  raise SystemExit(
                      f"Expected one visible github-pages artifact, found {len(artifacts)}."
                  )
              time.sleep(5)
          PYTHON

      - name: Recheck main immediately before publishing
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$TESTED_SHA"

      - name: Deploy to GitHub Pages
        id: deployment
        # v4.0.0 uses the same run-scoped REST artifact lookup verified above.
        uses: actions/deploy-pages@f33f41b675f0ab2dc5a6863c9a170fe83af3571e
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  verify-catalog:
    name: Verify published catalog on mobile WebKit
    needs: publish
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install webkit
      - name: Verify exact deployed root and www catalog assets
        run: |
          python3 - <<'PYTHON'
          import pathlib, time, urllib.request
          hosts = ['https://earnlyarcade.com', 'https://www.earnlyarcade.com']
          files = ['games.html', 'games-showroom.css', 'games-starter-rotation.js', 'www/games.html', 'www/games-showroom.css', 'www/games-starter-rotation.js', 'world.html', 'world.js', 'world-renderer.js', 'www/world.html', 'www/world.js', 'www/world-renderer.js']
          # Bounce Run leaderboard release: require byte-identical scripts, page, and styles on BOTH production hosts.
          files += [prefix + name for prefix in ['', 'www/'] for name in ['mini.html', 'arcade.js', 'mini-games.js', 'bounce-run.css', 'lanerunner.html', 'lane-runner.css', 'shape-fit.css', 'shape-fit-rules.js', 'stardefender.html', 'star-defender.css', 'star-defender-scene.js', 'star-defender-flight.js']]
          # Keep direct production byte checks on the starter preview assets,
          # so blank images fail publication before browser QA can start.
          files += [prefix + name for prefix in ['', 'www/'] for name in ['game-preview-neon-slice.webp', 'game-preview-snake.webp', 'game-preview-bubble-pop.webp']]
          # BIG FISH ENERGY must match this exact tested release on both hosts.
          files += [prefix + name for prefix in ['', 'www/'] for name in ['big-fish-energy.html', 'big-fish-energy.css', 'big-fish-energy-engine.js', 'big-fish-energy-renderer.js', 'big-fish-energy-rewards.js', 'big-fish-energy.js', 'game-preview-big-fish-energy.webp']]
          files += [prefix + name for prefix in ['', 'www/'] for name in ['spuddy-evolution.html', 'spuddy-evolution.css', 'spuddy-evolution-engine.js', 'spuddy-evolution-3d.js', 'spuddy-evolution.js']]
          for host in hosts:
              for file in files:
                  expected = pathlib.Path(file).read_bytes()
                  url = host + '/' + file
                  for attempt in range(4):
                      with urllib.request.urlopen(url, timeout=30) as response:
                          actual = response.read()
                      if actual == expected:
                          print('Verified:', url)
                          break
                      if attempt == 3:
                          raise SystemExit('Production content does not match tested commit: ' + url)
                      time.sleep(15)
          PYTHON
      - name: Verify live Big Fish leaderboard and unsigned reward boundaries
        run: node scripts/verify-big-fish-live.mjs
      - name: Test live phone catalog including native mirror
        run: npx playwright test tests/mobile-density.spec.js --project=mobile-webkit --grep 'catalog badges|catalog puts|rotating Games starters'
        env:
          EARNLY_CATALOG_BASE_URL: https://earnlyarcade.com
      - name: Verify live starter card width and non-overlapping artwork
        run: npx playwright test tests/games-starter-layout.spec.js --project=mobile-webkit --workers=1
        env:
          EARNLY_CATALOG_BASE_URL: https://earnlyarcade.com
      - name: Verify live Evolution beta discovery and Play link
        run: npx playwright test tests/spuddy-evolution-catalog.spec.js --project=mobile-webkit --workers=1
        env:
          EARNLY_CATALOG_BASE_URL: https://earnlyarcade.com
      - name: Verify live Big Fish cover, catalog entry and mobile pause controls
        run: npx playwright test tests/big-fish-energy-catalog.spec.js --project=mobile-webkit --workers=1
        env:
          EARNLY_CATALOG_BASE_URL: https://earnlyarcade.com
      - name: Test published World room controls on mobile WebKit
        run: npx playwright test tests/world-ai-residents.spec.js --project=mobile-webkit --grep 'personal room chat labels|resident homes are optional|complete resident replies|maximum-length public messages'
        env:
          EARNLY_WORLD_BASE_URL: https://earnlyarcade.com
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-mobile-catalog
          path: |
            test-results/
            playwright-report/
          retention-days: 7
