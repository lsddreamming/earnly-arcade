name: Earnly world grid engine
on:
  pull_request:
    paths: ['tests/world*.spec.js', 'world*.js', 'world.html', 'world.css', 'world-server/**', 'scripts/*world*.mjs', 'supabase/migrations/*world*.sql', '.github/workflows/world-engine.yml']
  push:
    branches: [main]
    paths: ['tests/world*.spec.js', 'world*.js', 'world.html', 'world.css', 'world-server/**', 'scripts/*world*.mjs', 'supabase/migrations/*world*.sql', '.github/workflows/world-engine.yml']
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: world-server/package-lock.json
      - run: npm ci --prefix world-server --ignore-scripts
      - run: npm run typecheck --prefix world-server
      - run: npm test --prefix world-server
      - run: npm ci --ignore-scripts
      - run: npm run build:world-placement && git diff --exit-code -- world-placement.js
      - run: node scripts/test-world-placement.mjs
      - run: node scripts/test-world-daily.mjs
      - run: node scripts/test-world-social.mjs
      - run: node scripts/test-world-pet-toys.mjs
      - run: node scripts/test-world-pets.mjs
      - run: node scripts/test-world-persistence.mjs
      - run: node scripts/test-world-features.mjs
      - run: node scripts/test-world-room-browser.mjs
      - run: node scripts/test-world-rooms.mjs
      - run: node scripts/test-world-rename.mjs
      - run: node scripts/test-world-delete.mjs
      - run: node scripts/test-world-garden.mjs
      - run: node scripts/test-world-collections.mjs
      - run: node scripts/test-world-bathroom.mjs
      - run: node scripts/test-world-playroom.mjs
      - run: node scripts/test-world-halloween.mjs
      - run: node scripts/test-world-furniture-prices.mjs
      - run: node scripts/test-world-colors.mjs
      - run: node scripts/test-world-centered-tables.mjs
      - run: node scripts/test-world-boardwalk.mjs
      - run: node scripts/test-world-account-permissions.mjs
      - run: node scripts/test-world-residents.mjs
      - run: node scripts/test-world-ai-budget.mjs
      - run: node scripts/build-resident-homes.mjs --check && node scripts/test-world-resident-homes.mjs
      - run: node scripts/test-world-network.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/world.spec.js --project=desktop-chromium --grep "Owned furniture" --repeat-each=5 --workers=2
      - run: mkdir -p world-seating-shots && node scripts/test-world-browser.mjs
        env:
          WORLD_TEST_SCREENSHOTS: world-seating-shots
      - run: node scripts/test-world-pets-browser.mjs
        env:
          WORLD_TEST_SCREENSHOTS: world-seating-shots
      - uses: actions/upload-artifact@v4
        with:
          name: world-seating-screenshots
          path: world-seating-shots/

