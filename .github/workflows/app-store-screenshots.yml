name: App Store native screenshots

on:
  workflow_dispatch:
  push:
    branches: [capture/ios-1-11-screenshots]

concurrency:
  group: earnly-app-store-screenshots
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshots:
    name: screenshots (${{ matrix.device }})
    strategy:
      fail-fast: false
      matrix:
        device: [iphone-medium, iphone-large, ipad]
    runs-on: macos-26
    timeout-minutes: 30
    env:
      EARNLY_CAPTURE_DEVICE: ${{ matrix.device }}
      EARNLY_ADMOB_TEST_MODE: '0'
      EARNLY_IOS_MARKETING_VERSION: '1.11'
      EARNLY_IOS_BUILD_NUMBER: '901'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Generate production app for simulator
        run: |
          rm -rf ios
          npm run native:ios:generate
          gem install xcodeproj -v 1.27.0 --user-install --no-document
          ruby scripts/configure-ios-screenshots.rb
      - name: Capture actual iPhone and iPad screens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/screenshots
          git rev-parse HEAD > build/screenshots/source-commit.txt
          xcrun simctl list devices available -j > build/devices.json
          python3 - <<'PY'
          import json, os
          devices = [d for group in json.load(open('build/devices.json'))['devices'].values() for d in group if d.get('isAvailable')]
          choices = [('iphone-medium', ['iPhone 17 Pro', 'iPhone 16 Pro']), ('iphone-large', ['iPhone 17 Pro Max', 'iPhone 16 Pro Max']), ('ipad', ['iPad Pro 13-inch (M5)', 'iPad Pro 13-inch (M4)'])]
          with open('build/capture-devices.tsv', 'w') as out:
              for kind, names in choices:
                  if kind != os.environ['EARNLY_CAPTURE_DEVICE']: continue
                  chosen = next((d for name in names for d in devices if d['name'] == name), None)
                  if not chosen: raise SystemExit('Required screenshot simulator unavailable: ' + str(names))
                  out.write(kind + '\t' + chosen['udid'] + '\n')
          PY
          while IFS=$'\t' read -r kind udid; do
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
            capture_status=0
            xcodebuild test \
              -project ios/App/App.xcodeproj -scheme StoreScreenshots \
              -destination "platform=iOS Simulator,id=$udid" \
              -derivedDataPath build/DerivedData \
              -resultBundlePath "build/$kind.xcresult" \
              -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO || capture_status=$?
            xcrun xcresulttool export attachments --path "build/$kind.xcresult" --output-path "build/screenshots/$kind"
            xcrun simctl shutdown "$udid"
            test "$capture_status" = 0
          done < build/capture-devices.tsv
          git rev-parse HEAD > build/screenshots/source-commit.txt
      - name: Upload screenshots and capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earnly-1.11-native-screenshots-${{ matrix.device }}
          path: |
            build/screenshots/
            build/*.xcresult
            build/devices.json
          retention-days: 30
