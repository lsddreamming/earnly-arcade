name: Spuddy Turf QA
on:
  pull_request:
  push:
    branches: [main]
jobs:
  turf:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            project: desktop-chromium
            browser: chromium
          - os: ubuntu-latest
            project: mobile-webkit
            browser: webkit
          - os: macos-15-intel
            project: mobile-webkit
            browser: webkit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/spuddy-turf-engine.cjs
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test tests/spuddy-turf.spec.js --project=${{ matrix.project }}
      - run: npx playwright test tests/smoke.spec.js tests/dodger-style.spec.js --project=${{ matrix.project }} --grep 'mobile catalog shows regular|Crystal Command belongs|active catalog, guides'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spuddy-turf-${{ matrix.os }}-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
