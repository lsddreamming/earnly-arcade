name: Spuddy Evolution QA
on:
  pull_request:
    paths: ['spuddy-evolution*', 'www/spuddy-evolution*', 'tests/spuddy-evolution*', '.github/workflows/spuddy-evolution.yml']
  push:
    branches: [main]
    paths: ['spuddy-evolution*', 'www/spuddy-evolution*', 'tests/spuddy-evolution*', '.github/workflows/spuddy-evolution.yml']
jobs:
  evolution:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            project: desktop-chromium
            browser: chromium
          - os: ubuntu-latest
            project: mobile-webkit
            browser: webkit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/spuddy-evolution-engine.cjs
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test tests/spuddy-evolution.spec.js --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spuddy-evolution-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
