name: Validate compact mobile entry
on:
  push:
    branches: ['fix/compact-game-entry-20260926']
    paths:
      - '.github/workflows/compact-game-entry.yml'
      - 'compact-game-entry.css'
      - 'tests/compact-game-entry.cases.js'
permissions:
  contents: write
concurrency:
  group: compact-game-entry-validation
  cancel-in-progress: true
jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply scoped layout patch and preserve gameplay scripts
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const scripts = text => [...text.matchAll(/<script\b[^>]*>[\s\S]*?<\/script>/gi)].map(m => m[0]);
          for (const file of ['blockdrop.html','neonmaze.html']) {
            const before = fs.readFileSync(file,'utf8');
            let after = before;
            if (file === 'blockdrop.html') {
              const stray = '    }\n    }\n\n    /* iPhone ready-screen polish:';
              const clean = '    }\n\n    /* iPhone ready-screen polish:';
              assert(after.includes(stray)||after.includes(clean), 'Expected Block Drop style marker missing; review instead of guessing');
              after = after.replace(stray,clean);
            }
            if (!after.includes('compact-game-entry.css')) {
              after = after.replace('</head>','  <link rel="stylesheet" href="compact-game-entry.css?v=1">\n</head>');
            }
            if (file === 'neonmaze.html' && !after.includes('class="entry-quick-tip"')) {
              const button = '<button class="green wide" id="startButton" type="button" aria-label="Tap to start Neon Maze">▶ TAP TO START</button>';
              assert(after.includes(button), 'Neon Maze start button changed; review patch');
              after = after.replace(button,button+'\n  <p class="entry-quick-tip">Swipe to steer · clear a sector for +35s</p>');
            }
            assert.deepEqual(scripts(after),scripts(before), 'Gameplay scripts must remain byte-for-byte unchanged');
            fs.writeFileSync(file,after);
            fs.copyFileSync(file,'www/'+file);
            console.log(file+': entry-only patch applied; all gameplay scripts unchanged');
          }
          fs.copyFileSync('compact-game-entry.css','www/compact-game-entry.css');
          const smoke = 'tests/smoke.spec.js';
          let source = fs.readFileSync(smoke,'utf8');
          const title = "test('Block Drop ready screen stays compact and board-forward on iPhone'";
          const first = source.indexOf(title);
          assert(first>=0, 'Existing entry test missing');
          const last = source.indexOf("\ntest('",first+title.length);
          assert(last>first);
          let entry = source.slice(first,last);
          entry = entry.replace("await expect(page.locator('.game-guide-more')).toBeHidden();", "await expect(page.locator('.game-guide-more summary')).toBeVisible();\n  await expect(page.locator('.game-guide-more')).not.toHaveAttribute('open', '');");
          source = source.slice(0,first)+entry+source.slice(last);
          const include = "require('./compact-game-entry.cases.js');";
          if (!source.includes(include)) source+='\n\n// Guard the actual entry layout at narrow and large iPhone sizes.\n'+include+'\n';
          fs.writeFileSync(smoke,source);
          let worker = fs.readFileSync('service-worker.js','utf8');
          const cache = worker.match(/earnly-arcade-v1\.1-cache-v(\d+)/);
          assert(cache, 'Expected v1.1 cache name missing');
          worker = worker.replace(cache[0],'earnly-arcade-v1.1-cache-v'+(Number(cache[1])+1));
          assert(worker.includes('const CORE_ASSETS = ['));
          if (!worker.includes("'./compact-game-entry.css'")) worker = worker.replace('const CORE_ASSETS = [',"const CORE_ASSETS = [\n  './compact-game-entry.css',");
          fs.writeFileSync('service-worker.js',worker);
          if (fs.existsSync('www/service-worker.js')) fs.writeFileSync('www/service-worker.js',worker);
          console.log('Web/iOS assets synced; cache refreshed without touching account data or balances.');
          NODE
      - name: Install test dependencies
        run: |
          npm install > /tmp/entry-npm.log 2>&1 || { tail -60 /tmp/entry-npm.log; exit 1; }
          npx playwright install --with-deps chromium webkit > /tmp/entry-browsers.log 2>&1 || { tail -60 /tmp/entry-browsers.log; exit 1; }
      - name: Verify both browsers and report actual viewport geometry
        run: |
          set +e
          npx playwright test tests/smoke.spec.js --grep 'compact entry:|Block Drop ready screen' --project=desktop-chromium --project=mobile-webkit --reporter=json > /tmp/entry-results.json 2>/tmp/entry-server.log
          code=$?
          node <<'NODE'
          const fs=require('node:fs');
          let report;
          try { report=JSON.parse(fs.readFileSync('/tmp/entry-results.json','utf8')); }
          catch(e) { console.log(fs.readFileSync('/tmp/entry-results.json','utf8').slice(-6000)); process.exit(1); }
          console.log('ENTRY_TEST_TOTALS',JSON.stringify(report.stats));
          function visit(suite) {
            for(const spec of suite.specs||[]) for(const test of spec.tests||[]) {
              console.log(test.projectName,spec.title,test.status);
              for(const result of test.results||[]) {
                for(const out of result.stdout||[]) if(out.text) console.log(out.text.trim());
                for(const error of result.errors||[]) console.log(error.message||error);
              }
            }
            for(const child of suite.suites||[]) visit(child);
          }
          for(const suite of report.suites||[]) visit(suite);
          for(const error of report.errors||[]) console.log(error.message||error);
          NODE
          exit $code
      - name: Save real rendered screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-game-entry-browser-evidence
          path: |
            test-results/
            /tmp/entry-results.json
          retention-days: 7
      - name: Commit validated layout only to the isolated development branch
        run: |
          test "$GITHUB_REF_NAME" = 'fix/compact-game-entry-20260926'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blockdrop.html neonmaze.html www/blockdrop.html www/neonmaze.html www/compact-game-entry.css service-worker.js tests/smoke.spec.js
          if test -f www/service-worker.js; then git add www/service-worker.js; fi
          git diff --cached --stat
          git commit -m 'Fix crowded mobile entry screens; preserve approved gameplay'
          git push origin HEAD:refs/heads/fix/compact-game-entry-20260926
