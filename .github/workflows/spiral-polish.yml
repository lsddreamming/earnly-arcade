name: Spiral Drop polish QA
on:
  pull_request:
    paths: ['spiral-drop*', 'www/spiral-drop*', 'tests/spiral-drop.spec.js', '.github/workflows/spiral-polish.yml']
  push:
    branches: [main]
    paths: ['spiral-drop*', 'www/spiral-drop*', 'tests/spiral-drop.spec.js', '.github/workflows/spiral-polish.yml']
  workflow_dispatch:
jobs:
  polish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            project: desktop-chromium
            browser: chromium
          - os: macos-15-intel
            project: mobile-webkit
            browser: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node --test scripts/test-spiral-drop-engine.cjs
      - run: npx playwright test tests/spiral-drop.spec.js --project=${{ matrix.project }} --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spiral-polish-${{ matrix.project }}
          path: test-results/
