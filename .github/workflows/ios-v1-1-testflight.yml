name: Earnly 1.1 TestFlight

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ios-v1-1-testflight.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: earnly-1.1-testflight
  cancel-in-progress: false

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for exact-source QA, native build and Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const required = ['Earnly automated tests', 'Earnly iOS native build', 'Publish Earnly Pages after QA'];
            for (let attempt = 0; attempt < 48; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunsForRepo({...context.repo, head_sha: context.sha, per_page: 100});
              const runs = required.map(name => data.workflow_runs.find(r => r.name === name && r.head_branch === 'main' && ['push','workflow_run'].includes(r.event)));
              const failed = runs.find(r => r?.status === 'completed' && r.conclusion !== 'success');
              if (failed) throw new Error(`${failed.name}: ${failed.conclusion}. Upload blocked.`);
              if (runs.every(r => r?.status === 'completed' && r.conclusion === 'success')) {
                const {data: main} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
                if (main.commit.sha !== context.sha) throw new Error('Newer main commit exists. Build a fresh candidate.');
                core.info('All release gates passed for ' + context.sha);
                return;
              }
              core.info(required.map((n,i) => `${n}: ${runs[i]?.status || 'waiting'}`).join(' | '));
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            throw new Error('Release checks did not finish in time. Upload blocked.');

  archive:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      BUILD_ADMOB_MODE: live
      EARNLY_ADMOB_TEST_MODE: '0'
      EARNLY_IOS_MARKETING_VERSION: '1.1'
      TEAM_ID: 27R798NCMZ
      BUNDLE_ID: com.earnly.arcade
      PROFILE_NAME: Earnly Arcade App Store
      KEYCHAIN_PASSWORD: earnly-ci-keychain
    steps:
      - uses: actions/checkout@v4

      - name: Set unique 1.1 build number
        run: echo "EARNLY_IOS_BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run release contract tests
        run: npx playwright test tests/quality-contract.spec.js --config=playwright.contract.config.js

      - name: Build native web bundle
        run: npm run native:web

      - name: Verify account deletion is packaged for review
        run: |
          grep -q 'id="cloudDeleteButton"' www/account.html
          grep -q 'Delete My Account' www/account.html
          grep -q "functions.invoke('delete-account'" www/cloud.js
          grep -q 'cannot be redeemed or withdrawn in this version' www/account.html

      - name: Generate iOS project
        run: |
          rm -rf ios build
          npx cap add ios
          npx cap sync ios
          node scripts/configure-ios.mjs
          cmp ios-icon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png

      - name: Verify native release mode
        run: |
          if [ "$BUILD_ADMOB_MODE" = "live" ]; then
            EXPECTED_APP_ID="ca-app-pub-8864401806510610~7658950353"
            EXPECTED_TEST_MODE="false"
          else
            EXPECTED_APP_ID="ca-app-pub-3940256099942544~1458002511"
            EXPECTED_TEST_MODE="true"
          fi
          grep -q "<string>$EXPECTED_APP_ID</string>" ios/App/App/Info.plist
          if grep -q "NSUserTrackingUsageDescription" ios/App/App/Info.plist; then
            echo "Unexpected ATT usage text in non-personalized v1.1 build"
            exit 1
          fi
          grep -Eq "TEST_MODE[[:space:]]*=[[:space:]]*$EXPECTED_TEST_MODE" www/native-ads.js
          SK_COUNT=$(grep -c "<key>SKAdNetworkIdentifier</key>" ios/App/App/Info.plist)
          if [ "$SK_COUNT" -lt 50 ]; then
            echo "Expected at least 50 SKAdNetwork IDs; found $SK_COUNT"
            exit 1
          fi
          echo "Verified $BUILD_ADMOB_MODE native ad mode with $SK_COUNT SKAdNetwork IDs."

      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$P12_PASSWORD"
          CERTIFICATE_PATH="$RUNNER_TEMP/earnly-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/earnly-signing.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$PROVISIONING_PROFILE_BASE64"
          PROFILE_PATH="$RUNNER_TEMP/earnly.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/earnly-profile.plist"

          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          PROFILE_BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PROFILE_PLIST")
          PROFILE_NAME_FOUND=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")

          echo "Provisioning profile: $PROFILE_NAME_FOUND"
          echo "Application identifier: $PROFILE_BUNDLE"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          cp "$PROFILE_PATH" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Archive Earnly Arcade
        run: |
          mkdir -p build
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/EarnlyArcade.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            MARKETING_VERSION=1.1 \
            CURRENT_PROJECT_VERSION="$EARNLY_IOS_BUILD_NUMBER" \
            archive

      - name: Verify 1.1 archive version and icon
        run: |
          APP_PLIST="build/EarnlyArcade.xcarchive/Products/Applications/App.app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST")" = "1.1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")" = "$EARNLY_IOS_BUILD_NUMBER"
          test -s build/EarnlyArcade.xcarchive/Products/Applications/App.app/Assets.car

      - name: Create App Store export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Export signed IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/EarnlyArcade.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: earnly-arcade-ios-1.1-${{ github.run_number }}
          path: build/export/*.ipa
          retention-days: 7

      - name: Upload archive diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: earnly-ios-1.1-signing-diagnostics
          path: |
            build/
            ios/App/App.xcodeproj/project.pbxproj
          retention-days: 7

  upload:
    needs: [release-gates, archive]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Download this run's signed 1.1 package
        uses: actions/download-artifact@v4
        with:
          name: earnly-arcade-ios-1.1-${{ github.run_number }}
          path: ipa
      - name: Verify version before upload
        run: |
          test -f ipa/App.ipa
          unzip -p ipa/App.ipa Payload/App.app/Info.plist > "$RUNNER_TEMP/upload-info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/upload-info.plist")" = '1.1'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/upload-info.plist")" = "$((100 + GITHUB_RUN_NUMBER))"
          shasum -a 256 ipa/App.ipa
      - name: Confirm candidate is still current
        uses: actions/github-script@v7
        with:
          script: |
            const {data: main} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (main.commit.sha !== context.sha) throw new Error('Newer main commit exists; upload blocked.');
      - name: Upload to App Store Connect
        env:
          ASC_APPLE_ID: ${{ secrets.ASC_APPLE_ID }}
          ASC_UPLOAD_PASSWORD: ${{ secrets.ASC_APP_SPECIFIC_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
        run: |
          if [ -n "$ASC_APPLE_ID" ] && [ -n "$ASC_UPLOAD_PASSWORD" ]; then
            xcrun altool --upload-app \
              --file "$PWD/ipa/App.ipa" \
              --type ios \
              --username "$ASC_APPLE_ID" \
              --password '@env:ASC_UPLOAD_PASSWORD'
          else
            test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER" && test -n "$ASC_PRIVATE_KEY"
            key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
            umask 077
            printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
            xcrun altool --upload-app \
              --file "$PWD/ipa/App.ipa" \
              --type ios \
              --apiKey "$ASC_KEY_ID" \
              --apiIssuer "$ASC_ISSUER" \
              --p8-file-path "$key_path"
          fi
