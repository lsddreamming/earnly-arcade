name: Earnly 1.1 TestFlight RC1

on:
  push:
    branches:
      - release/1.1-rc1
    paths:
      - '.github/workflows/testflight-1_1_rc.yml'

permissions:
  contents: read

jobs:
  build-test-upload:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      RC_BASE_SHA: 533075205110359215d5415ce4f53c01fe712a86
      EARNLY_ADMOB_TEST_MODE: '0'
      EARNLY_IOS_MARKETING_VERSION: '1.1'
      EARNLY_IOS_BUILD_NUMBER: '3'
      TEAM_ID: 27R798NCMZ
      BUNDLE_ID: com.earnly.arcade
      PROFILE_NAME: Earnly Arcade App Store
      KEYCHAIN_PASSWORD: earnly-ci-keychain

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify RC source is the green baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RC_BASE_SHA" HEAD
          CHANGED="$(git diff --name-only "$RC_BASE_SHA"..HEAD)"
          echo "$CHANGED"
          UNEXPECTED="$(printf '%s\n' "$CHANGED" | grep -Ev '^(\.github/workflows/testflight-1_1_rc\.yml|APP_STORE_V1_1_RELEASE\.md|package\.json)$' || true)"
          if [ -n "$UNEXPECTED" ]; then
            echo "Unexpected player-facing/code changes in RC branch:"
            echo "$UNEXPECTED"
            exit 1
          fi
          echo "RC app source matches green baseline $RC_BASE_SHA"

      - name: Verify green baseline workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for RUN_ID in 36352907329 36352907334 36353287806; do
            CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion')"
            HEAD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.head_sha')"
            echo "Run $RUN_ID · $CONCLUSION · $HEAD_SHA"
            test "$CONCLUSION" = "success"
            test "$HEAD_SHA" = "$RC_BASE_SHA"
          done
          echo "Verified baseline QA, native iOS build, and QA-gated Pages deployment."

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install QA browsers
        run: npx playwright install chromium webkit

      - name: Run release contracts
        run: npx playwright test -c playwright.contract.config.js

      - name: Start local QA server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/earnly-http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/earnly-http.pid"
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then
              echo "QA server is ready"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/earnly-http.log" || true
          exit 1

      - name: Recheck first-time onboarding on desktop and iPhone
        run: |
          npx playwright test tests/smoke.spec.js \
            --project=desktop-chromium \
            --project=mobile-webkit \
            --grep 'first-visit onboarding|first visit onboarding|first completed run'

      - name: Build native web bundle
        run: npm run native:web

      - name: Verify onboarding and launch-critical assets are packaged
        run: |
          grep -q 'Welcome to Earnly Arcade' www/arcade.js
          grep -q 'Play Tap Rush' www/arcade.js
          grep -q 'result-first-run' www/arcade.js
          grep -q 'id="cloudDeleteButton"' www/account.html
          grep -q 'Delete My Account' www/account.html
          grep -q "functions.invoke('delete-account'" www/cloud.js
          grep -q 'cannot be redeemed or withdrawn in this version' www/account.html

      - name: Generate iOS release project
        run: |
          rm -rf ios build
          npx cap add ios
          npx cap sync ios
          node scripts/configure-ios.mjs

      - name: Verify iOS 1.1 build 3 and live ad mode
        run: |
          grep -q 'MARKETING_VERSION = 1.1;' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'CURRENT_PROJECT_VERSION = 3;' ios/App/App.xcodeproj/project.pbxproj
          grep -q '<string>ca-app-pub-8864401806510610~7658950353</string>' ios/App/App/Info.plist
          if grep -q 'NSUserTrackingUsageDescription' ios/App/App/Info.plist; then
            echo 'Unexpected ATT usage text in non-personalized release build'
            exit 1
          fi
          grep -Eq 'TEST_MODE[[:space:]]*=[[:space:]]*false' www/native-ads.js
          SK_COUNT=$(grep -c '<key>SKAdNetworkIdentifier</key>' ios/App/App/Info.plist)
          test "$SK_COUNT" -ge 50
          echo "Verified iOS 1.1 (3), live AdMob, $SK_COUNT SKAdNetwork IDs"

      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$P12_PASSWORD"
          CERTIFICATE_PATH="$RUNNER_TEMP/earnly-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/earnly-signing.keychain-db"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$PROVISIONING_PROFILE_BASE64"
          PROFILE_PATH="$RUNNER_TEMP/earnly.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/earnly-profile.plist"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          PROFILE_NAME_FOUND=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          echo "Provisioning profile: $PROFILE_NAME_FOUND"
          echo "Application identifier: $PROFILE_BUNDLE"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          cp "$PROFILE_PATH" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Archive Earnly Arcade 1.1 RC1
        run: |
          mkdir -p build
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/EarnlyArcade.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            MARKETING_VERSION="$EARNLY_IOS_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$EARNLY_IOS_BUILD_NUMBER" \
            archive

      - name: Create App Store export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Export signed IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/EarnlyArcade.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Verify signed IPA contents
        run: |
          test -f build/export/App.ipa
          unzip -p build/export/App.ipa Payload/App.app/public/arcade.js | grep -q 'Welcome to Earnly Arcade'
          unzip -p build/export/App.ipa Payload/App.app/public/arcade.js | grep -q 'Play Tap Rush'
          unzip -p build/export/App.ipa Payload/App.app/public/account.html | grep -q 'id="cloudDeleteButton"'
          shasum -a 256 build/export/App.ipa | tee build/export/App.ipa.sha256

      - name: Upload signed RC artifact
        uses: actions/upload-artifact@v4
        with:
          name: earnly-arcade-ios-1.1-build-3-rc1
          path: |
            build/export/App.ipa
            build/export/App.ipa.sha256
          retention-days: 14

      - name: Upload build 3 to App Store Connect / TestFlight
        env:
          ASC_APPLE_ID: ${{ secrets.ASC_APPLE_ID }}
          ASC_UPLOAD_PASSWORD: ${{ secrets.ASC_APP_SPECIFIC_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${ASC_APPLE_ID:-}" ] && [ -n "${ASC_UPLOAD_PASSWORD:-}" ]; then
            xcrun altool --upload-app \
              --file "$PWD/build/export/App.ipa" \
              --type ios \
              --username "$ASC_APPLE_ID" \
              --password '@env:ASC_UPLOAD_PASSWORD'
          else
            test -n "${ASC_KEY_ID:-}"
            test -n "${ASC_ISSUER:-}"
            test -n "${ASC_PRIVATE_KEY:-}"
            key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
            umask 077
            printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
            xcrun altool --upload-app \
              --file "$PWD/build/export/App.ipa" \
              --type ios \
              --apiKey "$ASC_KEY_ID" \
              --apiIssuer "$ASC_ISSUER" \
              --p8-file-path "$key_path"
          fi

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: earnly-1.1-rc1-diagnostics
          path: |
            playwright-report/
            build/
            ios/App/App.xcodeproj/project.pbxproj
          retention-days: 7
