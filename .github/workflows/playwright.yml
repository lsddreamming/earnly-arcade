name: Earnly automated tests

on:
  push:
    branches: [main, feature/arcade-shop-2]
  pull_request:
  workflow_dispatch:

concurrency:
  group: earnly-playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulation-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Verify Apple certificates on the deployed Deno generation
        run: npm exec --yes --package=deno@2.1.4 -- deno test --no-check --allow-read --allow-env scripts/test-apple-x509.ts
      - name: Validate payment ledger and API boundaries
        run: node scripts/test-neon-slice-client.mjs && node scripts/test-neon-slice-rewards.mjs && node --experimental-strip-types --test scripts/test-neon-slice-handler.ts && node scripts/test-bubble-pop-rewards.mjs && node --experimental-strip-types --test scripts/test-bubble-pop-handler.ts && node scripts/test-activity.mjs && node --experimental-strip-types --test scripts/test-activity-handler.ts && node --test scripts/test-native-ads.mjs && node --experimental-strip-types --test scripts/test-ad-bonus.ts && node scripts/test-ad-bonus-ledger.mjs && node scripts/test-progressive-ad-rewards.mjs && node scripts/test-balanced-economy.mjs && node scripts/test-arcade-chat.mjs && node scripts/test-jungle-rewards.mjs && node scripts/test-kart-rewards.mjs && node scripts/test-game-shop-loop.mjs && npm run test:commerce && node scripts/test-coin-staging.mjs && node scripts/test-avatar-staging.mjs && node --test scripts/test-native-environment.mjs && node --test scripts/test-ios-release-gates.mjs && node --test scripts/test-ios-export-compliance.mjs
      - name: Verify reachable Bounce Run waves
        run: node --test scripts/test-bounce-run.cjs scripts/test-star-defender-flight.cjs scripts/test-coin-catch-rules.cjs scripts/test-safe-cracker-engine.cjs scripts/test-spiral-drop-engine.cjs scripts/test-perfect-drop-engine.cjs scripts/test-traffic-escape-engine.cjs
      - name: Run simulations and source contracts once
        run: npx playwright test tests/game-stress.spec.js tests/bubble-pop-campaign.spec.js tests/quality-contract.spec.js --project=desktop-chromium
      - name: Upload simulation failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-simulations
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  smoke:
    name: smoke (${{ matrix.project }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    # Include browser installation and the growing regression suite, including
    # the dedicated Spiral Drop and Perfect Drop checks on slower WebKit hosts.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-chromium
            browser: chromium
            os: ubuntu-latest
            shard: 1/1
          - project: mobile-webkit
            browser: webkit
            os: macos-latest
            shard: 1/3
            artifact_suffix: -1
          - project: mobile-webkit
            browser: webkit
            os: macos-latest
            shard: 2/3
            artifact_suffix: -2
          - project: mobile-webkit
            browser: webkit
            os: macos-latest
            shard: 3/3
            artifact_suffix: -3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install Chromium + Linux deps
        if: matrix.project == 'desktop-chromium'
        run: npx playwright install --with-deps chromium
      - name: Install WebKit on macOS
        if: matrix.project == 'mobile-webkit'
        run: npx playwright install webkit
      - name: Verify first-screen catalog, retries and controls
        run: npx playwright test tests/mobile-density.spec.js tests/daily-results.spec.js tests/neonbreach.spec.js tests/smoke.spec.js --project=${{ matrix.project }} --grep 'mobile catalog shows Crystal Command|catalog badges|catalog puts|website empty-play|native empty-play|Snake result explains|Neon Breach shows|Help pauses|First movement hints'
      - name: Verify Bubble Pop public release
        run: npx playwright test tests/bubble-pop.spec.js tests/bubble-pop-rewards.spec.js --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - name: Verify rewarded continues
        run: npx playwright test tests/rewarded-continue.spec.js tests/daily-ad-bonus.spec.js --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      # Turbo Kart is retired from the catalog. Its archived browser suite
      # remains in tests/turbo-kart.spec.js for explicit maintenance runs.
      - name: Verify Bounce Run physics and phone controls
        run: npx playwright test tests/bounce-run.spec.js --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - name: Verify Star Defender combat and flight goals
        run: npx playwright test tests/star-defender.spec.js --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - name: Upload Star Defender previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-defender-previews-${{ matrix.project }}${{ matrix.artifact_suffix }}
          path: test-results/**/star-defender*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Bounce Run previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounce-run-previews-${{ matrix.project }}${{ matrix.artifact_suffix }}
          path: test-results/**/bounce-run*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify Coin Catch feedback and controls
        run: npx playwright test tests/smoke.spec.js tests/coin-catch-polish.spec.js --grep 'Coin Catch' --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - name: Upload Coin Catch phone previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coin-catch-previews-${{ matrix.project }}${{ matrix.artifact_suffix }}
          path: test-results/**/coin-catch*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify Safe Cracker vaults, timing and reward discovery
        run: npx playwright test tests/safe-cracker.spec.js --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - name: Upload Safe Cracker previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-cracker-previews-${{ matrix.project }}${{ matrix.artifact_suffix }}
          path: test-results/**/safe-cracker*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify Spiral Drop descent, steering and rewards
        run: npx playwright test tests/spiral-drop.spec.js --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - name: Upload Spiral Drop previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spiral-drop-previews-${{ matrix.project }}${{ matrix.artifact_suffix }}
          path: test-results/**/spiral-drop*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify Perfect Drop timing, input and rewards
        run: npx playwright test tests/perfect-drop.spec.js --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - name: Upload Perfect Drop previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perfect-drop-previews-${{ matrix.project }}${{ matrix.artifact_suffix }}
          path: test-results/**/perfect-drop*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify Traffic Escape roads, timing and controls
        run: npx playwright test tests/traffic-escape.spec.js --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - name: Upload Traffic Escape previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traffic-escape-previews-${{ matrix.project }}${{ matrix.artifact_suffix }}
          path: test-results/**/traffic-escape*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify World controls
        run: npx playwright test tests/world.spec.js tests/world-social.spec.js tests/world-onboarding.spec.js tests/world-animals.spec.js tests/world-ai-residents.spec.js tests/world-pets.spec.js tests/world-bathroom.spec.js tests/world-playroom.spec.js tests/world-halloween.spec.js tests/world-decor-polish.spec.js --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - name: Upload World collection previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-collections-${{ matrix.project }}${{ matrix.artifact_suffix }}
          path: test-results/world-collection-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify shop previews and purchases
        run: npx playwright test tests/shop-two.spec.js tests/shopfront.spec.js --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - name: Upload VIP showcase previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vip-showcase-${{ matrix.project }}${{ matrix.artifact_suffix }}
          path: test-results/vip-showcase-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Run smoke suite
        run: npx playwright test tests/tower-lifetime.spec.js tests/neon-slice.spec.js tests/owner.spec.js tests/apple-coins.spec.js tests/coin-shop.spec.js tests/arcade-chat.spec.js tests/account-surfaces.spec.js tests/coin-sandbox.spec.js tests/avatar-studio.spec.js tests/avatar-shop-finish.spec.js tests/smoke.spec.js tests/daily-results.spec.js tests/page-polish.spec.js tests/mobile-density.spec.js tests/neonbreach.spec.js tests/neondrift.spec.js tests/dodger-style.spec.js tests/merge-rush.spec.js tests/taprush-polish.spec.js tests/junglehopper-polish.spec.js tests/crystal-command.spec.js tests/crystal-relay.spec.js tests/crystal-factions.spec.js --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - name: Upload smoke failure report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}${{ matrix.artifact_suffix }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload Neon Breach viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neonbreach-preview-${{ matrix.project }}${{ matrix.artifact_suffix }}
          path: test-results/neonbreach-*.png
          if-no-files-found: ignore
          retention-days: 7
