name: Earnly signed iOS build
# Push-triggered runs validate the App Store 1.0 source. Explicit [live] commits use production AdMob IDs; all other pushes stay in test mode.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-signed-build.yml'
  workflow_dispatch:
    inputs:
      admob_mode:
        description: "AdMob mode for this build"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - live

jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      BUILD_ADMOB_MODE: ${{ (github.event_name == 'workflow_dispatch' && inputs.admob_mode) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live]') && 'live') || 'test' }}
      EARNLY_ADMOB_TEST_MODE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.admob_mode == 'live') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live]'))) && '0' || '1' }}
      TEAM_ID: 27R798NCMZ
      BUNDLE_ID: com.earnly.arcade
      PROFILE_NAME: Earnly Arcade App Store
      KEYCHAIN_PASSWORD: earnly-ci-keychain

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run release contract tests
        run: npx playwright test tests/quality-contract.spec.js --config=playwright.contract.config.js

      - name: Build native web bundle
        run: npm run native:web

      - name: Generate iOS project
        run: |
          rm -rf ios build
          npx cap add ios
          npx cap sync ios
          node scripts/configure-ios.mjs

      - name: Verify native release mode
        run: |
          if [ "$BUILD_ADMOB_MODE" = "live" ]; then
            EXPECTED_APP_ID="ca-app-pub-8864401806510610~7658950353"
            EXPECTED_TEST_MODE="false"
          else
            EXPECTED_APP_ID="ca-app-pub-3940256099942544~1458002511"
            EXPECTED_TEST_MODE="true"
          fi
          grep -q "<string>$EXPECTED_APP_ID</string>" ios/App/App/Info.plist
          if grep -q "NSUserTrackingUsageDescription" ios/App/App/Info.plist; then
            echo "Unexpected ATT usage text in non-personalized v1.0 build"
            exit 1
          fi
          grep -Eq "TEST_MODE[[:space:]]*=[[:space:]]*$EXPECTED_TEST_MODE" www/native-ads.js
          SK_COUNT=$(grep -c "<key>SKAdNetworkIdentifier</key>" ios/App/App/Info.plist)
          if [ "$SK_COUNT" -lt 50 ]; then
            echo "Expected at least 50 SKAdNetwork IDs; found $SK_COUNT"
            exit 1
          fi
          echo "Verified $BUILD_ADMOB_MODE native ad mode with $SK_COUNT SKAdNetwork IDs."

      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$P12_PASSWORD"
          CERTIFICATE_PATH="$RUNNER_TEMP/earnly-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/earnly-signing.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$PROVISIONING_PROFILE_BASE64"
          PROFILE_PATH="$RUNNER_TEMP/earnly.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/earnly-profile.plist"

          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          PROFILE_BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PROFILE_PLIST")
          PROFILE_NAME_FOUND=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")

          echo "Provisioning profile: $PROFILE_NAME_FOUND"
          echo "Application identifier: $PROFILE_BUNDLE"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          cp "$PROFILE_PATH" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Archive Earnly Arcade
        run: |
          mkdir -p build
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/EarnlyArcade.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            MARKETING_VERSION=1.0 \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Create App Store export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Export signed IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/EarnlyArcade.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: earnly-arcade-ios-signed-${{ env.BUILD_ADMOB_MODE }}
          path: build/export/*.ipa
          retention-days: 7

      - name: Upload archive diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: earnly-ios-signing-diagnostics
          path: |
            build/
            ios/App/App.xcodeproj/project.pbxproj
          retention-days: 7
