name: Bubble Pop release checks
on:
  pull_request:
    paths: ['web-ads.js', 'www/web-ads.js', 'arcade.js', 'www/arcade.js', 'tests/web-ads.spec.js', 'bubble-pop*', 'www/bubble-pop*', 'daily-ad-bonus.js', 'www/daily-ad-bonus.js', 'earn-coins.css', 'www/earn-coins.css', 'rewards.html', 'www/rewards.html', 'tests/bubble-pop*.spec.js', 'tests/daily-ad-*.spec.js', '.github/workflows/bubble-pop-preview.yml']
  push:
    branches: [main]
    paths: ['web-ads.js', 'www/web-ads.js', 'arcade.js', 'www/arcade.js', 'tests/web-ads.spec.js', 'bubble-pop*', 'www/bubble-pop*', 'daily-ad-bonus.js', 'www/daily-ad-bonus.js', 'earn-coins.css', 'www/earn-coins.css', 'rewards.html', 'www/rewards.html', 'tests/bubble-pop*.spec.js', 'tests/daily-ad-*.spec.js', '.github/workflows/bubble-pop-preview.yml']
jobs:
  preview:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            project: desktop-chromium
            browser: chromium
          - os: macos-latest
            project: mobile-webkit
            browser: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify server replay and wallet boundaries
        run: node scripts/test-bubble-pop-rewards.mjs && node --experimental-strip-types --test scripts/test-bubble-pop-handler.ts
      - name: Verify progression, reward discovery and receipt lifecycle
        run: npx playwright test tests/bubble-pop.spec.js tests/bubble-pop-rewards.spec.js tests/bubble-pop-campaign.spec.js tests/daily-ad-bonus.spec.js tests/daily-ad-discovery.spec.js tests/web-ads.spec.js tests/rewarded-continue.spec.js --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bubble-pop-${{ matrix.project }}
          path: test-results/
