<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes">
  <title>Neon Maze · Earnly Arcade</title>
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="earnly-icon.svg" type="image/svg+xml">

  <style>
    body.maze-page{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    .maze-page .maze-board{display:block;width:min(94vw,390px,calc((100dvh - 255px)*.79));height:auto;margin:8px auto;border:2px solid #415eaa;border-radius:18px;background:#080c21;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 0 25px #365ad838}
    .maze-page .maze-controls{display:grid;grid-template-columns:repeat(3,60px);gap:4px;justify-content:center;margin:0 auto 4px}
    .maze-page .maze-controls button{height:44px;padding:4px;border-radius:12px;font-size:20px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
    .maze-page .maze-controls button:first-child{grid-column:2}.maze-page .maze-controls button:nth-child(2){grid-column:1}.maze-page .maze-controls button:nth-child(3){grid-column:2}.maze-page .maze-controls button:nth-child(4){grid-column:3}
    .maze-page .page-header{padding:12px;margin:5px 0 7px}.maze-page .game-title-status-row h1{font-size:clamp(22px,6vw,30px)}
    .maze-page .game-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.maze-page .meta-pill{min-width:0;padding:7px 3px;text-align:center;font-size:11px}
    /* The shared touch stylesheet hides #startButton on coarse-pointer devices.
       Neon Maze needs a real, always-visible iPhone start control. */
    .maze-page #startButton{
      display:block!important;width:min(94vw,390px)!important;margin:8px auto!important;
      min-height:54px!important;font-size:16px!important;font-weight:900!important;
      touch-action:manipulation!important;-webkit-tap-highlight-color:transparent;
      position:relative!important;z-index:60!important;
    }
    .maze-page .maze-tip{color:#a9bbd6;text-align:center;font-size:11px;margin:6px auto}
    .maze-page.game-active .topbar,.maze-page.game-active #startButton,.maze-page.game-active #arcadeBottomNav,.maze-page.game-active .maze-tip,.maze-page.game-active .back-games,.maze-page.game-active .compact-leaderboard-card,.maze-page.game-active .game-guide-strip,.maze-page.game-active .game-guide-more{display:none!important}
    .maze-page.game-active .page-header{
      display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;
      align-items:center!important;gap:4px 6px!important;padding:6px 8px!important;margin:0!important
    }
    .maze-page.game-active .game-title-status-row{grid-column:1!important;grid-row:1!important;justify-content:flex-start!important;gap:6px!important;margin:0!important}
    .maze-page.game-active .game-title-status-row h1{font-size:18px!important;line-height:1.05!important;white-space:nowrap!important;margin:0!important}
    .maze-page.game-active .title-status{padding:4px 7px!important;font-size:10px!important}
    .maze-page.game-active #earnlyPauseButton{grid-column:2!important;grid-row:1!important;min-width:72px!important;min-height:30px!important;margin:0!important;padding:5px 8px!important;font-size:11px!important}
    .maze-page.game-active .game-meta{grid-column:1/-1!important;grid-row:2!important;margin:0!important;gap:4px!important}
    .maze-page.game-active .meta-pill{padding:5px 2px!important;min-height:0!important;font-size:10px!important}
    .maze-page.game-active .maze-board{width:min(94vw,390px,calc((100dvh - 148px)*.79))!important;margin:3px auto!important}
    .maze-page.game-active main.container{padding-bottom:8px}
  </style>
  <link rel="stylesheet" href="compact-game-entry.css?v=1">
</head>
<body class="maze-page"><main class="container">
  <div class="topbar"><a class="brand" href="games.html">← Games</a><a class="balance-chip" href="rewards.html">🪙 <span id="balance">0</span></a></div>
  <header class="page-header"><div class="game-title-status-row"><h1>⚡ Neon Maze</h1><span class="game-status title-status" id="gameStatus">Ready</span></div>
    <div class="game-meta"><span class="meta-pill">Cells: <span id="chips">0</span></span><span class="meta-pill">❤️ <span id="lives">3</span></span><span class="meta-pill">⏱️ <span id="time">90</span>s</span><span class="meta-pill">🎟️ <span id="plays">0</span></span></div></header>
  <button class="green wide" id="startButton" type="button" aria-label="Tap to start Neon Maze">▶ TAP TO START</button>
  <p class="entry-quick-tip">Swipe to steer · clear a sector for +35s</p>
  <canvas id="game" class="maze-board touch-surface" width="330" height="390" aria-label="Neon Maze energy-cell grid with sentry drones"></canvas>
  <div class="maze-controls" aria-label="Move through maze"><button type="button" data-dir="up" aria-label="Up">⬆️</button><button type="button" data-dir="left" aria-label="Left">⬅️</button><button type="button" data-dir="down" aria-label="Down">⬇️</button><button type="button" data-dir="right" aria-label="Right">➡️</button></div>
  <p class="maze-tip">Swipe anywhere or use the arrows · collect energy cells · evade sentry drones</p>
  <a class="button wide secondary back-games" href="games.html">← Back to Games</a>
  </main><script src="arcade.js"></script><script>
  (()=>{
    const c=document.getElementById('game'),ctx=c.getContext('2d'),E=Object.fromEntries(['chips','lives','time','plays','balance','gameStatus','startButton'].map(id=>[id,document.getElementById(id)]));
    const map=['###########','#.........#','#.###.###.#','#...#.#...#','###.#.#.###','#...#.....#','#.#####.#.#','#.....#.#.#','#.###.#.#.#','#.#.....#.#','#.#.#####.#','#.........#','###########'];
    const START_TIME=90,SECTOR_BONUS=35,MAX_TIME=120,S=30,dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};let chips=new Set(),player={x:1,y:1},sentinels=[],lives=3,collected=0,wave=1,elapsed=0,timeLeft=START_TIME,moveClock=0,sentryClock=0,held='',steer='',running=false,starting=false,paused=false,last=0,raf=0,startedAt=0,pauseTotal=0,pausedAt=0,touch=null,grace=0,pickupFlash=0,sectorFlash=0,hitFlash=0;
    Arcade.gameGuide({game:'neonMaze',surface:c,steps:[{icon:'👆',title:'Start',text:'Tap Play'},{icon:'↔️',title:'Control',text:'Swipe to steer'},{icon:'🔷',title:'Goal',text:'Clear sector after sector'}],overlayIcon:'⚡',overlayTitle:'Neon Maze',overlayText:'Swipe once to steer, then keep moving through the maze. Clear sectors to add time and keep the run alive.',replayTitle:'Play Again',tips:['Three sentry hits end the run.','Each cleared sector adds 35 seconds, up to a 120-second time bank.','Swipe to change direction, hold an arrow button, or use arrow keys / WASD.'],reward:'Earn up to 15 Arcade Coins per run.'});
    const id=(x,y)=>y*11+x,open=(x,y)=>map[y]?.[x]==='.',rnd=n=>Math.floor(Math.random()*n);
    function resetBoard(){chips=new Set();for(let y=1;y<12;y++)for(let x=1;x<10;x++)if(open(x,y))chips.add(id(x,y));player={x:1,y:1};chips.delete(id(1,1));sentinels=[{x:9,y:11,color:'#ff4fd8',accent:'#7c3aed'},{x:9,y:1,color:'#39e8ff',accent:'#2563eb'},...(wave>2?[{x:1,y:11,color:'#a78bfa',accent:'#ec4899'}]:[])];grace=1.4}
    function chrome(){E.chips.textContent=collected;E.lives.textContent=lives;E.time.textContent=Math.max(0,Math.ceil(timeLeft));E.plays.textContent=running&&!Arcade.remaining('neonMaze')?'Last':Arcade.remaining('neonMaze');E.balance.textContent=Arcade.number('points').toLocaleString()}
    function status(text,active=false){E.gameStatus.textContent=text;E.gameStatus.className='game-status title-status'+(active?' running':'');document.body.classList.toggle('game-active',active)}
    function roundRect(x,y,w,h,r){const rr=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath()}
    function drawCell(cx,cy){ctx.save();ctx.translate(cx,cy);ctx.rotate(Math.PI/4);ctx.shadowColor='#57f2ff';ctx.shadowBlur=10;ctx.fillStyle='#8bf5ff';ctx.fillRect(-3.5,-3.5,7,7);ctx.shadowBlur=0;ctx.fillStyle='#e8fdff';ctx.fillRect(-1.25,-1.25,2.5,2.5);ctx.restore()}
    function drawSentinel(g){
      const cx=g.x*S+15,cy=g.y*S+15;
      ctx.save();ctx.translate(cx,cy);ctx.shadowColor=g.color;ctx.shadowBlur=14;
      ctx.fillStyle=g.color;ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(11,0);ctx.lineTo(0,11);ctx.lineTo(-11,0);ctx.closePath();ctx.fill();
      ctx.shadowBlur=0;ctx.fillStyle=g.accent;ctx.fillRect(-16,-3,7,6);ctx.fillRect(9,-3,7,6);
      ctx.strokeStyle='#dffcff';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-12,-8);ctx.lineTo(-7,-4);ctx.moveTo(12,-8);ctx.lineTo(7,-4);ctx.stroke();
      ctx.fillStyle='#06142b';ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.fillRect(-2,-1,4,2);ctx.restore();
    }
    function drawCore(){
      const cx=player.x*S+15,cy=player.y*S+15;
      ctx.save();ctx.translate(cx,cy);ctx.shadowColor='#30f2d0';ctx.shadowBlur=18;
      ctx.strokeStyle='#53ffe2';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle='#0ee7c0';ctx.beginPath();ctx.arc(0,0,6.5,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;ctx.fillStyle='#d8fff8';ctx.beginPath();ctx.arc(-2,-2,2.2,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#37d8ff';ctx.lineWidth=2;for(const a of [0,Math.PI/2,Math.PI,Math.PI*1.5]){ctx.beginPath();ctx.moveTo(Math.cos(a)*12,Math.sin(a)*12);ctx.lineTo(Math.cos(a)*16,Math.sin(a)*16);ctx.stroke()}ctx.restore();
    }
    function draw(){
      const bg=ctx.createLinearGradient(0,0,330,390);bg.addColorStop(0,'#041225');bg.addColorStop(.55,'#071a33');bg.addColorStop(1,'#100b2d');ctx.fillStyle=bg;ctx.fillRect(0,0,330,390);
      ctx.strokeStyle='rgba(50,210,255,.08)';ctx.lineWidth=1;for(let x=15;x<330;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,390);ctx.stroke()}for(let y=15;y<390;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(330,y);ctx.stroke()}
      for(let y=0;y<13;y++)for(let x=0;x<11;x++){const px=x*S,py=y*S;if(map[y][x]==='#'){
        ctx.save();roundRect(px+2,py+2,26,26,6);ctx.fillStyle='#10294a';ctx.fill();ctx.strokeStyle='#245e86';ctx.lineWidth=1.2;ctx.stroke();
        ctx.strokeStyle='rgba(76,225,255,.28)';ctx.beginPath();ctx.moveTo(px+7,py+15);ctx.lineTo(px+14,py+15);ctx.lineTo(px+18,py+10);ctx.lineTo(px+23,py+10);ctx.stroke();ctx.restore();
      }else{
        ctx.fillStyle='rgba(5,24,48,.72)';ctx.fillRect(px+1,py+1,28,28);
        if(chips.has(id(x,y)))drawCell(px+15,py+15);
      }}
      for(const s of sentinels)drawSentinel(s);
      if(grace<=0||Math.floor(grace*8)%2===0)drawCore();
      if(pickupFlash>0){
        ctx.save();ctx.globalAlpha=Math.min(1,pickupFlash/.12);ctx.strokeStyle='#9ffcff';ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(player.x*S+15,player.y*S+15,12+(1-pickupFlash/.12)*10,0,Math.PI*2);ctx.stroke();ctx.restore();
      }
      if(hitFlash>0){
        ctx.save();ctx.globalAlpha=Math.min(.28,hitFlash);ctx.fillStyle='#ff477e';ctx.fillRect(0,0,c.width,c.height);ctx.restore();
      }
      if(sectorFlash>0){
        ctx.save();ctx.globalAlpha=Math.min(.88,sectorFlash/.8);ctx.fillStyle='rgba(8,20,48,.72)';ctx.fillRect(42,160,246,70);
        ctx.textAlign='center';ctx.fillStyle='#8ffcff';ctx.font='900 24px system-ui';ctx.fillText('SECTOR '+wave+'  +'+SECTOR_BONUS+'s',165,190);
        ctx.fillStyle='#d9fbff';ctx.font='700 12px system-ui';ctx.fillText('Sentries are getting smarter',165,211);ctx.restore();
      }
    }
    function collision(){if(grace>0)return;for(const g of sentinels)if(g.x===player.x&&g.y===player.y){lives--;grace=1.4;hitFlash=.32;held=steer='';player={x:1,y:1};chrome();Arcade.feedback('fail');if(lives<=0)finish();return}}
    function move(dir){if(!running||paused)return;const d=dirs[dir];if(!d)return;const x=player.x+d[0],y=player.y+d[1];if(!open(x,y))return;player={x,y};const tile=id(x,y);if(chips.delete(tile)){collected++;pickupFlash=.12;chrome();if(!chips.size){wave++;timeLeft=Math.min(MAX_TIME,timeLeft+SECTOR_BONUS);held=steer='';sectorFlash=.9;resetBoard();Arcade.feedback('success')}}collision();draw()}
    function sentryStep(){for(const g of sentinels){const options=Object.values(dirs).map(([dx,dy])=>({x:g.x+dx,y:g.y+dy})).filter(p=>open(p.x,p.y));if(!options.length)continue;options.sort((a,b)=>(Math.abs(a.x-player.x)+Math.abs(a.y-player.y))-(Math.abs(b.x-player.x)+Math.abs(b.y-player.y)));const choice=Math.random()<Math.min(.70,.34+(wave-1)*.07)?options[0]:options[rnd(options.length)];g.x=choice.x;g.y=choice.y}collision()}
    function loop(now){if(!running||paused)return;const dt=Math.min(.05,(now-last)/1000||0);last=now;elapsed+=dt;timeLeft=Math.max(0,timeLeft-dt);grace=Math.max(0,grace-dt);pickupFlash=Math.max(0,pickupFlash-dt);sectorFlash=Math.max(0,sectorFlash-dt);hitFlash=Math.max(0,hitFlash-dt);moveClock+=dt;sentryClock+=dt;const travel=held||steer;if(travel&&moveClock>.16){moveClock=0;move(travel)}if(sentryClock>Math.max(.24,.54-(wave-1)*.035)){sentryClock=0;sentryStep()}chrome();draw();if(timeLeft<=0)finish();if(running)raf=requestAnimationFrame(loop)}
    function finish(){if(!running)return;running=false;cancelAnimationFrame(raf);raf=0;held=steer='';touch=null;const seconds=Math.max(1,Math.round((performance.now()-startedAt-pauseTotal)/1000)),earned=Math.min(15,Math.floor(collected/6));Arcade.earn(earned,'Neon Maze',{kind:'game',game:'neonMaze',metric:collected,aux:wave});const result=Arcade.recordResult('neonMaze',collected);chrome();status('Run Over');E.startButton.textContent='▶ Play Again';Arcade.gameResult({icon:'⚡',title:'Neon Maze Run Over',scoreLabel:'ENERGY CELLS',score:collected,best:Arcade.best('neonMaze').display,coins:earned,result,playsLeft:Arcade.remaining('neonMaze'),game:'neonMaze',extra:['⏱️ Time played: '+seconds+'s','🤖 Sector reached: '+wave],onReplay:start,onMorePlays:()=>Arcade.out('neonMaze',chrome)});draw()}
    function start(){if(running||starting)return;starting=true;E.startButton.disabled=true;E.startButton.textContent='Starting…';if(!Arcade.consume('neonMaze')){starting=false;E.startButton.disabled=false;E.startButton.textContent='▶ TAP TO START';Arcade.out('neonMaze',chrome);return}collected=elapsed=moveClock=sentryClock=pauseTotal=pickupFlash=sectorFlash=hitFlash=0;timeLeft=START_TIME;lives=3;wave=1;held=steer='';resetBoard();chrome();status('Get Ready');draw();Arcade.countdown(()=>{starting=false;running=true;paused=false;E.startButton.disabled=false;last=startedAt=performance.now();status('Running',true);chrome();raf=requestAnimationFrame(loop)})}
    let heldPointer=null;
    const releaseButton=e=>{if(e.pointerId===heldPointer){held='';heldPointer=null}};
    const button=e=>{const dir=e.currentTarget.dataset.dir;if(running&&!paused){e.preventDefault();steer='';move(dir);held=dir;heldPointer=e.pointerId;moveClock=0}};
    document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',button));
    // The finger can leave the button before release, especially near the screen edge.
    document.addEventListener('pointerup',releaseButton);
    document.addEventListener('pointercancel',releaseButton);
    document.addEventListener('pointerdown',e=>{if(!running||Arcade.isProtectedGameControlTarget(e.target)||e.target.closest('[data-dir]'))return;touch={x:e.clientX,y:e.clientY,moved:false};e.preventDefault()},{passive:false});
    document.addEventListener('pointermove',e=>{if(!running||!touch)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;const dir=Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up';touch={x:e.clientX,y:e.clientY};if(steer!==dir){held='';steer=dir;move(dir);moveClock=0}e.preventDefault()},{passive:false});
    document.addEventListener('pointerup',()=>touch=null);document.addEventListener('pointercancel',()=>touch=null);
    document.addEventListener('keydown',e=>{if(Arcade.isProtectedGameControlTarget(e.target))return;const dir={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'}[e.key];if(dir&&running){e.preventDefault();steer='';if(held!==dir)move(dir);held=dir}else if((e.key==='Enter'||e.key===' ')&&!running&&!starting){e.preventDefault();start()}});
    document.addEventListener('keyup',e=>{const dir={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'}[e.key];if(held===dir)held=''});window.addEventListener('blur',()=>{held=steer='';heldPointer=null})
    Arcade.installPauseControl({isRunning:()=>running,pause:()=>{paused=true;pausedAt=performance.now();cancelAnimationFrame(raf);held=steer='';touch=null},resume:()=>{if(!paused)return;pauseTotal+=performance.now()-pausedAt;paused=false;last=performance.now();raf=requestAnimationFrame(loop)}});
    const startFromButton=event=>{event?.preventDefault?.();event?.stopPropagation?.();start()};
    E.startButton.addEventListener('pointerup',startFromButton);
    E.startButton.addEventListener('touchend',startFromButton,{passive:false});
    E.startButton.addEventListener('click',startFromButton);
    resetBoard();chrome();draw();
  })();
  </script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cloud.js"></script>
</body></html>
