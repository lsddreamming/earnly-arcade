<body class="lanerunner-page">
  <main class="container">
    <div class="topbar">
      <a class="brand" href="games.html">← Games</a>
      <a class="balance-chip" href="rewards.html">🪙 <span id="balance">0</span></a>
    </div>
    <header class="page-header">
      <h1>🏎️ Lane Runner</h1>
      <div class="game-meta"><span class="meta-pill">Time: <span id="time">0</span>s</span>
        <span class="meta-pill">Passed: <span id="passed">0</span></span>
        <span class="meta-pill">Reward: <span id="rewardPreview">0</span> 🪙</span>
        <span class="meta-pill"><span id="plays">0</span> plays left</span></div>
      <span class="game-status" id="gameStatus">Ready</span>
    </header>
    <button class="green wide" id="startButton" type="button">👆 Tap the Game to Start</button>
    <canvas class="lane-board touch-surface" id="game" width="360" height="520" aria-label="Lane Runner game board"></canvas>
    <div class="lane-control-zone" id="laneControlZone">↔️ Swipe anywhere here to change lanes</div>
    <a class="button wide secondary" href="games.html">← Back to Games</a>
  </main>
  <script src="arcade.js"></script>
  <script>
    const playsEl=document.getElementById('plays');
    const balanceEl=document.getElementById('balance');
    const statusEl=document.getElementById('gameStatus');
    const startButton=document.getElementById('startButton');
    function setStatus(text,mode){ statusEl.textContent=text; statusEl.className='game-status'+(mode?' '+mode:''); document.body.classList.toggle('game-active',mode==='running'); }
    function refreshChrome(){ playsEl.textContent=Arcade.remaining('laneRunner'); balanceEl.textContent=Arcade.number('points').toLocaleString(); if(typeof refreshReward==='function') refreshReward(); }
    function beginPlay(){
      if(!Arcade.consume('laneRunner')){ Arcade.out('laneRunner',refreshChrome); return false; }
      refreshChrome(); return true;
    }
    
    const canvas=document.getElementById('game'),laneControlZone=document.getElementById('laneControlZone'),ctx=canvas.getContext('2d'),timeEl=document.getElementById('time'),passedEl=document.getElementById('passed'),rewardPreviewEl=document.getElementById('rewardPreview');
    Arcade.gameGuide({game:'laneRunner',surface:canvas,steps:[{icon:'👆',title:'Start',text:'Tap board or press Enter'},{icon:'↔️',title:'Control',text:'Swipe left/right or use arrows'},{icon:'🏎️',title:'Goal',text:'Dodge traffic as long as you can'}],
      overlayIcon:'🏎️',overlayTitle:'Pick a Lane',overlayText:'Swipe left/right to change lanes. Avoid oncoming cars.',replayTitle:'Tap to Play Again',
      tips:['On computer use Left/Right arrows. On phone swipe left/right to change lanes.','Traffic gets faster and arrives more often the longer you survive.'],reward:'Long skilled runs keep earning. Survival time and passed cars can earn up to 35 Coins.'});
    const lanes=[72,180,288];let lane=1,targetLane=1,playerX=lanes[1],obstacles=[],passed=0,seconds=0,running=false,starting=false,animation=null,startAt=0,lastSpawn=0,lastSpawnLane=-1,sameLaneSpawns=0,roadOffset=0,lastFrame=0;
    function rewardFor(s,p){let c=Math.floor(s/8)+Math.floor(p/14);if(s>=30)c+=2;if(s>=60)c+=3;if(s>=90)c+=4;return Math.min(c,35)}
    function refreshReward(){rewardPreviewEl.textContent=rewardFor(seconds,passed)}
    function reset(){cancelAnimationFrame(animation);animation=null;lane=1;targetLane=1;playerX=lanes[1];obstacles=[];passed=0;seconds=0;startAt=0;lastSpawn=0;roadOffset=0;lastFrame=0;lastSpawnLane=-1;sameLaneSpawns=0;swipeStartX=null;swipeStartY=null;swipeLastX=null;swipeChangedLane=false;timeEl.textContent='0';passedEl.textContent='0';refreshReward();draw()}
    function drawCar(x,y,isPlayer,variant){
      ctx.save();ctx.translate(x,y);
      const body=isPlayer?'#ef4444':variant===1?'#38bdf8':variant===2?'#fbbf24':'#a78bfa';
      const trim=isPlayer?'#fecaca':variant===1?'#bae6fd':variant===2?'#fef3c7':'#ddd6fe';
      const halfWidth=variant===2&&!isPlayer?21:19;
      const nose=variant===1&&!isPlayer?-18:-16;

      // Soft shadow grounds each car without adding more fast-moving road detail.
      ctx.fillStyle='rgba(2,6,23,.46)';ctx.beginPath();ctx.ellipse(0,15,23,6,0,0,Math.PI*2);ctx.fill();

      ctx.shadowColor=isPlayer?'rgba(239,68,68,.20)':'rgba(56,189,248,.10)';
      ctx.shadowBlur=isPlayer?10:6;
      ctx.fillStyle=body;
      ctx.beginPath();
      ctx.moveTo(-halfWidth,10);ctx.lineTo(-halfWidth+2,-7);
      ctx.quadraticCurveTo(-halfWidth+4,nose,-7,nose);
      ctx.lineTo(8,nose);ctx.quadraticCurveTo(halfWidth-3,nose,halfWidth-1,-7);
      ctx.lineTo(halfWidth+1,10);ctx.quadraticCurveTo(halfWidth-1,16,13,16);
      ctx.lineTo(-13,16);ctx.quadraticCurveTo(-halfWidth,15,-halfWidth,10);ctx.closePath();ctx.fill();
      ctx.shadowBlur=0;

      // Different roof/window silhouettes make traffic readable at a glance.
      ctx.fillStyle=trim;
      ctx.beginPath();
      if(variant===2&&!isPlayer){
        ctx.moveTo(-11,-9);ctx.lineTo(-7,-14);ctx.lineTo(8,-14);ctx.lineTo(12,-9);
      }else if(variant===3&&!isPlayer){
        ctx.moveTo(-9,-9);ctx.lineTo(-4,-15);ctx.lineTo(5,-15);ctx.lineTo(10,-9);
      }else{
        ctx.moveTo(-10,-10);ctx.lineTo(-6,-14);ctx.lineTo(7,-14);ctx.lineTo(11,-10);
      }
      ctx.closePath();ctx.fill();

      ctx.fillStyle='#0b1220';ctx.beginPath();ctx.roundRect(-14,-5,28,9,3);ctx.fill();
      ctx.fillStyle=body;ctx.fillRect(-11,-4,22,7);

      if(variant===2&&!isPlayer){
        ctx.fillStyle='#111827';ctx.beginPath();ctx.roundRect(-9,-18,18,4,2);ctx.fill();
        ctx.fillStyle='#fef3c7';ctx.font='bold 5px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('CITY',0,-16);
      }else if(variant===3&&!isPlayer){
        ctx.fillStyle='rgba(255,255,255,.20)';ctx.fillRect(-12,1,24,2);
      }

      ctx.fillStyle='#020617';
      ctx.beginPath();ctx.roundRect(-23,-7,6,12,2);ctx.fill();ctx.beginPath();ctx.roundRect(17,-7,6,12,2);ctx.fill();
      ctx.beginPath();ctx.roundRect(-23,7,6,12,2);ctx.fill();ctx.beginPath();ctx.roundRect(17,7,6,12,2);ctx.fill();

      ctx.fillStyle=isPlayer?'#fef08a':'#dbeafe';ctx.fillRect(-13,-13,6,3);ctx.fillRect(7,-13,6,3);
      ctx.fillStyle='#fb7185';ctx.fillRect(-13,12,6,3);ctx.fillRect(7,12,6,3);

      if(isPlayer){
        ctx.fillStyle='#fff';ctx.font='bold 8px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('E',0,1);
        ctx.strokeStyle='rgba(254,240,138,.55)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(-15,-17,30,35,7);ctx.stroke();
      }
      ctx.restore();
    }
    function draw(){
      const sky=ctx.createLinearGradient(0,0,0,canvas.height);sky.addColorStop(0,'#06111f');sky.addColorStop(1,'#0a1524');ctx.fillStyle=sky;ctx.fillRect(0,0,canvas.width,canvas.height);

      // Calm neon roadway: no bright moving white dashes. Traffic supplies the
      // sense of speed while the road remains easy on the eyes.
      ctx.fillStyle='#091525';ctx.fillRect(0,0,24,canvas.height);ctx.fillRect(336,0,24,canvas.height);
      const road=ctx.createLinearGradient(24,0,336,0);
      road.addColorStop(0,'#111c2b');road.addColorStop(.16,'#152131');road.addColorStop(.5,'#172434');road.addColorStop(.84,'#152131');road.addColorStop(1,'#111c2b');
      ctx.fillStyle=road;ctx.fillRect(24,0,312,canvas.height);

      // Soft shoulder glow replaces the harsh white edge lines.
      ctx.fillStyle='rgba(34,211,238,.18)';ctx.fillRect(27,0,2,canvas.height);ctx.fillRect(331,0,2,canvas.height);
      ctx.fillStyle='rgba(59,130,246,.08)';ctx.fillRect(29,0,5,canvas.height);ctx.fillRect(326,0,5,canvas.height);

      // Fixed, low-contrast lane guides avoid flicker while keeping lanes clear.
      ctx.save();
      ctx.strokeStyle='rgba(125,211,252,.16)';
      ctx.lineWidth=2;
      ctx.shadowColor='rgba(34,211,238,.12)';
      ctx.shadowBlur=5;
      [126,234].forEach(x=>{ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke()});
      ctx.restore();

      // A gentle glow under the player's lane gives orientation without motion.
      const laneGlow=ctx.createRadialGradient(playerX,465,8,playerX,465,86);
      laneGlow.addColorStop(0,'rgba(34,211,238,.11)');laneGlow.addColorStop(1,'rgba(34,211,238,0)');
      ctx.fillStyle=laneGlow;ctx.fillRect(Math.max(24,playerX-92),372,184,150);

      ctx.fillStyle='rgba(6,17,31,.82)';ctx.beginPath();ctx.roundRect(38,12,112,28,8);ctx.fill();
      ctx.strokeStyle='rgba(56,189,248,.18)';ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle='#cbd5e1';ctx.font='bold 13px Arial';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(seconds<20?'CITY LIMITS':seconds<45?'FAST TRAFFIC':seconds<75?'RUSH HOUR':'HIGH SPEED',48,26);

      obstacles.forEach(o=>drawCar(lanes[o.lane],o.y,false,o.variant||0));
      drawCar(playerX,465,true,0);
    }
    function finish(){if(!running)return;running=false;pauseStartedAt=0;cancelAnimationFrame(animation);animation=null;lastFrame=0;lastSpawn=0;swipeStartX=null;swipeStartY=null;swipeLastX=null;swipeChangedLane=false;const earned=rewardFor(seconds,passed);Arcade.earn(earned,'Lane Runner',{kind:'game',game:'laneRunner',metric:seconds,aux:passed});Arcade.feedback('fail');const result=Arcade.recordResult('laneRunner',seconds);starting=false;refreshChrome();startButton.disabled=false;startButton.textContent='👆 Tap Game to Play Again';setStatus('Crash','over');draw();
      requestAnimationFrame(()=>Arcade.gameResult({icon:'🏎️',title:'Run Over',scoreLabel:'Seconds Survived',score:seconds,best:result.best.display,coins:earned,result,playsLeft:Arcade.remaining('laneRunner'),game:'laneRunner',extra:['⏱️ Time played: '+Math.max(1,Math.round((performance.now()-earnlyRunStartedAt-totalPausedMs)/1000))+'s','🚘 Cars passed: '+passed,seconds>=30?'🔥 Great highway run!':'Switch lanes early.'],onReplay:startGame,onMorePlays:()=>Arcade.out('laneRunner',refreshChrome)}))}
    function loop(now){
      if(!running)return;
      if(!lastFrame)lastFrame=now;
      const dt=Math.min(34,Math.max(0,now-lastFrame))/16.67;lastFrame=now;
      seconds=Math.floor((now-startAt)/1000);roadOffset=(roadOffset+Math.min(9,3.5+seconds*.055)*dt)%44;playerX+=(lanes[targetLane]-playerX)*Math.min(1,.24*dt);timeEl.textContent=String(seconds);refreshReward();
      const spawnGap=Math.max(330,880-seconds*9);
      if(!lastSpawn||now-lastSpawn>=spawnGap){
        let nextLane=Math.floor(Math.random()*3);
        if(nextLane===lastSpawnLane&&sameLaneSpawns>=2){
          const alternatives=[0,1,2].filter(v=>v!==lastSpawnLane);
          nextLane=alternatives[Math.floor(Math.random()*alternatives.length)];
        }
        sameLaneSpawns=nextLane===lastSpawnLane?sameLaneSpawns+1:1;
        lastSpawnLane=nextLane;
        obstacles.push({lane:nextLane,y:-28,speed:3.4+Math.min(5.2,seconds*.075),variant:1+Math.floor(Math.random()*3)});
        lastSpawn=now;
      }
      for(let i=obstacles.length-1;i>=0;i--){
        const o=obstacles[i],prevY=o.y;o.y+=o.speed*dt;
        // Check the full path between frames so fast traffic cannot tunnel through the player's car.
        const overlapsPlayerX=Math.abs(lanes[o.lane]-playerX)<40;
        const crossedPlayer=overlapsPlayerX&&prevY<495&&o.y>430;
        if(crossedPlayer){finish();return}
        if(o.y>550){
          obstacles.splice(i,1);passed++;passedEl.textContent=String(passed);
          if(passed===1||passed%10===0)Arcade.feedback('score');
        }
      }
      draw();animation=requestAnimationFrame(loop);
    }
    function setLane(n){const next=Math.max(0,Math.min(2,n));if(next===lane)return;lane=next;targetLane=next;Arcade.feedback('move')}
    let earnlyRunStartedAt=0,totalPausedMs=0,pauseStartedAt=0;
    function startGame(){if(running||starting)return;starting=true;if(!beginPlay()){starting=false;return} earnlyRunStartedAt=0; totalPausedMs=0; pauseStartedAt=0;reset();startButton.disabled=true;startButton.textContent='Get Ready…';setStatus('Get Ready');
      Arcade.countdown(()=>{starting=false;running=true;earnlyRunStartedAt=performance.now();startAt=earnlyRunStartedAt;lastSpawn=0;startButton.textContent='Game Running';setStatus('Running','running');animation=requestAnimationFrame(loop)})}
    Arcade.installPauseControl({isRunning:()=>running,pause:()=>{
      if(!running||pauseStartedAt)return;
      pauseStartedAt=performance.now();lastFrame=0;cancelAnimationFrame(animation);animation=null;swipeStartX=null;swipeStartY=null;swipeLastX=null;swipeChangedLane=false;
    },resume:()=>{
      if(!running||!pauseStartedAt)return;
      const d=performance.now()-pauseStartedAt;totalPausedMs+=d;pauseStartedAt=0;startAt+=d;if(lastSpawn)lastSpawn+=d;lastFrame=0;cancelAnimationFrame(animation);animation=null;animation=requestAnimationFrame(loop);
    }});
    let swipeStartX=null,swipeStartY=null,swipeLastX=null,swipeChangedLane=false;
    canvas.addEventListener('pointerdown',e=>{
      if(e.isPrimary===false||(e.pointerType==='mouse'&&e.button!==0))return;
      e.preventDefault();
      if(!running){if(!starting)startGame();swipeStartX=null;swipeStartY=null;return}
      swipeStartX=e.clientX;swipeStartY=e.clientY;swipeLastX=e.clientX;swipeChangedLane=false;
    },{passive:false});
    canvas.addEventListener('pointermove',e=>{if(!running||swipeLastX===null||swipeChangedLane)return;const dx=e.clientX-swipeStartX,dy=e.clientY-swipeStartY;if(Math.abs(dx)>=34&&Math.abs(dx)>Math.abs(dy)*1.15){e.preventDefault();setLane(lane+(dx>0?1:-1));swipeChangedLane=true}},{passive:false});
    canvas.addEventListener('pointerup',e=>{
      if(!running||swipeStartX===null)return;
      const dx=e.clientX-swipeStartX,dy=e.clientY-swipeStartY;
      swipeStartX=null;swipeStartY=null;
      if(!swipeChangedLane&&Math.abs(dx)>=28&&Math.abs(dx)>Math.abs(dy)*1.15){
        e.preventDefault();
        setLane(lane+(dx>0?1:-1));
      }
      swipeLastX=null;
      swipeChangedLane=false;
    },{passive:false});
    canvas.addEventListener('pointercancel',()=>{swipeStartX=null;swipeStartY=null;swipeLastX=null;swipeChangedLane=false});
    function laneSwipeStart(e){if(!running||e.isPrimary===false||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();swipeStartX=e.clientX;swipeStartY=e.clientY;swipeLastX=e.clientX;swipeChangedLane=false}
    function laneSwipeEnd(e){if(!running||swipeStartX===null)return;const dx=e.clientX-swipeStartX,dy=e.clientY-swipeStartY;swipeStartX=null;swipeStartY=null;swipeLastX=null;if(!swipeChangedLane&&Math.abs(dx)>=24&&Math.abs(dx)>Math.abs(dy)*1.15){e.preventDefault();setLane(lane+(dx>0?1:-1))}swipeChangedLane=false}
    function laneSwipeMove(e){if(!running||swipeLastX===null||swipeChangedLane)return;const dx=e.clientX-swipeStartX,dy=e.clientY-swipeStartY;if(Math.abs(dx)>=34&&Math.abs(dx)>Math.abs(dy)*1.15){e.preventDefault();setLane(lane+(dx>0?1:-1));swipeChangedLane=true}}
    laneControlZone.addEventListener('pointerdown',laneSwipeStart,{passive:false});laneControlZone.addEventListener('pointermove',laneSwipeMove,{passive:false});laneControlZone.addEventListener('pointerup',laneSwipeEnd,{passive:false});laneControlZone.addEventListener('pointercancel',()=>{swipeStartX=null;swipeStartY=null;swipeLastX=null;swipeChangedLane=false});
    document.addEventListener('pointerdown',e=>{if(!running||e.target===canvas||laneControlZone.contains(e.target)||e.clientY<window.innerHeight-145)return;laneSwipeStart(e)},{passive:false});
    document.addEventListener('pointermove',e=>{if(!running||swipeLastX===null||e.target===canvas||laneControlZone.contains(e.target))return;laneSwipeMove(e)},{passive:false});
    document.addEventListener('pointerup',e=>{if(!running||swipeStartX===null)return;laneSwipeEnd(e)},{passive:false});
    document.addEventListener('keydown',e=>{
      if((e.key==='Enter'||e.key===' ')&&!running&&!starting){e.preventDefault();startGame();return}
      if(!running)return;
      if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){e.preventDefault();setLane(lane-1)}
      if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){e.preventDefault();setLane(lane+1)}
    });
    startButton.addEventListener('click',startGame);reset();refreshChrome();
