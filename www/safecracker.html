<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Earnly">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="earnly-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="earnly-icon.svg">
  <title>Earnly Safe Cracker</title>
  <link rel="stylesheet" href="arcade.css">
  <link rel="stylesheet" href="premium.css?v=32">
  <style>
    html,body,.container{touch-action:manipulation}
    body.safecracker-page.game-active,body.safecracker-page.game-active .container,body.safecracker-page.game-active .safe-board,body.safecracker-page.game-active .safe-tap-zone{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    body.safecracker-page.game-active .safe-board,body.safecracker-page.game-active .safe-tap-zone{-webkit-tap-highlight-color:transparent}
    .safe-board{display:block;width:min(88vw,360px);height:auto;margin:8px auto;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:18px}
    @media(max-width:600px){
      body.safecracker-page main.container{padding-top:max(14px,calc(env(safe-area-inset-top) + 8px))!important}
      body.safecracker-page .topbar{margin-bottom:6px}
      body.safecracker-page .page-header{
        margin:2px 0 7px!important;
        padding:11px!important;
        gap:6px!important;
        border:1px solid rgba(34,197,94,.30)!important;
        border-radius:18px!important;
        background:
          radial-gradient(circle at 88% 0%,rgba(34,197,94,.10),transparent 38%),
          radial-gradient(circle at 12% 100%,rgba(250,204,21,.06),transparent 34%),
          linear-gradient(145deg,rgba(17,40,44,.97),rgba(8,23,35,.97))!important;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 14px 30px rgba(0,0,0,.18)!important
      }
      body.safecracker-page .page-header h1{margin:0!important;font-size:22px!important;line-height:1.05!important;letter-spacing:-.035em!important}
      .game-meta{gap:4px;margin:4px 0 5px}
      .meta-pill{padding:4px 7px;font-size:10px}
      .game-status{padding:4px 8px;font-size:10px}
      .safe-board{margin-top:6px}
      body.safecracker-page .game-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;width:100%}
      body.safecracker-page .meta-pill{
        min-height:37px!important;
        padding:4px 3px!important;
        display:flex!important;
        align-items:center!important;
        justify-content:center!important;
        text-align:center!important;
        font-size:9px!important;
        font-weight:850!important;
        border:1px solid rgba(67,119,164,.34)!important;
        border-radius:11px!important;
        background:linear-gradient(145deg,rgba(16,34,55,.96),rgba(8,21,36,.96))!important;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.025)!important
      }
      body.safecracker-page .meta-pill:nth-child(3){
        border-color:rgba(255,193,77,.30)!important;
        color:#ffd86b!important
      }
      body.safecracker-page .safe-board{
        width:min(92vw,380px);
        border:2px solid rgba(34,197,94,.30);
        background:#071620;
        box-shadow:
          inset 0 0 36px rgba(0,0,0,.22),
          0 16px 36px rgba(0,0,0,.28),
          0 0 18px rgba(34,197,94,.06)
      }
      body.safecracker-page.game-active .game-guide-strip,body.safecracker-page.game-active .game-guide-more,body.safecracker-page.game-active .game-guide-overlay,body.safecracker-page.game-active .game-overlay{display:none!important}
      body.safecracker-page.game-active .topbar,body.safecracker-page.game-active #startButton{display:none!important}
      body.safecracker-page.game-active .page-header{margin:0 0 4px}
      body.safecracker-page.game-active .page-header h1{font-size:22px!important;margin:0 0 4px!important}
      body.safecracker-page.game-active .game-meta{margin:2px 0 4px}
      body.safecracker-page.game-active .game-status{padding:3px 8px;font-size:9px}
      body.safecracker-page.game-active .safe-board{
        margin:5px auto 4px;
        width:min(94vw,390px);
        border-color:rgba(34,197,94,.48)!important;
        box-shadow:
          inset 0 0 42px rgba(0,0,0,.20),
          0 18px 38px rgba(0,0,0,.28),
          0 0 22px rgba(34,197,94,.08)!important
      }
      body.safecracker-page .safe-tap-zone{display:none}
      body.safecracker-page.game-active .safe-tap-zone{
        display:flex;width:min(92vw,380px);height:48px;margin:7px auto 0;
        border:1px solid rgba(74,222,128,.48);border-radius:16px;
        background:linear-gradient(180deg,#1b4b34,#123122);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 22px rgba(0,0,0,.16);
        align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:900;color:#ecfdf5;
        touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none
      }
      body.safecracker-page.game-active .safe-tap-zone:active{transform:scale(.985);background:#1d4733}
      body.safecracker-page.game-active .safecracker-exit{
        display:inline-flex!important;position:fixed!important;top:max(8px,env(safe-area-inset-top))!important;left:9px!important;z-index:1300!important;width:auto!important;min-height:38px!important;margin:0!important;padding:8px 11px!important;border:1px solid rgba(248,113,113,.55)!important;border-radius:12px!important;background:rgba(69,10,10,.92)!important;color:#fecaca!important;font-size:12px!important;font-weight:900!important;box-shadow:0 8px 24px rgba(0,0,0,.35)!important;backdrop-filter:blur(8px)
      }
      body.safecracker-page.game-active #earnlyPauseButton{
        position:fixed!important;top:max(8px,env(safe-area-inset-top))!important;right:9px!important;z-index:1300!important;width:auto!important;min-width:86px!important;min-height:38px!important;margin:0!important;padding:8px 11px!important;border-radius:12px!important;font-size:12px!important;font-weight:900!important;backdrop-filter:blur(8px)
      }
      body.safecracker-page.game-active main.container{padding-top:max(54px,calc(env(safe-area-inset-top) + 48px))!important}
    }
      .safe-round-timer{max-width:360px;margin:6px auto 5px;text-align:center;font-size:12px;font-weight:900;color:#fbbf24;min-height:18px}
    .safe-round-timer.urgent{color:#f87171;animation:safeTimerPulse .55s ease-in-out infinite alternate}
    .safe-combo-line{min-height:24px;margin:0 auto 6px;text-align:center;color:#86efac;font-size:11px;font-weight:900}
    .safe-combo-line.hot{color:#fde68a;text-shadow:0 0 12px rgba(250,204,21,.25)}
    @keyframes safeTimerPulse{from{transform:scale(1)}to{transform:scale(1.04)}}
</style>
</head>
<body class="safecracker-page">
  <main class="container">
    <div class="topbar">
      <a class="brand" href="games.html">← Games</a>
      <a class="balance-chip" href="rewards.html">🪙 <span id="balance">0</span></a>
    </div>
    <header class="page-header">
      <h1>🔐 Safe Cracker</h1>
      <div class="game-meta"><span class="meta-pill">Locks: <span id="score">0</span></span>
        <span class="meta-pill">Lives: <span id="lives">3</span></span>
        <span class="meta-pill">Reward: <span id="rewardPreview">0</span> 🪙</span>
        <span class="meta-pill"><span id="plays">0</span> plays left</span></div>
      <span class="game-status" id="gameStatus">Ready</span>
    </header>
    <button class="green wide" id="startButton" type="button">👆 Tap the Game to Start</button>
    <canvas class="safe-board touch-surface" id="game" width="360" height="300" aria-label="Safe Cracker timing game"></canvas>
    <div class="safe-tap-zone" id="safeTapZone">🔓 TAP ANYWHERE TO CRACK</div>
    <div class="safe-round-timer" id="safeRoundTimer" aria-live="off"></div>
    <div class="safe-combo-line" id="safeComboLine" aria-live="polite">Build a 4-hit streak for a bonus lock</div>
    <a class="button wide secondary safecracker-exit" id="safeCrackerExit" href="games.html">✕ Quit Game</a>
  </main>
  <script src="arcade.js"></script>
  <script>
    const playsEl=document.getElementById('plays');
    const balanceEl=document.getElementById('balance');
    const statusEl=document.getElementById('gameStatus');
    const startButton=document.getElementById('startButton');
    function setStatus(text,mode){ statusEl.textContent=text; statusEl.className='game-status'+(mode?' '+mode:''); document.body.classList.toggle('game-active',mode==='running'); }
    function refreshChrome(){ playsEl.textContent=Arcade.remaining('safeCracker'); balanceEl.textContent=Arcade.number('points').toLocaleString(); if(typeof refreshReward==='function') refreshReward(); }
    function beginPlay(){
      if(!Arcade.consume('safeCracker')){ Arcade.out('safeCracker',refreshChrome); return false; }
      refreshChrome(); return true;
    }
    
    const canvas=document.getElementById('game'),safeTapZone=document.getElementById('safeTapZone'),safeRoundTimer=document.getElementById('safeRoundTimer'),safeComboLine=document.getElementById('safeComboLine'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),rewardPreviewEl=document.getElementById('rewardPreview');
    Arcade.gameGuide({game:'safeCracker',surface:canvas,steps:[{icon:'👆',title:'Start',text:'Tap board or press Enter'},{icon:'🎯',title:'Time it',text:'Stop inside the green zone'},{icon:'🔐',title:'Goal',text:'Crack as many locks as possible'}],
      overlayIcon:'🔐',overlayTitle:'Stop in the Green',overlayText:'Tap fast: you have only a few seconds before the safe costs you a life.',replayTitle:'Tap to Play Again',
      tips:['Each successful lock makes the target smaller and the marker faster.','You get 3 misses before the run ends.'],reward:'Locks cracked can earn up to 25 Coins.'});
    let score=0,lives=3,hitStreak=0,bestStreak=0,targetX=120,targetW=90,marker=30,dir=1,speed=3,running=false,starting=false,animation=null,bounces=0,maxBounces=4,roundStartedAt=0,roundLimit=5200,lastAttemptAt=0,roundLocked=false;
    function rewardFor(v){let c=Math.floor(v/2);if(v>=8)c+=2;if(v>=15)c+=4;if(v>=25)c+=5;return Math.min(c,25)}
    function refreshReward(){rewardPreviewEl.textContent=rewardFor(score)}
    function newTarget(){roundLocked=false;targetW=Math.max(28,90-score*3);targetX=25+Math.random()*(310-targetW);speed=Math.min(9,3+score*.22);bounces=0;roundStartedAt=performance.now();roundLimit=Math.max(2600,5200-score*110)}
    function reset(){cancelAnimationFrame(animation);animation=null;score=0;lives=3;hitStreak=0;bestStreak=0;marker=30;dir=1;bounces=0;speed=3;targetX=25;targetW=90;roundStartedAt=0;roundLimit=0;lastAttemptAt=0;roundLocked=false;safeRoundTimer.textContent='';safeRoundTimer.classList.remove('urgent');safeComboLine.className='safe-combo-line';safeComboLine.textContent='Build a 4-hit streak for a bonus lock';scoreEl.textContent='0';livesEl.textContent='3';newTarget();refreshReward();draw()}
    function draw(){
      const bg=ctx.createLinearGradient(0,0,0,canvas.height);bg.addColorStop(0,'#0b1627');bg.addColorStop(1,'#101b2d');ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#162338';ctx.beginPath();ctx.roundRect(18,70,324,150,18);ctx.fill();
      ctx.fillStyle='#94a3b8';ctx.font='800 11px Arial';ctx.textAlign='center';ctx.fillText('LINE UP THE PIN',180,98);
      ctx.fillStyle='#07101e';ctx.beginPath();ctx.roundRect(25,128,310,38,10);ctx.fill();
      const glow=ctx.createLinearGradient(targetX,0,targetX+targetW,0);glow.addColorStop(0,'#16a34a');glow.addColorStop(.5,'#4ade80');glow.addColorStop(1,'#16a34a');ctx.fillStyle=glow;ctx.beginPath();ctx.roundRect(targetX,128,targetW,38,8);ctx.fill();
      ctx.shadowColor='#fff';ctx.shadowBlur=9;ctx.fillStyle='#fff';ctx.fillRect(marker-2.5,108,5,78);ctx.shadowBlur=0;ctx.beginPath();ctx.moveTo(marker-10,105);ctx.lineTo(marker+10,105);ctx.lineTo(marker,91);ctx.closePath();ctx.fill();
      ctx.fillStyle='#cbd5e1';ctx.font='800 12px Arial';ctx.fillText('TAP WHEN THE PIN IS IN GREEN',180,203);
      ctx.fillStyle='#64748b';ctx.font='700 10px Arial';ctx.fillText('Target shrinks • Speed increases',180,239);
      if(running){const left=Math.max(0,(roundLimit-(performance.now()-roundStartedAt))/1000);ctx.fillStyle=left<1.6?'#f87171':'#fbbf24';ctx.font='900 15px Arial';ctx.fillText('ACT NOW  '+left.toFixed(1)+'s',180,272)}
    }
    function finish(){if(!running)return;running=false;roundLocked=true;safeRoundTimer.textContent='';safeRoundTimer.classList.remove('urgent');cancelAnimationFrame(animation);animation=null;pauseStartedAt=0;roundStartedAt=0;roundLimit=0;lastAttemptAt=0;const earned=rewardFor(score);Arcade.earn(earned,'Safe Cracker',{kind:'game',game:'safeCracker',metric:score});const result=Arcade.recordResult('safeCracker',score);starting=false;refreshChrome();startButton.disabled=false;startButton.textContent='👆 Tap Game to Play Again';setStatus('Locked Out','over');draw();
      Arcade.gameResult({icon:'🔐',title:'Safe Run Over',scoreLabel:'Locks Cracked',score,best:result.best.display,coins:earned,result,playsLeft:Arcade.remaining('safeCracker'),game:'safeCracker',extra:['⏱️ Time played: '+Math.max(1,Math.round((performance.now()-earnlyRunStartedAt-totalPausedMs)/1000))+'s','🔥 Best hit streak: '+bestStreak,score>=15?'🔥 Master timing!':'Wait until the marker is centered.'],onReplay:startGame,onMorePlays:()=>Arcade.out('safeCracker',refreshChrome)})}
    function attempt(){
      if(!running||roundLocked||document.body.classList.contains('earnly-game-paused'))return;
      // Enforce the exact round deadline here too. The animation frame that
      // detects timeout can arrive a few milliseconds after a user's tap.
      if(roundStartedAt && performance.now()-roundStartedAt>=roundLimit){
        loseLife('Too slow');
        return;
      }
      roundLocked=true;
      const now=performance.now();
      // iPhone can occasionally deliver near-duplicate pointer input when a
      // tap crosses nested gameplay zones. One physical tap should crack once.
      if(now-lastAttemptAt<140){roundLocked=false;return}
      lastAttemptAt=now;
      const hit=marker>=targetX&&marker<=targetX+targetW;
      if(hit){
        score++;
        hitStreak++;
        bestStreak=Math.max(bestStreak,hitStreak);
        let bonus=0;
        if(hitStreak%4===0){
          bonus=1;
          score+=bonus;
          safeComboLine.className='safe-combo-line hot';
          safeComboLine.textContent='🔥 '+hitStreak+' HIT STREAK · +1 BONUS LOCK';
          Arcade.milestone('🔥 '+hitStreak+' straight · Bonus lock!','perfect');
        }else{
          safeComboLine.className='safe-combo-line';
          safeComboLine.textContent='✓ '+hitStreak+' hit streak · '+(4-(hitStreak%4))+' to bonus';
        }
        scoreEl.textContent=String(score);Arcade.feedback('perfect');newTarget();marker=dir>0?30:330;refreshReward()
      }
      else{loseLife('Missed the green')}
    }
    function loseLife(reason){if(!running)return;hitStreak=0;safeComboLine.className='safe-combo-line';safeComboLine.textContent='Streak reset · build 4 clean hits for a bonus';lives--;livesEl.textContent=String(lives);Arcade.feedback('fail');if(lives<=0){finish();return}setStatus(reason+' · '+lives+' lives','running');newTarget();marker=dir>0?30:330}
    function loop(){if(!running)return;const roundLeft=Math.max(0,roundLimit-(performance.now()-roundStartedAt));safeRoundTimer.textContent='⏱ '+(roundLeft/1000).toFixed(1)+'s to tap';safeRoundTimer.classList.toggle('urgent',roundLeft<=1600);if(roundLeft<=0){loseLife('Too slow');if(!running)return}marker+=speed*dir;if(marker>=332){marker=332;dir=-1;bounces++;if(bounces>=maxBounces){loseLife('Too many passes');if(!running)return}}else if(marker<=28){marker=28;dir=1;bounces++;if(bounces>=maxBounces){loseLife('Too many passes');if(!running)return}}draw();animation=requestAnimationFrame(loop)}
    let earnlyRunStartedAt=0,totalPausedMs=0,pauseStartedAt=0;
    function startGame(){if(running||starting)return;starting=true;if(!beginPlay()){starting=false;return} earnlyRunStartedAt=0; totalPausedMs=0; pauseStartedAt=0;reset();startButton.disabled=true;startButton.textContent='Get Ready…';setStatus('Get Ready');
      Arcade.countdown(()=>{starting=false;running=true;earnlyRunStartedAt=performance.now();startButton.textContent='Game Running';setStatus('Running','running');document.querySelectorAll('.game-guide-overlay,.game-overlay').forEach(el=>el.style.display='none');requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'auto'}));animation=requestAnimationFrame(loop)})}
    canvas.addEventListener('pointerdown',e=>{if(e.isPrimary===false||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();if(!running){if(!starting)startGame();return}attempt()});
    safeTapZone.addEventListener('pointerdown',e=>{if(!running||e.isPrimary===false||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();attempt()},{passive:false});
    document.addEventListener('pointerdown',e=>{
      if(!running||e.isPrimary===false||(e.pointerType==='mouse'&&e.button!==0))return;
      if(Arcade.isProtectedGameControlTarget(e.target)||e.target===canvas||safeTapZone.contains(e.target))return;
      e.preventDefault();
      attempt();
    },{passive:false});
    document.addEventListener('keydown',e=>{if(Arcade.isProtectedGameControlTarget(e.target))return;if(e.key==='Enter'&&!running&&!starting){e.preventDefault();startGame();return}if(running&&(e.code==='Space'||e.key==='Enter')){e.preventDefault();attempt()}});
    Arcade.installPauseControl({isRunning:()=>running,pause:()=>{pauseStartedAt=performance.now();cancelAnimationFrame(animation);animation=null;},resume:()=>{if(!running||!pauseStartedAt)return;const pausedFor=Math.max(0,performance.now()-pauseStartedAt);totalPausedMs+=pausedFor;if(roundStartedAt)roundStartedAt+=pausedFor;pauseStartedAt=0;cancelAnimationFrame(animation);animation=requestAnimationFrame(loop);}});
    startButton.addEventListener('click',startGame);reset();refreshChrome();
  
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cloud.js"></script>
</body>
</html>
