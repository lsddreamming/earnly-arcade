<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b20"><title>Neon Breach · Earnly Arcade</title><link rel="icon" href="earnly-icon.svg"><link rel="stylesheet" href="arcade.css"><link rel="stylesheet" href="premium.css?v=37"><link rel="stylesheet" href="neonbreach.css"></head>
