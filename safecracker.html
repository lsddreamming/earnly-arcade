<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Earnly">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="earnly-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="earnly-icon.svg">
  <title>Earnly Safe Cracker</title>
  <link rel="stylesheet" href="arcade.css">
  <style>.safe-board{width:min(88vw,360px);height:auto;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:18px}</style>
</head>
<body>
  <main class="container">
    <div class="topbar">
      <a class="brand" href="games.html">← Games</a>
      <a class="balance-chip" href="rewards.html">🪙 <span id="balance">0</span></a>
    </div>
    <header class="page-header">
      <h1>🔐 Safe Cracker</h1>
      <div class="game-meta"><span class="meta-pill">Locks: <span id="score">0</span></span>
        <span class="meta-pill">Lives: <span id="lives">3</span></span>
        <span class="meta-pill">Reward: <span id="rewardPreview">0</span> 🪙</span>
        <span class="meta-pill"><span id="plays">0</span> plays left</span></div>
      <span class="game-status" id="gameStatus">Ready</span>
    </header>
    <button class="green wide" id="startButton" type="button">👆 Tap the Game to Start</button>
    <canvas class="safe-board touch-surface" id="game" width="360" height="300" aria-label="Safe Cracker timing game"></canvas>
    <a class="button wide secondary" href="games.html">← Back to Games</a>
  </main>
  <script src="arcade.js"></script>
  <script>
    const playsEl=document.getElementById('plays');
    const balanceEl=document.getElementById('balance');
    const statusEl=document.getElementById('gameStatus');
    const startButton=document.getElementById('startButton');
    function setStatus(text,mode){ statusEl.textContent=text; statusEl.className='game-status'+(mode?' '+mode:''); }
    function refreshChrome(){ playsEl.textContent=Arcade.remaining('safeCracker'); balanceEl.textContent=Arcade.number('points').toLocaleString(); if(typeof refreshReward==='function') refreshReward(); }
    function beginPlay(){
      if(!Arcade.consume('safeCracker')){ Arcade.out('safeCracker',refreshChrome); return false; }
      refreshChrome(); return true;
    }
    
    const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),rewardPreviewEl=document.getElementById('rewardPreview');
    Arcade.gameGuide({game:'safeCracker',surface:canvas,steps:[{icon:'👆',title:'Start',text:'Tap board or press Enter'},{icon:'🎯',title:'Time it',text:'Stop inside the green zone'},{icon:'🔐',title:'Goal',text:'Crack as many locks as possible'}],
      overlayIcon:'🔐',overlayTitle:'Stop in the Green',overlayText:'Tap or press Space when the moving marker is inside the green target.',replayTitle:'Tap to Play Again',
      tips:['Each successful lock makes the target smaller and the marker faster.','You get 3 misses before the run ends.'],reward:'Locks cracked can earn up to 25 Coins.'});
    let score=0,lives=3,targetX=120,targetW=90,marker=30,dir=1,speed=3,running=false,starting=false,animation=null;
    function rewardFor(v){let c=Math.floor(v/2);if(v>=8)c+=2;if(v>=15)c+=4;if(v>=25)c+=5;return Math.min(c,25)}
    function refreshReward(){rewardPreviewEl.textContent=rewardFor(score)}
    function newTarget(){targetW=Math.max(28,90-score*3);targetX=25+Math.random()*(310-targetW);speed=Math.min(9,3+score*.22)}
    function reset(){score=0;lives=3;marker=30;dir=1;scoreEl.textContent='0';livesEl.textContent='3';newTarget();refreshReward();draw()}
    function draw(){
      ctx.fillStyle='#101b2d';ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#0b1220';ctx.fillRect(25,128,310,34);ctx.fillStyle='#22c55e';ctx.fillRect(targetX,128,targetW,34);
      ctx.fillStyle='#fff';ctx.fillRect(marker-3,105,6,80);ctx.beginPath();ctx.moveTo(marker-9,102);ctx.lineTo(marker+9,102);ctx.lineTo(marker,90);ctx.closePath();ctx.fill();
      ctx.fillStyle='#94a3b8';ctx.font='700 13px Arial';ctx.textAlign='center';ctx.fillText('STOP THE MARKER INSIDE THE GREEN ZONE',180,220);
    }
    function finish(){if(!running)return;running=false;cancelAnimationFrame(animation);animation=null;const earned=rewardFor(score);Arcade.earn(earned,'Safe Cracker',{kind:'game',game:'safeCracker',metric:score});Arcade.feedback('fail');const result=Arcade.recordResult('safeCracker',score);starting=false;refreshChrome();startButton.disabled=false;startButton.textContent='👆 Tap Game to Play Again';setStatus('Locked Out','over');draw();
      Arcade.gameResult({icon:'🔐',title:'Safe Run Over',scoreLabel:'Locks Cracked',score,best:result.best.display,coins:earned,result,playsLeft:Arcade.remaining('safeCracker'),game:'safeCracker',extra:[score>=15?'🔥 Master timing!':'Wait until the marker is centered.'],onReplay:startGame,onMorePlays:()=>Arcade.out('safeCracker',refreshChrome)})}
    function attempt(){
      if(!running)return;const hit=marker>=targetX&&marker<=targetX+targetW;
      if(hit){score++;scoreEl.textContent=String(score);Arcade.feedback('perfect');if(score===8)Arcade.milestone('🔐 8 locks cracked!');if(score===15)Arcade.milestone('🔥 15 locks · Safe Master!','perfect');newTarget();marker=dir>0?30:330;refreshReward()}
      else{lives--;livesEl.textContent=String(lives);Arcade.feedback('fail');if(lives<=0){finish();return}}
    }
    function loop(){if(!running)return;marker+=speed*dir;if(marker>=332){marker=332;dir=-1}else if(marker<=28){marker=28;dir=1}draw();animation=requestAnimationFrame(loop)}
    function startGame(){if(running||starting)return;starting=true;if(!beginPlay()){starting=false;return}reset();startButton.disabled=true;startButton.textContent='Get Ready…';setStatus('Get Ready');
      Arcade.countdown(()=>{starting=false;running=true;startButton.textContent='Game Running';setStatus('Running','running');animation=requestAnimationFrame(loop)})}
    canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(!running){if(!starting)startGame();return}attempt()});
    document.addEventListener('pointerdown',e=>{
      if(e.target===canvas||!Arcade.inExpandedGameZone(e,canvas,135))return;
      e.preventDefault();
      if(!running){if(!starting)startGame();return}
      attempt();
    },{passive:false});
    document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!running&&!starting){e.preventDefault();startGame();return}if(running&&(e.code==='Space'||e.key==='Enter')){e.preventDefault();attempt()}});
    startButton.addEventListener('click',startGame);reset();refreshChrome();
  
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cloud.js"></script>
</body>
</html>
