<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earnly Rewards</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 40px 20px;
    }

    .card {
      background: #1f2937;
      padding: 25px;
      border-radius: 18px;
      margin: 20px 0;
    }

    .money {
      font-size: 42px;
      font-weight: bold;
      margin: 10px 0;
    }

    button {
      width: 100%;
      padding: 18px;
      margin: 10px 0;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .reward-button {
      background: #f59e0b;
      color: white;
    }

    .back-button {
      background: #374151;
      color: white;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎁 Earnly Rewards</h1>

    <div class="card">
      <p>Reward Balance</p>
      <div class="money">$0.00</div>
      <p>Redeemable rewards will appear here later.</p>
    </div>

    <button class="reward-button" disabled>
      🎁 Gift Cards — Coming Soon
    </button>

    <button class="reward-button" disabled>
      ₿ Bitcoin — Coming Soon
    </button>

    <button class="back-button" onclick="window.location.href='index.html'">
      ⬅ Back Home
    </button>

  </div>

</body>
</html>
